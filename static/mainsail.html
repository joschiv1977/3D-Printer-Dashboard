<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title id="page-title">Mainsail - 3D Printer Dashboard</title>

    <link rel="manifest" href="/manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">

    <!-- Shared Styles -->
    <link rel="stylesheet" href="/static/css/shared-styles.css?v=2">
    <link rel="stylesheet" href="/static/font-awesome.min.css">
    <link rel="stylesheet" href="/static/css/design-tokens.css?v=2">
    <link rel="stylesheet" href="/static/css/base.css?v=2">
    <link rel="stylesheet" href="/static/css/tab-bar.css?v=2">

    <!-- Sprachdateien -->
    <script src="/static/lang/de.js"></script>
    <script src="/static/lang/en.js"></script>
    <script src="/static/lang/fr.js"></script>
    <script src="/static/lang/es.js"></script>
    <script src="/static/lang/it.js"></script>

    <script>
        (function () {
            const theme = localStorage.getItem('theme') || 'auto';
            if (theme === 'dark') document.documentElement.classList.add('dark-mode');
            else if (theme === 'auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
                document.documentElement.classList.add('dark-mode');
        })();
    </script>

    <style>
        html, body { height: 100%; margin: 0; }
        body { background: var(--bg-primary, #1e1e1e); overflow: hidden; }
        /* Webview fuellt den ganzen Bereich; das Dock schwebt (Apple-Style)
           drueber — kein reservierter Streifen, kein weisser Balken. */
        #ms-wrap { position: fixed; inset: 0; }
        #ms-view { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; }
        .ms-overlay {
            position: absolute; inset: 0;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 16px; text-align: center; padding: 24px;
            color: var(--text-primary, #eee); background: var(--bg-primary, #1e1e1e);
        }
        /* Dock garantiert ueber der Webview halten (Apple-Style schwebend). */
        .floating-tab-bar { z-index: 2147483000 !important; }
        .ms-overlay .ms-icon { font-size: 48px; opacity: .55; }
        .ms-overlay .ms-msg { font-size: 16px; max-width: 440px; line-height: 1.4; }
        .ms-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        .ms-btn {
            display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px;
            border-radius: 8px; border: 1px solid var(--border-color, #444);
            background: var(--bg-card, #2a2a2a); color: var(--text-primary, #eee);
            cursor: pointer; font-size: 15px;
        }
        .ms-btn:hover { background: var(--bg-hover, #333); }
    </style>
</head>
<body>
    <div id="ms-wrap">
        <div id="ms-overlay" class="ms-overlay">
            <div class="ms-icon"><i class="fa-solid fa-spinner fa-spin"></i></div>
            <div class="ms-msg" data-i18n="mainsail_loading">Mainsail wird geladen…</div>
        </div>
    </div>

    <script src="/static/js/modules/icons.js"></script>
    <script src="/static/js/modules/theme-manager.js"></script>
    <script src="/static/js/modules/i18n-manager.js"></script>
    <script src="/static/js/modules/tab-bar-manager.js"></script>

    <script>
    (function () {
        // Dock rendern (wie alle anderen Seiten — sonst bleibt das Dock leer).
        if (window.tabBarManager) window.tabBarManager.render();

        const wrap = document.getElementById('ms-wrap');
        const overlay = document.getElementById('ms-overlay');
        const T = (k, fb) => (window.texts && window.texts[k]) || fb;
        // <webview> gibt es nur in der Electron-App; im normalen Browser Fallback.
        const isElectron = /electron/i.test(navigator.userAgent);

        function showOverlay(html) { overlay.innerHTML = html; overlay.style.display = 'flex'; }
        function hideOverlay() { overlay.style.display = 'none'; }

        // klipper_base_url zeigt auf Moonraker (Port 7125). Die native Web-UI
        // (Mainsail) laeuft auf Port 80 → Port strippen, nur Protokoll+Host.
        function buildTarget(baseUrl) {
            try { const u = new URL(baseUrl); return u.protocol + '//' + u.hostname + '/'; }
            catch (_) { return baseUrl; }
        }

        function showOffline(target) {
            showOverlay(
                '<div class="ms-icon"><i class="fa-solid fa-plug-circle-xmark"></i></div>' +
                '<div class="ms-msg">' + T('printer_offline_no_web', 'Drucker aus — Web-UI nicht erreichbar') + '</div>' +
                '<div class="ms-actions">' +
                    '<button class="ms-btn" id="ms-retry"><i class="fa-solid fa-rotate-right"></i> ' + T('mainsail_reload', 'Erneut versuchen') + '</button>' +
                    (target ? '<button class="ms-btn" id="ms-ext"><i class="fa-solid fa-up-right-from-square"></i> ' + T('mainsail_open_browser', 'Im Browser öffnen') + '</button>' : '') +
                '</div>'
            );
            const r = document.getElementById('ms-retry'); if (r) r.onclick = () => location.reload();
            const e = document.getElementById('ms-ext'); if (e) e.onclick = () => window.open(target, '_blank', 'noopener');
        }

        function loadEmbedded(target) {
            const view = document.createElement(isElectron ? 'webview' : 'iframe');
            view.id = 'ms-view';
            view.setAttribute('src', target);
            if (isElectron) {
                view.setAttribute('allowpopups', '');
                // WebGL im Webview explizit an (3D-Heightmap/Bed-Mesh in Mainsail).
                view.setAttribute('webpreferences', 'webgl=yes');
                view.addEventListener('did-fail-load', (ev) => {
                    // Sub-Resources und ERR_ABORTED (-3) ignorieren; nur echter
                    // Mainframe-Fehler (Drucker aus/unerreichbar) → Offline-Overlay.
                    if (ev.isMainFrame === false) return;
                    if (ev.errorCode === -3) return;
                    showOffline(target);
                });
                view.addEventListener('did-stop-loading', hideOverlay);
            } else {
                view.addEventListener('load', hideOverlay);
                // Im Browser kann das Einbetten an Mixed-Content/X-Frame-Options
                // scheitern → nach kurzem Timeout den Fallback anbieten.
                setTimeout(() => { if (overlay.style.display !== 'none') showOffline(target); }, 6000);
            }
            wrap.insertBefore(view, overlay);
        }

        async function init() {
            let info = {};
            try {
                const r = await fetch('/api/printer-info', { credentials: 'same-origin' });
                if (r.ok) info = await r.json();
            } catch (_) {}
            const base = info && info.klipper_base_url;
            if (!base) {
                showOverlay(
                    '<div class="ms-icon"><i class="fa-solid fa-circle-info"></i></div>' +
                    '<div class="ms-msg">' + T('mainsail_no_klipper', 'Mainsail ist nur im Klipper-Modus verfügbar.') + '</div>'
                );
                return;
            }
            loadEmbedded(buildTarget(base));
        }
        init();
    })();
    </script>
</body>
</html>
