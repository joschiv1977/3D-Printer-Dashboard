<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebRTC Camera</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
video {
    width: 100%; height: 100%;
    object-fit: contain;
    background: #000;
}
/* Until the first frame arrives there was only black here. On the first call
   after switching on, go2rtc dials the printer only at that moment -- that
   takes a while and looked "broken". */
#warte {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center; gap: 9px;
    flex-wrap: wrap; text-align: center; padding: 0 14px;
    color: #b8bcc8; font: 500 13px/1.4 -apple-system, BlinkMacSystemFont,
        "Segoe UI", system-ui, sans-serif;
    background: #000;
    transition: opacity 0.25s;
}
#warte.weg { opacity: 0; pointer-events: none; }
#warte svg { width: 15px; height: 15px; stroke: currentColor; fill: none;
    stroke-width: 2; stroke-linecap: round; }
#warte .dreh { animation: dreh 1.1s linear infinite; transform-origin: 50% 50%; }
#warte-grund {
    display: none; width: 100%; margin-top: 6px;
    font-size: 11px; color: #f0a0a0; word-break: break-word;
}
@keyframes dreh { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { #warte .dreh { animation: none; } }
</style>
</head>
<body>
<video id="v" autoplay muted playsinline></video>
<div id="warte">
    <svg class="dreh" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 3a9 9 0 1 0 9 9"/>
    </svg>
    <span id="warte-text"></span>
    <span id="warte-grund"></span>
</div>
<script>
(function() {
    const params = new URLSearchParams(location.search);
    const token = params.get('token') || '';
    const zoom = params.get('zoom') === '1';
    const video = document.getElementById('v');

    // This page does not load static/lang/*.js (it hangs in a WKWebView and
    // should fetch nothing) -- hence the one line here, the way
    // custom-notification.html does it in the Electron app.
    const TEXTE = {
        de: 'Verbinde mit der Kamera …', en: 'Connecting to the camera …',
        es: 'Conectando con la cámara …', fr: 'Connexion à la caméra …',
        it: 'Connessione alla telecamera …',
    };
    // The reasons it does NOT work. These three stood hard-coded in German
    // while the waiting line beside them was translated.
    const GRUENDE = {
        kein_webrtc: {
            de: 'Dieser Browser kennt kein WebRTC (RTCPeerConnection fehlt)',
            en: 'This browser has no WebRTC (RTCPeerConnection missing)',
            es: 'Este navegador no admite WebRTC (falta RTCPeerConnection)',
            fr: "Ce navigateur ne connaît pas WebRTC (RTCPeerConnection manquant)",
            it: 'Questo browser non conosce WebRTC (manca RTCPeerConnection)',
        },
        ice: {
            de: 'ICE fehlgeschlagen — kein Medienweg zu go2rtc',
            en: 'ICE failed — no media path to go2rtc',
            es: 'ICE falló: no hay ruta de medios a go2rtc',
            fr: 'Échec ICE — aucun chemin média vers go2rtc',
            it: 'ICE non riuscito — nessun percorso media verso go2rtc',
        },
        kein_bild: {
            de: 'Verbunden, aber kein Bild — Medienweg blockiert?',
            en: 'Connected, but no picture — media path blocked?',
            es: 'Conectado, pero sin imagen: ¿ruta de medios bloqueada?',
            fr: 'Connecté, mais pas d’image — chemin média bloqué ?',
            it: 'Connesso, ma nessuna immagine — percorso media bloccato?',
        },
    };
    const grund = (name) => (GRUENDE[name] || {})[sprache] || (GRUENDE[name] || {}).de || name;
    const sprache = (params.get('lang') || 'de').slice(0, 2);
    const warte = document.getElementById('warte');
    document.getElementById('warte-text').textContent =
        TEXTE[sprache] || TEXTE.de;

    // Gone as soon as a picture really is there -- not already on connecting.
    video.addEventListener('playing', function() { warte.classList.add('weg'); });
    video.addEventListener('loadeddata', function() { warte.classList.add('weg'); });
    function wiederZeigen() { warte.classList.remove('weg'); }

    // The reason belongs on the screen, not in a console nobody sees inside
    // a WKWebView. Without it only "connecting …" stands there -- whether the
    // certificate was rejected, the signalling reports 503, or simply no media
    // path comes about.
    const grundZeile = document.getElementById('warte-grund');
    let versuche = 0;
    function sagWarum(text) {
        versuche += 1;
        grundZeile.textContent = versuche > 1
            ? text + ' (' + versuche + '. Versuch)'
            : text;
        grundZeile.style.display = 'block';
    }

    if (zoom) {
        video.style.objectFit = 'cover';
    }

    let pc = null;
    let stopped = false;

    // Anything going wrong OUTSIDE the try below used to vanish without a
    // trace -- a WKWebView has no console to look in. Catch both here and
    // write them on the screen.
    window.addEventListener('error', function (e) {
        sagWarum('Skriptfehler: ' + (e.message || 'unbekannt'));
    });
    window.addEventListener('unhandledrejection', function (e) {
        sagWarum('Abgelehnt: ' + String((e.reason && e.reason.message) || e.reason));
    });

    async function start() {
        if (stopped) return;
        if (pc) { pc.close(); pc = null; }

        // Does this engine have WebRTC at all? The constructor used to stand
        // before the try -- when it failed the script broke off and the page
        // stayed on "connecting" without a word.
        if (typeof RTCPeerConnection !== 'function') {
            sagWarum(grund('kein_webrtc'));
            return;
        }
        try {
            pc = new RTCPeerConnection({iceServers: []});
        } catch (e) {
            sagWarum('RTCPeerConnection: ' + String((e && e.message) || e));
            return;
        }

        pc.ontrack = function(e) {
            video.srcObject = e.streams[0];
            video.play().catch(function() {});
        };

        pc.oniceconnectionstatechange = function() {
            if (pc && pc.iceConnectionState === 'failed') {
                sagWarum(grund('ice'));
            }
        };

        pc.onconnectionstatechange = function() {
            if (pc && (pc.connectionState === 'failed' || pc.connectionState === 'disconnected')) {
                console.log('WebRTC lost, reconnecting...');
                wiederZeigen();
                setTimeout(start, 2000);
            }
        };

        pc.addTransceiver('video', {direction: 'recvonly'});

        try {
            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);

            await new Promise(function(resolve) {
                if (pc.iceGatheringState === 'complete') return resolve();
                pc.onicegatheringstatechange = function() {
                    if (pc.iceGatheringState === 'complete') resolve();
                };
                setTimeout(resolve, 2000);
            });

            const base = location.origin;
            const resp = await fetch(base + '/api/camera/webrtc', {
                method: 'POST',
                body: pc.localDescription.sdp,
                headers: {
                    'Content-Type': 'application/sdp',
                    'X-Device-Token': token
                }
            });

            if (!resp.ok) throw new Error('HTTP ' + resp.status + ' bei /api/camera/webrtc');

            const answer = await resp.text();
            await pc.setRemoteDescription({type: 'answer', sdp: answer});
            console.log('WebRTC connected');

            // Offer accepted but still no picture after ten seconds? Then the
            // signalling stands and the media path is missing -- exactly the
            // case ICE over TCP produces in WebKit. That belongs on the screen
            // too.
            setTimeout(function () {
                if (!stopped && video.readyState < 2) {
                    sagWarum(grund('kein_bild'));
                }
            }, 10000);
        } catch (e) {
            console.error('WebRTC error:', e);
            if (pc) { pc.close(); pc = null; }
            wiederZeigen();
            sagWarum(String((e && e.message) || e));
            setTimeout(start, 3000);
        }
    }

    // A clean teardown on a page change (prevents green frames and the overlay)
    function cleanup() {
        stopped = true;
        if (pc) {
            pc.ontrack = null;
            pc.onconnectionstatechange = null;
            pc.close();
            pc = null;
        }
        video.srcObject = null;
        video.load();
    }

    window.addEventListener('pagehide', cleanup);
    window.addEventListener('beforeunload', cleanup);

    // A global teardown function, called from the app via evaluateJavaScript
    window.cleanupWebRTC = cleanup;

    start();
})();
</script>
</body>
</html>
