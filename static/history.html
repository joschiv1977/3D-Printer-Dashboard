            Plotly.react('detail-mesh-plot', data, layout, { displayModeBar: false, responsive: true, scrollZoom: true });
            setTimeout(function () { try { Plotly.Plots.resize('detail-mesh-plot'); } catch (e) {} }, 250);
        }
        function fmtMesh(n, dp) { return (Math.round(n * Math.pow(10, dp)) / Math.pow(10, dp)).toFixed(dp); }
        function updateHistoryMeshInfo(d) {
            var z = d.matrix || [];
            var rows = z.length, cols = (z[0] && z[0].length) || 0;
            var vMax = -Infinity, vMin = Infinity, maxR = 0, maxC = 0, minR = 0, minC = 0;
            for (var r = 0; r < rows; r++) for (var c = 0; c < (z[r] || []).length; c++) {
                var v = z[r][c]; if (v == null || isNaN(v)) continue;
                if (v > vMax) { vMax = v; maxR = r; maxC = c; }
                if (v < vMin) { vMin = v; minR = r; minC = c; }
            }
            function coordAt(rr, cc) {
                var mnx = (d.mesh_min && d.mesh_min[0]) || 0, mny = (d.mesh_min && d.mesh_min[1]) || 0;
                var mxx = (d.mesh_max && d.mesh_max[0]) || 0, mxy = (d.mesh_max && d.mesh_max[1]) || 0;
                return [cols > 1 ? mnx + (mxx - mnx) * cc / (cols - 1) : mnx,
                        rows > 1 ? mny + (mxy - mny) * rr / (rows - 1) : mny];
            }
            var mx = coordAt(maxR, maxC), mn = coordAt(minR, minC);
            var spread = (isFinite(vMax) && isFinite(vMin)) ? (vMax - vMin) : 0;
            document.getElementById('detail-mesh-name').textContent = d.profile_name || '—';
            document.getElementById('detail-mesh-size').textContent = cols + 'x' + rows;
            var maxLbl = document.getElementById('detail-mesh-max-label'), minLbl = document.getElementById('detail-mesh-min-label');
            if (isFinite(vMax)) { maxLbl.textContent = 'Max [' + fmtMesh(mx[0], 1) + ', ' + fmtMesh(mx[1], 1) + ']'; document.getElementById('detail-mesh-max').textContent = fmtMesh(vMax, 3) + ' mm'; }
            if (isFinite(vMin)) { minLbl.textContent = 'Min [' + fmtMesh(mn[0], 1) + ', ' + fmtMesh(mn[1], 1) + ']'; document.getElementById('detail-mesh-min').textContent = fmtMesh(vMin, 3) + ' mm'; }
            document.getElementById('detail-mesh-range').textContent = fmtMesh(spread, 3) + ' mm';
        }
        var _histMeshRendered = false;
        function showBedMeshTab() {
            const bm = currentPrintData && currentPrintData.print && currentPrintData.print.bed_mesh;
            const empty = document.getElementById('detail-mesh-empty');
            const wrap = document.getElementById('detail-mesh-wrap');
            if (!bm || !bm.matrix || !bm.matrix.length) {
                empty.textContent = texts.bedmesh_none || 'Kein Bed-Mesh gespeichert';
                empty.style.display = 'block';
                wrap.style.display = 'none';
                return;
            }
            empty.style.display = 'none';
            wrap.style.display = 'block';
            // Draw only once per detail opening (the WebGL setup is expensive,
            // and the tab has not changed while the modal is open).
            if (!_histMeshRendered) { renderHistoryMesh(bm); _histMeshRendered = true; }
            updateHistoryMeshInfo(bm);
        }

        function showConsoleLog() {
            if (!currentPrintData || !currentPrintData.console_log) {
                document.getElementById('detail-console').textContent = '';
                return;
            }
            // Escape the HTML, prepend a timestamp per line, monospace.
            const escape = s => String(s)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            const lines = currentPrintData.console_log.map(l => {
                const t = (l.time || '').slice(11, 19); // HH:MM:SS aus ISO
                return `<span style="color:var(--text-secondary, #888);">${t}</span>  ${escape(l.message)}`;
            });
            const el = document.getElementById('detail-console');
            // Only follow along while the reader IS at the bottom. Whoever
            // has scrolled up to an older line has said what they want to
            // look at; the next refresh must not drag them away from it.
            const warAmEnde = el.scrollHeight - el.scrollTop - el.clientHeight <= 40;
            el.innerHTML = lines.join('\n');
            if (warAmEnde) el.scrollTop = el.scrollHeight;
        }

        // Show progress chart
        // The trace: chips on top instead of a Chart.js legend, events as
        // vertical marks IN the diagram, and an overview bar to zoom into.
        //
        // Why the zoom: a five-hour print produces about 660 samples. On 1000
        // pixels every pixel then carries two measurements -- the nozzle curve
        // becomes a zigzag band in which single excursions can no longer be
        // told from noise. In a section the same points lie far apart and the
        // curve flattens out.
        var _verlaufReihen = null;
        var _vPunkte = [];        // Messpunkte des aktuellen Drucks
        var _vZeit = [];          // deren Zeitstempel in ms
        var _vT0 = 0, _vT1 = 0;   // Anfang und Ende des ganzen Drucks
        var _vVon = 0, _vBis = 0; // sichtbarer Ausschnitt
        var _vMarken = [];        // Ereignisse als {ms, typ}
        var _vMarkenAn = true;

        // A series normally reads one field of the sample. The dual nozzle
        // needs more: its values sit in the sub-object nozzle_temps, so a
        // series may compute as well.
        function _vWert(p, r) { return r.wert ? r.wert(p) : p[r.key]; }

        function _vZeitpunkt(wert) {
            return new Date(String(wert).replace(' ', 'T')).getTime();
        }
        function _vUhr(ms) {
            const d = new Date(ms);
            return isNaN(d) ? '' : d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
        }
        // Indices of the visible range, one each beyond it on the left and
        // right, so the lines do not end in mid-air at the edge.
        function _vBereich() {
            let a = _vZeit.findIndex(t => t >= _vVon);
            if (a < 0) a = 0;
            a = Math.max(0, a - 1);
            let b = _vZeit.length - 1;
            for (let i = a; i < _vZeit.length; i++) if (_vZeit[i] > _vBis) { b = i; break; }
            return { a, b: Math.min(_vZeit.length - 1, b) };
        }

        function showProgressChart() {
            if (!currentPrintData || !currentPrintData.progress) return;
            const pr = currentPrintData.progress;
            const wrap = document.querySelector('#chart-tab .hist-chart-wrap');
            if (!wrap) return;

            if (!pr.length) {
                wrap.innerHTML = `<div class="hist-empty"><p>${texts.events_no_events || ''}</p></div>`;
                return;
            }

            _vPunkte = pr;
            _vZeit = pr.map(p => _vZeitpunkt(p.time));
            _vT0 = _vZeit[0];
            _vT1 = _vZeit[_vZeit.length - 1];
            _vVon = _vT0;
            _vBis = _vT1;
            _vMarkenAn = true;

            _vMarken = (currentPrintData.events || []).map(ev => {
                const t = _vZeitpunkt(ev.time);
                return isNaN(t) ? null : { ms: t, typ: ev.type };
            }).filter(Boolean).filter(m => m.ms >= _vT0 && m.ms <= _vT1);

            // …and every change of the active nozzle as a mark of its own.
            // That is the "when": without them one only sees THAT two curves run.
            let vorher = null;
            pr.forEach((p, k) => {
                const jetzt = p.active_nozzle;
                if (jetzt == null) return;
                if (vorher != null && jetzt !== vorher) _vMarken.push({ ms: _vZeit[k], typ: 'tool' });
                vorher = jetzt;
            });
            _vMarken.sort((x, y) => x.ms - y.ms);

            const chamber = pr.some(p => p.chamber_temp != null);
            const leistung = pr.some(p => p.power_watts != null);

            // Dual nozzle: nozzle_temp carries the value of the CURRENTLY
            // ACTIVE nozzle (measured on the X2D). Drawn as one curve it
            // jumped by 150-200 degrees at a tool change without it being
            // recognisable as a change rather than a fault. Where the
            // individual values exist, each nozzle gets a curve of its own.
            const duesenIds = [...new Set(pr.flatMap(
                p => p.nozzle_temps ? Object.keys(p.nozzle_temps) : []))].sort();
            const doppel = duesenIds.length > 1;
            const duesenName = i => (i === '0' ? (texts.temp_nozzle_left_full || 'Düse links')
                                   : i === '1' ? (texts.temp_nozzle_right_full || 'Düse rechts')
                                   : `${texts.chart_label_nozzle} ${Number(i) + 1}`);
            const duesenFarbe = { '0': '#ef4444', '1': '#f97316' };

            _verlaufReihen = [
                { key: 'progress',    name: texts.chart_label_progress, farbe: '#14b8a6', achse: 'y-percent', einheit: ' %' }
            ];
            if (doppel) {
                duesenIds.forEach(i => _verlaufReihen.push({
                    key: 'nozzle_' + i, name: duesenName(i),
                    farbe: duesenFarbe[i] || '#ef4444', achse: 'y-temp', einheit: ' °C',
                    wert: p => (p.nozzle_temps ? p.nozzle_temps[i] : null)
                }));
            } else {
                _verlaufReihen.push({ key: 'nozzle_temp', name: texts.chart_label_nozzle,
                    farbe: '#ef4444', achse: 'y-temp', einheit: ' °C' });
            }
            _verlaufReihen.push(
                { key: 'bed_temp', name: texts.chart_label_bed, farbe: '#3b82f6', achse: 'y-temp', einheit: ' °C' });
            if (chamber) _verlaufReihen.push(
                { key: 'chamber_temp', name: texts.detail_chamber, farbe: '#f59e0b', achse: 'y-temp', einheit: ' °C' });
            // The power has always been in print_progress.power_watts and came
            // along through the API -- only nobody ever drew it here.
            // Yellow as in the live trace (chart-manager.js 'power'), so the
            // same curve is recognisable again.
            if (leistung) _verlaufReihen.push(
                { key: 'power_watts', name: texts.chart_label_power, farbe: '#ffce56', achse: 'y-watt', einheit: ' W' });

            wrap.innerHTML = `
                <div class="hv-karte">
                    <div class="hv-karte-kopf">${HIST_ICO.fortschritt} ${texts.detail_chart_tab}</div>
                    <div class="hv-chips" id="hv-chips"></div>
                    <div class="hv-leinwand" id="hv-buehne"><canvas id="printProgressChart"></canvas></div>
                    <div class="hv-spur" id="hv-spur">
                        <canvas id="hv-mini"></canvas>
                        <span class="hv-schatten" id="hv-schatten-l"></span>
                        <span class="hv-schatten" id="hv-schatten-r"></span>
                        <span class="hv-fenster" id="hv-fenster">
                            <i class="hv-griff hv-griff--l" data-griff="l"></i>
                            <i class="hv-griff hv-griff--r" data-griff="r"></i>
                        </span>
                    </div>
                    <div class="hv-spur-fuss">
                        <span id="hv-f-von"></span>
                        <span id="hv-f-mitte"></span>
                        <span id="hv-f-bis"></span>
                    </div>
                    <div class="hv-zoom-hilfe">
                        <span><kbd>${texts.chart_hint_wheel_key || 'Mausrad'}</kbd> ${texts.chart_hint_wheel || 'zoomt'}</span>
                        <span><kbd>${texts.chart_hint_drag_key || 'Ziehen'}</kbd> ${texts.chart_hint_drag || 'verschiebt'}</span>
                        <span><kbd>${texts.chart_hint_dbl_key || 'Doppelklick'}</kbd> ${texts.chart_hint_dbl || 'zeigt wieder alles'}</span>
                    </div>
                </div>`;

            _vBaueChart();
            _vBaueMini();
            _vBindeZoom();
            _vAlles();
        }

        function _vBaueChart() {
            const ctx = document.getElementById('printProgressChart').getContext('2d');
            if (printProgressChart) printProgressChart.destroy();

            const cs = getComputedStyle(document.body);
            const gitter = cs.getPropertyValue('--border-color').trim() || 'rgba(128,128,128,.3)';
            const beschriftung = cs.getPropertyValue('--text-secondary').trim() || '#999';

            // The marks sit on positions of the category axis. Because zooming
            // clips the data itself, the plugin recomputes them from the
            // timestamp every time.
            const markenPlugin = {
                id: 'hvMarken',
                beforeDatasetsDraw(chart) {
                    const { ctx: c, chartArea, scales } = chart;
                    if (!chartArea || !_vMarkenAn) return;
                    const { a, b } = _vBereich();
                    c.save();
                    c.setLineDash([3, 3]);
                    c.lineWidth = 1;
                    _vMarken.forEach(m => {
                        if (m.ms < _vZeit[a] || m.ms > _vZeit[b]) return;
                        let i = a;
                        for (let k = a; k <= b; k++) if (_vZeit[k] <= m.ms) i = k;
                        const x = scales.x.getPixelForValue(i - a);
                        if (x < chartArea.left || x > chartArea.right) return;
                        c.strokeStyle = m.typ === 'print_error' ? 'rgba(239,68,68,.75)'
                            : m.typ === 'finish' ? 'rgba(34,197,94,.7)'
                            : m.typ === 'tool' ? 'rgba(168,85,247,.75)' : 'rgba(245,158,11,.6)';
                        c.beginPath(); c.moveTo(x, chartArea.top); c.lineTo(x, chartArea.bottom); c.stroke();
                    });
                    c.restore();
                }
            };

            printProgressChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: _verlaufReihen.map(r => ({
                        label: r.name, data: [],
                        borderColor: r.farbe, backgroundColor: r.farbe + '22',
                        yAxisID: r.achse, tension: .25, pointRadius: 0, borderWidth: 2, spanGaps: true
                    }))
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    animation: false,
                    interaction: { mode: 'index', intersect: false },
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { grid: { color: gitter, drawTicks: false },
                             ticks: { color: beschriftung, maxTicksLimit: 8 } },
                        'y-percent': { type: 'linear', position: 'left', min: 0, max: 100,
                            grid: { color: gitter }, ticks: { color: beschriftung, callback: v => v + ' %' } },
                        'y-temp': { type: 'linear', position: 'right', min: 0,
                            grid: { drawOnChartArea: false }, ticks: { color: beschriftung, callback: v => v + ' °' } },
                        // display:'auto' -- the axis appears only while the
                        // power curve is switched on. Otherwise three axes
                        // would stand side by side on every print.
                        'y-watt': { type: 'linear', position: 'right', min: 0, display: 'auto',
                            grid: { drawOnChartArea: false }, ticks: { color: beschriftung, callback: v => v + ' W' } }
                    }
                },
                plugins: [markenPlugin]
            });
        }

        // The overview bar: always the whole print, heavily simplified.
        function _vBaueMini() {
            const c = document.getElementById('hv-mini');
            const spur = document.getElementById('hv-spur');
            const b = spur.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            c.width = Math.max(1, b.width * dpr);
            c.height = Math.max(1, b.height * dpr);
            const g = c.getContext('2d');
            g.setTransform(dpr, 0, 0, dpr, 0, 0);
            g.clearRect(0, 0, b.width, b.height);

            // A maximum of its own per axis: forcing watts and degrees into
            // the same scale would press the temperature curves flat against
            // the floor (1000 W against 250 °C).
            const achsMax = { 'y-temp': 60, 'y-watt': 1 };
            _vPunkte.forEach(p => {
                achsMax['y-temp'] = Math.max(achsMax['y-temp'],
                    p.nozzle_temp || 0, p.bed_temp || 0, p.chamber_temp || 0,
                    ...Object.values(p.nozzle_temps || {}).map(v => v || 0));
                achsMax['y-watt'] = Math.max(achsMax['y-watt'], p.power_watts || 0);
            });
            const X = t => (t - _vT0) / (_vT1 - _vT0 || 1) * b.width;

            _verlaufReihen.forEach((r, i) => {
                if (printProgressChart && !printProgressChart.isDatasetVisible(i)) return;
                g.beginPath(); g.lineWidth = 1.2; g.strokeStyle = r.farbe; g.globalAlpha = .9;
                let start = true;
                for (let k = 0; k < _vPunkte.length; k++) {
                    const v = _vWert(_vPunkte[k], r);
                    if (v == null) continue;
                    const bezug = r.achse === 'y-percent' ? 100 : (achsMax[r.achse] || 1);
                    const y = b.height - (v / bezug) * (b.height - 6) - 3;
                    const x = X(_vZeit[k]);
                    if (start) { g.moveTo(x, y); start = false; } else g.lineTo(x, y);
                }
                g.stroke();
            });
            g.globalAlpha = 1;
        }

        // The chips carry the highest and lowest value of the VISIBLE range.
        function _vChips() {
            const { a, b } = _vBereich();
            const el = document.getElementById('hv-chips');
            if (!el) return;
            el.innerHTML = _verlaufReihen.map((r, i) => {
                let min = Infinity, max = -Infinity;
                for (let k = a; k <= b; k++) {
                    const v = _vWert(_vPunkte[k], r);
                    if (v == null) continue;
                    if (v < min) min = v;
                    if (v > max) max = v;
                }
                const eh = r.einheit || '';
                const wert = (min === Infinity) ? ''
                    : (r.key === 'progress' ? Math.round(max) + eh
                       : (Math.round(min) === Math.round(max)
                          ? Math.round(max) + eh
                          : Math.round(min) + '–' + Math.round(max) + eh));
                const aus = printProgressChart && !printProgressChart.isDatasetVisible(i);
                return `<button class="hv-chip${aus ? ' hv-chip--aus' : ''}" data-reihe="${i}">
                    <span class="hv-chip-punkt" style="background:${r.farbe}"></span>${r.name}
                    ${wert ? `<span class="hv-chip-wert">${wert}</span>` : ''}</button>`;
            }).join('')
            + (_vMarken.length ? `<button class="hv-chip${_vMarkenAn ? '' : ' hv-chip--aus'}" id="hv-chip-marken">
                    <span class="hv-chip-punkt" style="background:var(--color-orange)"></span>
                    ${texts.detail_events_tab}</button>` : '')
            + `<span class="hv-chip-luft"></span>
               <span class="hv-bereich">
                 <button data-b="alles">${texts.chart_range_all || 'Alles'}</button>
                 <button data-b="erste">${texts.chart_range_first || 'Erste Stunde'}</button>
                 <button data-b="letzte">${texts.chart_range_last || 'Letzte Stunde'}</button>
               </span>`;

            el.querySelectorAll('[data-reihe]').forEach(k => k.onclick = () => {
                const i = Number(k.dataset.reihe);
                printProgressChart.setDatasetVisibility(i, !printProgressChart.isDatasetVisible(i));
                _vAlles();
            });
            const mk = document.getElementById('hv-chip-marken');
            if (mk) mk.onclick = () => { _vMarkenAn = !_vMarkenAn; _vAlles(); };
            el.querySelectorAll('[data-b]').forEach(k => k.onclick = () => {
                const art = k.dataset.b;
                if (art === 'alles')  { _vVon = _vT0; _vBis = _vT1; }
                if (art === 'erste')  { _vVon = _vT0; _vBis = Math.min(_vT1, _vT0 + 3600000); }
                if (art === 'letzte') { _vVon = Math.max(_vT0, _vT1 - 3600000); _vBis = _vT1; }
                _vAlles();
            });
        }

        function _vFenster() {
            const spur = document.getElementById('hv-spur');
            if (!spur) return;
            const b = spur.getBoundingClientRect();
            const l = (_vVon - _vT0) / (_vT1 - _vT0 || 1) * b.width;
            const r = (_vBis - _vT0) / (_vT1 - _vT0 || 1) * b.width;
            const f = document.getElementById('hv-fenster');
            f.style.left = l + 'px';
            f.style.width = Math.max(6, r - l) + 'px';
            document.getElementById('hv-schatten-l').style.width = Math.max(0, l) + 'px';
            document.getElementById('hv-schatten-r').style.left = r + 'px';
            document.getElementById('hv-schatten-r').style.width = Math.max(0, b.width - r) + 'px';

            const { a, b: bb } = _vBereich();
            const min = Math.round((_vBis - _vVon) / 60000);
            const dauer = min < 60 ? `${min} min`
                : `${Math.floor(min / 60)}:${String(min % 60).padStart(2, '0')} h`;
            document.getElementById('hv-f-von').textContent = _vUhr(_vVon);
            document.getElementById('hv-f-bis').textContent = _vUhr(_vBis);
            document.getElementById('hv-f-mitte').textContent =
                `${dauer} · ${bb - a + 1} ${texts.chart_points || 'Messpunkte'}`;
        }

        function _vZeichne() {
            if (!printProgressChart) return;
            const { a, b } = _vBereich();
            const teil = _vPunkte.slice(a, b + 1);

            printProgressChart.data.labels = teil.map(p => _vUhr(_vZeitpunkt(p.time)));
            _verlaufReihen.forEach((r, i) => {
                printProgressChart.data.datasets[i].data = teil.map(p => _vWert(p, r));
            });

            // The temperature axis follows the section. Without that the curve
            // sticks flat to the bottom edge while zooming in, because the axis
            // still reaches to the maximum of the whole print.
            let tMax = 0;
            _verlaufReihen.forEach((r, i) => {
                if (r.achse !== 'y-temp') return;
                if (!printProgressChart.isDatasetVisible(i)) return;
                teil.forEach(p => { const v = _vWert(p, r); if (v != null) tMax = Math.max(tMax, v); });
            });
            printProgressChart.options.scales['y-temp'].max =
                Math.max(60, Math.ceil(tMax / 20) * 20 + 10);

            printProgressChart.update('none');
        }

        function _vAlles() { _vChips(); _vBaueMini(); _vFenster(); _vZeichne(); }

        function _vBindeZoom() {
            const spur = document.getElementById('hv-spur');
            const buehne = document.getElementById('hv-buehne');
            const MIN = 60000;   // enger als eine Minute wird nicht gezoomt
            let zieh = null, schieb = null;

            spur.addEventListener('pointerdown', e => {
                const b = spur.getBoundingClientRect();
                const x = e.clientX - b.left;
                const griff = e.target.dataset ? e.target.dataset.griff : null;
                const l = (_vVon - _vT0) / (_vT1 - _vT0) * b.width;
                const r = (_vBis - _vT0) / (_vT1 - _vT0) * b.width;
                if (griff === 'l' || griff === 'r') zieh = { art: griff, b };
                else if (x >= l && x <= r) zieh = { art: 'schieben', b, greifX: x, von: _vVon, bis: _vBis };
                else {
                    // A click beside it puts the window of the same width there.
                    const breite = _vBis - _vVon;
                    const mitte = _vT0 + x / b.width * (_vT1 - _vT0);
                    _vVon = Math.max(_vT0, Math.min(_vT1 - breite, mitte - breite / 2));
                    _vBis = _vVon + breite;
                    zieh = { art: 'schieben', b, greifX: x, von: _vVon, bis: _vBis };
                    _vAlles();
                }
                spur.setPointerCapture(e.pointerId);
            });
            spur.addEventListener('pointermove', e => {
                if (!zieh) return;
                const x = e.clientX - zieh.b.left;
                const t = _vT0 + Math.max(0, Math.min(1, x / zieh.b.width)) * (_vT1 - _vT0);
                if (zieh.art === 'l') _vVon = Math.min(t, _vBis - MIN);
                else if (zieh.art === 'r') _vBis = Math.max(t, _vVon + MIN);
                else {
                    const versatz = (x - zieh.greifX) / zieh.b.width * (_vT1 - _vT0);
                    const breite = zieh.bis - zieh.von;
                    _vVon = Math.max(_vT0, Math.min(_vT1 - breite, zieh.von + versatz));
                    _vBis = _vVon + breite;
                }
                _vAlles();
            });
            spur.addEventListener('pointerup', () => { zieh = null; });

            buehne.addEventListener('wheel', e => {
                e.preventDefault();
                const b = buehne.getBoundingClientRect();
                const anteil = Math.max(0, Math.min(1, (e.clientX - b.left - 44) / (b.width - 90)));
                const mitte = _vVon + (_vBis - _vVon) * anteil;   // Punkt unterm Zeiger bleibt stehen
                let breite = (_vBis - _vVon) * (e.deltaY > 0 ? 1.25 : 0.8);
                breite = Math.max(MIN, Math.min(_vT1 - _vT0, breite));
                _vVon = mitte - breite * anteil;
                _vBis = _vVon + breite;
                if (_vVon < _vT0) { _vVon = _vT0; _vBis = _vT0 + breite; }
                if (_vBis > _vT1) { _vBis = _vT1; _vVon = _vT1 - breite; }
                _vAlles();
            }, { passive: false });

            buehne.addEventListener('pointerdown', e => {
                schieb = { x: e.clientX, von: _vVon, bis: _vBis, b: buehne.getBoundingClientRect() };
                buehne.setPointerCapture(e.pointerId);
            });
            buehne.addEventListener('pointermove', e => {
                if (!schieb) return;
                const breite = schieb.bis - schieb.von;
                const versatz = -(e.clientX - schieb.x) / (schieb.b.width - 90) * breite;
                _vVon = Math.max(_vT0, Math.min(_vT1 - breite, schieb.von + versatz));
                _vBis = _vVon + breite;
                _vAlles();
            });
            buehne.addEventListener('pointerup', () => { schieb = null; });
            buehne.addEventListener('dblclick', () => { _vVon = _vT0; _vBis = _vT1; _vAlles(); });
        }

        // History-Event-`details` → lesbarer Text. Pendant zu Androids
        // KlipperEventFormatter: Companion liefert rohes JSON {"key":"events.x","vars":{}}
        // (or a raw key) -> we translate client-side via texts.klipper_evt_*.
        function formatEventDetail(details) {
            if (!details) return '';
            // IMPORTANT: the local `texts` (filled via i18nManager.getAllTexts()),
            // NOT window.texts (which is not set here) -- otherwise the
            // klipper_evt_* templates are missing and the bare key stands.
            const t = (typeof texts !== 'undefined' && texts) ? texts : (window.texts || {});
            const resolveKey = (key, vars) => {
                const name = 'klipper_evt_' + key.replace(/^events\./, '').replace(/^stages\./, '');
                let text = t[name];
                if (!text) return null;
                for (const k in vars) text = text.split('{' + k + '}').join(vars[k] == null ? '' : vars[k]);
                return text.replace(/\{[a-zA-Z_]+\}/g, '').replace(/\s{2,}/g, ' ').trim();
            };
            // Fall 1: roher Key "events.xxx"/"stages.xxx"
            if ((details.startsWith('events.') || details.startsWith('stages.')) && !details.includes('{')) {
                return resolveKey(details, {}) || details.replace(/^(events|stages)\./, '');
            }
            // Fall 2: JSON {"key","vars"}
            const s = String(details).trim();
            if (s.startsWith('{')) {
                try {
                    const obj = JSON.parse(s);
                    if (obj.key) {
                        const vars = {};
                        if (obj.vars && typeof obj.vars === 'object') {
                            for (const k in obj.vars) vars[k] = obj.vars[k] == null ? '' : String(obj.vars[k]);
                        }
                        return resolveKey(obj.key, vars) || String(obj.key).replace(/^(events|stages)\./, '');
                    }
                } catch (e) { /* kein gültiges JSON → Fall 3 */ }
            }
            // Case 3: an already finished text
            return details;
        }

        // Show events timeline
        /**
         * The phases of this print as a bar.
         *
         * The printer reports every stage change (stage_change). Those used
         * to stand only as rows under each other -- that ten of twelve
         * minutes went into the preconditioning had to be worked out from
         * timestamps. The duration of a stage is the time until the next
         * change, the last one until the end of the print.
         *
         * The same derivation as in analytics.js, which averages it over
         * every print -- here for this single one.
         */
        function phasenLeiste(events, ohneEmoji) {
            // Only the six largest phases get a colour of their own, the rest
            // goes grey. Each of the up to 33 phases used to have a colour
            // from a palette of eight -- cyan and blue came round twice, and
            // the legend could no longer be mapped onto the bar.
            const FARBEN = ['#3b82f6', '#f59e0b', '#10b981',
                            '#a855f7', '#ef4444', '#06b6d4'];
            const GRAU = '#94a3b8';
            const ZEIGEN = 6;
            const zeit = t => new Date(String(t).replace(' ', 'T').slice(0, 19));

            // The printer writes the stage into the database already
            // translated ("Druckt" / "Printing" / "Impression"), depending on
            // the language at runtime. The only thing constant across every
            // language and both storage formats is the emoji: 🖨️ stands for
            // the real printing. So the split hangs off the icon, not the text.
            const istDruck = ev => {
                const roh = String(ev.details == null ? '' : ev.details).trim();
                if (roh.startsWith('🖨')) return true;
                if (roh.startsWith('{')) {
                    try {
                        const v = JSON.parse(roh).vars;
                        return !!(v && String(v.icon || '').startsWith('🖨'));
                    } catch (e) { return false; }
                }
                return false;
            };

            const relevant = (events || [])
                .filter(e => e.type === 'stage_change' || e.type === 'finish'
                             || e.type === 'print_error')
                .slice()
                .sort((a, b) => String(a.time).localeCompare(String(b.time)));

            const teile = [];
            for (let i = 0; i < relevant.length; i++) {
                const e = relevant[i];
                if (e.type !== 'stage_change') continue;
                const naechste = relevant[i + 1];
                if (!naechste) continue;              // laeuft noch → keine Dauer
                const t0 = zeit(e.time), t1 = zeit(naechste.time);
                if (isNaN(t0) || isNaN(t1)) continue;
                const ms = t1 - t0;
                if (ms <= 0) continue;
                const name = ohneEmoji(formatEventDetail(e.details));
                if (!name) continue;
                // The same stage twice in a row is a change the printer
                // reports twice -- fold them together instead of drawing two
                // sections with the same name.
                const letzte = teile[teile.length - 1];
                if (letzte && letzte.name === name) letzte.ms += ms;
                else teile.push({ name, ms, druck: istDruck(e) });
            }
            if (teile.length < 2) return '';           // ein Balken sagt nichts

            const gesamt = teile.reduce((a, t) => a + t.ms, 0);
            const dauer = ms => {
                const s = Math.round(ms / 1000);
                const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
                if (h > 0) return `${h}:${String(m).padStart(2, '0')} h`;
                return `${m}:${String(s % 60).padStart(2, '0')}`;
            };
            const anteil = ms => {
                const p = ms / gesamt * 100;
                return p < 1 ? '&lt;1%' : Math.round(p) + '%';
            };

            // The bar stays chronological; the list underneath answers the
            // actual question: where did the time go. For that it is summed
            // per name -- a stage occurring three times is one row.
            const proName = new Map();
            teile.forEach(t => {
                const e = proName.get(t.name) || { name: t.name, ms: 0 };
                e.ms += t.ms;
                proName.set(t.name, e);
            });
            const rang = Array.from(proName.values()).sort((a, b) => b.ms - a.ms);
            const farbeVon = new Map();
            rang.forEach((r, i) => farbeVon.set(r.name, i < ZEIGEN ? FARBEN[i] : GRAU));

            const esc = x => String(x).replace(/[&<>"]/g,
                c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

            const balken = teile.map(t =>
                `<i style="flex:${t.ms};background:${farbeVon.get(t.name)}" title="${
                    esc(t.name)} · ${dauer(t.ms)}"></i>`).join('');

            const zeile = (r, extra) =>
                `<div class="hv-rang${extra ? ' hv-rang--extra' : ''}" style="--anteil:${
                    (r.ms / gesamt * 100).toFixed(2)}%;--farbe:${farbeVon.get(r.name)}">` +
                `<span class="hv-rang-name">${esc(r.name)}</span>` +
                `<span class="hv-rang-zeit">${dauer(r.ms)}</span>` +
                `<span class="hv-rang-pct">${anteil(r.ms)}</span></div>`;

            let liste = rang.slice(0, ZEIGEN).map(r => zeile(r, false)).join('');
            const schwanz = rang.slice(ZEIGEN);
            if (schwanz.length) {
                const restMs = schwanz.reduce((a, r) => a + r.ms, 0);
                const label = (texts.phases_more || '{n} weitere Phasen')
                    .split('{n}').join(schwanz.length);
                liste += `<button type="button" class="hv-mehr" onclick="this.closest('.hv-phasen').classList.toggle('hv-phasen--offen')">` +
                    `<span class="hv-mehr-pfeil" aria-hidden="true"></span>` +
                    `<span class="hv-rang-name">${esc(label)}</span>` +
                    `<span class="hv-rang-zeit">${dauer(restMs)}</span>` +
                    `<span class="hv-rang-pct">${anteil(restMs)}</span></button>`;
                liste += schwanz.map(r => zeile(r, true)).join('');
            }

            // The key statement: of 57:47 only 27:09 was really printing.
            // Without the row one would have to add that up from the list.
            const druckMs = teile.reduce((a, t) => a + (t.druck ? t.ms : 0), 0);
            const split = (druckMs > 0 && druckMs < gesamt) ? `
                <div class="hv-split">
                    <span class="hv-split-teil"><b>${dauer(druckMs)}</b> ${
                        esc(texts.phases_printing || 'Drucken')} · ${anteil(druckMs)}</span>
                    <span class="hv-split-teil"><b>${dauer(gesamt - druckMs)}</b> ${
                        esc(texts.phases_setup || 'Vorbereitung')} · ${anteil(gesamt - druckMs)}</span>
                </div>` : '';

            return `<div class="hv-phasen">
                <div class="hv-phasen-kopf">
                    <span class="hv-phasen-titel">${esc(texts.phases_title || 'Phasen dieses Drucks')}</span>
                    <span class="hv-phasen-summe">${dauer(gesamt)}</span>
                </div>
                <div class="hv-balken">${balken}</div>
                ${split}
                <div class="hv-rangliste">${liste}</div>
            </div>`;
        }

        function showEventsTimeline() {
            if (!currentPrintData || !currentPrintData.events) return;
            const ziel = document.getElementById('detail-events');

            if (!currentPrintData.events.length) {
                ziel.innerHTML = `<p style="color:var(--text-secondary);">${texts.events_no_events}</p>`;
                return;
            }

            // The dot colour carries the kind of event. The same 📌 used to
            // stand before every row -- which distinguished nothing -- and an
            // emoji from the translated text on top of it.
            const farbe = {
                start:          'var(--color-blue)',
                finish:         'var(--color-green)',
                print_error:    'var(--color-red)',
                server_restart: 'var(--color-orange)'
            };
            // Strip leading emoji from the stage texts; the information is
            // already in the dot and the glyphs looked different per system.
            const ohneEmoji = t => String(t == null ? '' : t)
                .replace(/^[\s\u2000-\u3300\uD83C-\uDBFF\uDC00-\uDFFF\uFE0F\u2B00-\u2BFF\u2600-\u27BF]+/u, '')
                .trim();

            // How often does the same text stand there? A pending printer
            // state used to write every minute -- 754 identical rows in one
            // print. The cause is fixed, the stock remains; so the number
            // stands on the row and can be cleared in one go.
            const haeufigkeit = {};
            currentPrintData.events.forEach(ev => {
                const t = ohneEmoji(formatEventDetail(ev.details));
                haeufigkeit[t] = (haeufigkeit[t] || 0) + 1;
            });
            const wiederholungen = Object.values(haeufigkeit)
                .reduce((n, k) => n + (k > 1 ? k - 1 : 0), 0);

            let html = '';
            if (wiederholungen > 0) {
                html += `<div class="hv-ev-werkzeuge">
                    <span class="hv-ev-hinweis">${(texts.events_repeats || '{n} Wiederholungen')
                        .replace('{n}', wiederholungen)}</span>
                    <button class="hist-btn" onclick="ereignisseAufraeumen()"
                            title="${texts.events_tidy_hint || ''}">${texts.events_tidy || 'Wiederholungen zusammenfassen'}</button>
                </div>`;
            }
            html += phasenLeiste(currentPrintData.events, ohneEmoji);
            html += '<div class="hv-strahl">';
            currentPrintData.events.forEach(ev => {
                const d = new Date(String(ev.time).replace(' ', 'T'));
                const zeit = isNaN(d) ? '' : d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
                const c = farbe[ev.type] || 'var(--text-secondary)';
                const text = ohneEmoji(formatEventDetail(ev.details));
                const wie_oft = haeufigkeit[text] || 1;
                // No id, no deleting -- old answers carried none.
                const griff = (ev.id == null) ? '' : `
                        <span class="hv-ev-aktion">
                            <button class="hv-ev-weg" title="${texts.events_delete || 'Eintrag löschen'}"
                                    onclick="ereignisLoeschen(${ev.id}, false, 1)">✕</button>${wie_oft > 1 ? `
                            <button class="hv-ev-weg hv-ev-weg--alle"
                                    title="${texts.events_delete_same || 'Alle gleichen löschen'}"
                                    onclick="ereignisLoeschen(${ev.id}, true, ${wie_oft})">✕${wie_oft}</button>` : ''}
                        </span>`;
                html += `
                    <div class="hv-ereignis" style="--punkt:${c};">
                        <span class="hv-ev-zeit">${zeit}</span>
                        <span class="hv-ev-text">${text}</span>${griff}
                    </div>`;
            });
            html += '</div>';
            ziel.innerHTML = html;
        }

        async function ereignisLoeschen(eventId, alleGleichen, anzahl) {
            const frage = alleGleichen
                ? (texts.events_delete_same_ask || 'Alle {n} gleichen Einträge löschen?')
                      .replace('{n}', anzahl)
                : (texts.events_delete_ask || 'Diesen Eintrag löschen?');
            if (!await window.skConfirm(frage)) return;
            const id = currentPrintData?.print?.id;
            try {
                const r = await apiCall(`/api/history/${id}/events/${eventId}`, {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ alle_gleichen: !!alleGleichen })
                });
                const j = await r.json();
                if (!j.success) { window.skToast && window.skToast(j.error || '', 'fehler'); return; }
                window.skToast && window.skToast(
                    (texts.events_deleted || '{n} gelöscht').replace('{n}', j.geloescht), 'erfolg');
                await ereignisseNeuLaden();
            } catch (e) {
                window.skToast && window.skToast(String(e), 'fehler');
            }
        }

        async function ereignisseAufraeumen() {
            if (!await window.skConfirm(texts.events_tidy_ask
                || 'Wiederholungen zusammenfassen?')) return;
            const id = currentPrintData?.print?.id;
            try {
                const r = await apiCall(`/api/history/${id}/events/aufraeumen`, { method: 'POST' });
                const j = await r.json();
                if (!j.success) { window.skToast && window.skToast(j.error || '', 'fehler'); return; }
                window.skToast && window.skToast(
                    (texts.events_deleted || '{n} gelöscht').replace('{n}', j.geloescht), 'erfolg');
                await ereignisseNeuLaden();
            } catch (e) {
                window.skToast && window.skToast(String(e), 'fehler');
            }
        }

        /** Fetch the print again, so the list is right instead of guessed. */
        async function ereignisseNeuLaden() {
            const id = currentPrintData?.print?.id;
            if (!id) return;
            const r = await apiCall(`/api/history/${id}`);
            const frisch = await r.json();
            if (frisch && frisch.events) {
                currentPrintData.events = frisch.events;
                showEventsTimeline();
            }
        }

        // Show timelapse
        function showTimelapse() {
            if (!currentPrintData) return;

            const container = document.getElementById('detail-timelapse');
            const printId = currentPrintData.print.id;

            const poster = `/api/history/${printId}/thumbnail`;
            // Offline hint (video not local plus printer off) -- with a thumbnail poster.
            const offlineCard = `
                <div class="hist-empty">
                    <img src="${poster}" onerror="this.style.display='none'" style="max-width:240px; width:60%; border-radius:8px; margin-bottom:12px; opacity:.75;">
                    <span class="hist-empty-icon"><svg class="hd-ic hd-ic--xl" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M7 4v16M17 4v16M2 9h5M2 15h5M17 9h5M17 15h5"/></svg></span>
                    <p>${texts.timelapse_offline}</p>
                </div>`;
            window.__tlOfflineCard = offlineCard;

            apiCall(`/api/history/${printId}/timelapse_status`)
                .then(response => response.json())
                .then(status => {
                    if (!status.available) {
                        container.innerHTML = `
                            <div class="hist-empty">

        // Controls for the timelapse. Deliberately a bar of our own: the
        // built-in controls look different in every browser and cannot set a
        // speed.
        function _tlBinde() {
            const v = document.getElementById('hv-tl');
            const play = document.getElementById('hv-tl-play');
            const zeit = document.getElementById('hv-tl-zeit');
            const bahn = document.getElementById('hv-tl-bahn');
            const fuellung = bahn ? bahn.querySelector('i') : null;
            if (!v || !play) return;

            const PFAD_PLAY = '<path d="M7 4l12 8-12 8z"/>';
            const PFAD_PAUSE = '<path d="M8 4h3v16H8zM13 4h3v16h-3z"/>';
            const mmss = (sek) => {
                if (!isFinite(sek)) return '0:00';
                const m = Math.floor(sek / 60);
                return `${m}:${String(Math.floor(sek % 60)).padStart(2, '0')}`;
            };
            const zeichne = () => {
                zeit.textContent = `${mmss(v.currentTime)} / ${mmss(v.duration)}`;
                if (fuellung && v.duration) {
                    fuellung.style.width = (v.currentTime / v.duration * 100) + '%';
                }
            };

            play.onclick = () => { v.paused ? v.play() : v.pause(); };
            v.addEventListener('play', () => {
                play.querySelector('svg').innerHTML = PFAD_PAUSE;
                play.title = texts.timelapse_pause || 'Pause';
            });
            v.addEventListener('pause', () => {
                play.querySelector('svg').innerHTML = PFAD_PLAY;
                play.title = texts.timelapse_play || 'Abspielen';
            });
            v.addEventListener('timeupdate', zeichne);
            v.addEventListener('loadedmetadata', zeichne);
            v.addEventListener('ended', () => { v.currentTime = 0; });

            // A click in the bar jumps to that place.
            if (bahn) bahn.onclick = (e) => {
                if (!v.duration) return;
                const b = bahn.getBoundingClientRect();
                v.currentTime = Math.max(0, Math.min(1, (e.clientX - b.left) / b.width)) * v.duration;
                zeichne();
            };

            document.querySelectorAll('#hv-tl-tempo button').forEach(b => {
                b.onclick = () => {
                    v.playbackRate = Number(b.dataset.tempo);
                    document.querySelectorAll('#hv-tl-tempo button')
                        .forEach(x => x.classList.toggle('an', x === b));
                };
            });

            const voll = document.getElementById('hv-tl-voll');
            if (voll) voll.onclick = () => {
                if (document.fullscreenElement) document.exitFullscreen();
                else if (v.requestFullscreen) v.requestFullscreen();
                else if (v.webkitEnterFullscreen) v.webkitEnterFullscreen();  // iOS
            };

            zeichne();
        }

        // Calculate cost
        function calculateCost(stats, print) {
            // PREFER the stored server value: the finish computes including
            // power and, for multi-filament, per spool with its Spoolman
            // price -- the client calculation (ONE price times total grams)
            // cannot do that and fell back to the 21-euro fallback on the
            // prototype plate, say. Compute here only when nothing is stored
            // (old or aborted prints).
            const gespeichert = parseFloat(stats.print_cost_eur);
            if (!isNaN(gespeichert) && gespeichert > 0) return gespeichert.toFixed(2);
            const spoolPrice = print && print.filament_price_per_kg > 0 ? print.filament_price_per_kg : null;
            const filamentPerKg = spoolPrice || costSettings.filament_per_kg || 25;
            const powerPerKwh = costSettings.power_per_kwh || 0.30;
            const filamentGrams = parseFloat(stats.filament_used_grams) || 0;
            const powerKwh = parseFloat(stats.total_power_kwh) || 0;
            const total = (filamentGrams / 1000) * filamentPerKg + powerKwh * powerPerKwh;
            return isNaN(total) ? "0.00" : total.toFixed(2);
        }

        // Export print data
        function exportPrintData() {
            if (!currentPrintData) return;
            let csv = 'Zeit,Fortschritt %,Düse °C,Bett °C,Schicht\n';

        // ── PDF export (Electron): every tab in one proper report view ──
        // The renderer builds finished, self-contained HTML (app styling
        // inline, chart as PNG, thumbnail from base64); main.js prints it.

        // Render the progress/temperature chart into a PNG (offscreen, no animation).
        function renderChartImage() {
            return new Promise(resolve => {
                try {
                    const p = currentPrintData && currentPrintData.progress;
                    if (!p || !p.length || !window.Chart) return resolve(null);
                    const holder = document.createElement('div');
                    holder.style.cssText = 'position:fixed;left:-99999px;top:0;width:860px;height:320px;';
                    const cv = document.createElement('canvas');
                    cv.style.width = '860px'; cv.style.height = '320px';
                    holder.appendChild(cv); document.body.appendChild(holder);
                    const labels = p.map(x => new Date(x.time).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }));
                    const chart = new Chart(cv.getContext('2d'), {
                        type: 'line',
                        data: { labels, datasets: [
                            { label: texts.chart_label_progress, data: p.map(x => x.progress), borderColor: 'rgb(75,192,192)', backgroundColor: 'rgba(75,192,192,0.2)', yAxisID: 'y-percent', tension: 0.1, pointRadius: 0 },
                            { label: texts.chart_label_nozzle, data: p.map(x => x.nozzle_temp), borderColor: 'rgb(255,99,132)', yAxisID: 'y-temp', tension: 0.1, pointRadius: 0 },
                            { label: texts.chart_label_bed, data: p.map(x => x.bed_temp), borderColor: 'rgb(54,162,235)', yAxisID: 'y-temp', tension: 0.1, pointRadius: 0 },
                        ] },
                        options: { responsive: false, animation: false, devicePixelRatio: 2,
                            // Colours for the LIGHT PDF background (dark axes, light grids).
                            plugins: { legend: { labels: { color: '#334155', font: { size: 13 } } } },
                            scales: {
                                x: { ticks: { color: '#475569', maxTicksLimit: 10 }, grid: { color: '#e5e7eb' } },
                                'y-percent': { position: 'left', min: 0, max: 100, ticks: { color: '#475569' }, grid: { color: '#eef1f4' }, title: { display: true, text: texts.chart_label_progress, color: '#64748b' } },
                                'y-temp': { position: 'right', ticks: { color: '#475569' }, grid: { drawOnChartArea: false }, title: { display: true, text: texts.chart_axis_temperature, color: '#64748b' } },
                            } }
                    });
                    setTimeout(() => {
                        let dataUrl = null;
                        try { dataUrl = cv.toDataURL('image/png'); } catch (_) {}
                        try { chart.destroy(); } catch (_) {}
                        holder.remove();
                        resolve(dataUrl);
                    }, 150);
                } catch (_) { resolve(null); }
            });
        }

        function buildPrintReportHtml(chartImg) {
            const d = currentPrintData;
            const print = d.print, stats = d.statistics || {}, settings = d.settings || {};
            const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            const has = v => v != null && v !== '' && !(typeof v === 'number' && isNaN(v));
            const fmtDur = (min) => { if (min == null) return '--'; if (min <= 0) return '< 1m'; const h = Math.floor(min / 60), m = Math.round(min % 60); return h ? `${h}h ${m}m` : `${m}m`; };
            const r0 = v => Math.round(v);
            const estMin = settings.print_time_estimate ? Math.round(settings.print_time_estimate / 60) : null;
            const dateStr = print.start_time ? new Date(print.start_time).toLocaleString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '--';
            const genStr = new Date().toLocaleString('de-DE');
            const cost = (typeof calculateCost === 'function') ? calculateCost(stats, print) : (stats.print_cost_eur != null ? Number(stats.print_cost_eur).toFixed(2) : '--');

            // Status-Pille
            const st = String(print.status || '').toLowerCase();
            const stCls = (st === 'success' || st === 'completed' || st === 'finished') ? 'ok' : (st === 'failed' || st === 'error') ? 'fail' : 'cancel';
            const stTxt = (st === 'success' || st === 'completed' || st === 'finished') ? (texts.status_success || 'Erfolgreich')
                : (st === 'failed' || st === 'error') ? (texts.status_failed || 'Fehlgeschlagen')
                : (texts.status_cancelled || 'Abgebrochen');
            const stIco = stCls === 'ok' ? '✓' : stCls === 'fail' ? '✕' : '⛔';

            const thumb = print.thumbnail_base64 ? `<img src="${imageDataUrl(print.thumbnail_base64)}">` : `<div class="ph"></div>`;
            const klip = print.printer_type === 'klipper'
                ? `<span class="chip">Klipper${print.printer_id && !['klipper', 'klipper_local'].includes(print.printer_id) ? ' · ' + esc(print.printer_id) : ''}</span>` : '';

            // KPI-Band
            const kpi = (l, v, u) => `<div class="kpi"><div class="l">${l}</div><div class="v">${v}${u ? `<small>${u}</small>` : ''}</div></div>`;
            const kpis = [
                kpi(texts.detail_duration || 'Dauer', fmtDur(print.duration_minutes), ''),
                kpi(texts.detail_layers || 'Schichten', has(print.total_layers) ? print.total_layers : '--', ''),
                kpi(texts.detail_filament || 'Filament', has(stats.filament_used_grams) ? stats.filament_used_grams.toFixed(1) : '--', 'g'),
                kpi(texts.detail_power || 'Strom', has(stats.total_power_kwh) ? stats.total_power_kwh.toFixed(3) : '--', 'kWh'),
                kpi(texts.detail_costs || 'Kosten', cost, '€'),
            ].join('');

            // Zellen-Grid-Helper
            const cell = (l, v, u, color) => has(v) || v === 0 ? `<div class="cell"><div class="l">${l}</div><div class="v"${color ? ` style="color:${color}"` : ''}>${v}${u ? `<small> ${u}</small>` : ''}</div></div>` : '';
            const section = (title, body) => body && body.trim() ? `<div class="sec"><h2>${title}</h2>${body}</div>` : '';

            // Eckdaten
            const eck = `<div class="grid g4">${[
                cell(texts.detail_duration || 'Dauer', fmtDur(print.duration_minutes)),
                cell(texts.detail_estimated || 'Geschätzt', estMin != null ? fmtDur(estMin) : '--'),
                cell(texts.detail_date || 'Datum', dateStr),
                cell(texts.detail_filesize || 'Dateigröße', has(print.file_size) ? (print.file_size / 1e6).toFixed(1) : '--', 'MB'),
            ].join('')}</div>`;

            // Temperaturen
            const temps = [
                cell(texts.detail_nozzle || 'Düse', has(stats.avg_nozzle_temp) ? r0(stats.avg_nozzle_temp) : null, '°C', '#ea7317'),
                cell(texts.detail_bed || 'Bett', has(stats.avg_bed_temp) ? r0(stats.avg_bed_temp) : null, '°C', '#2196f3'),
                cell(texts.detail_chamber || 'Kammer', has(stats.avg_chamber_temp) ? r0(stats.avg_chamber_temp) : null, '°C', '#ea7317'),
                cell(texts.detail_humidity || 'Feuchte', has(stats.avg_chamber_humidity) ? r0(stats.avg_chamber_humidity) : null, '%', '#2196f3'),
            ].filter(Boolean);
            const tempSec = temps.length ? `<div class="grid g4">${temps.join('')}</div>` : '';

            // Verbrauch
            const verb = `<div class="grid g3">${[
                cell(texts.detail_filament || 'Filament', has(stats.filament_used_grams) ? stats.filament_used_grams.toFixed(1) : '--', 'g', '#16a34a'),
                cell(texts.detail_power || 'Strom', has(stats.total_power_kwh) ? stats.total_power_kwh.toFixed(3) : '--', 'kWh', '#ea7317'),
                cell(texts.detail_costs || 'Kosten', cost, '€', '#2196f3'),
            ].join('')}</div>`;

            // Settings (a definition list, only what is present)
            const yn = b => b ? (texts.detail_support_active || 'Aktiv') : (texts.detail_support_off || 'Aus');
            const def = (k, v) => has(v) ? `<div class="def"><span class="k">${k}</span><span class="v">${v}</span></div>` : '';
            const setDefs = [
                def(texts.detail_layer_height || 'Layer-Höhe', has(settings.layer_height) ? settings.layer_height + ' mm' : null),
                def(texts.detail_infill || 'Infill', has(settings.infill_density) ? settings.infill_density + ' %' : null),
                def(texts.detail_wall_loops || 'Wandlinien', settings.wall_loops),
                def(texts.detail_speed || 'Geschwindigkeit', has(settings.print_speed) ? r0(settings.print_speed) + ' mm/s' : null),
                def(texts.detail_top_layers || 'Top-Layer', settings.top_layers),
                def(texts.detail_bottom_layers || 'Bottom-Layer', settings.bottom_layers),
                def(texts.detail_nozzle || 'Düse', has(settings.nozzle_temp) ? settings.nozzle_temp + ' °C' : null),
                def(texts.detail_bed || 'Bett', has(settings.bed_temp) ? settings.bed_temp + ' °C' : null),
                def(texts.detail_nozzle_diameter || 'Düse ⌀', has(settings.nozzle_diameter) ? settings.nozzle_diameter + ' mm' : null),
                def(texts.detail_nozzle_changes || 'Düsenwechsel', settings.nozzle_changes || null),
                def(texts.detail_support || 'Support', settings.support_enabled != null ? yn(settings.support_enabled) : null),
                def(texts.detail_ironing || 'Bügeln', settings.ironing_enabled != null ? yn(settings.ironing_enabled) : null),
            ].filter(Boolean).join('');
            const setSec = setDefs ? `<div class="defs">${setDefs}</div>` : '';

            // Filamente
            const fils = Array.isArray(d.filaments) ? d.filaments : [];
            const filSec = fils.length ? fils.map((f, i) => {
                const col = (typeof _normColor === 'function' ? _normColor(f.color) : f.color) || (typeof getFilamentColor === 'function' ? getFilamentColor(f.name || f.type || '') : '#999');
                const g = has(f.used_grams) ? Number(f.used_grams).toFixed(1) + ' g' : '';
                return `<div class="fil"><span class="dot" style="background:${col}"></span><span class="nm">${esc(f.name || f.type || '--')}${f.type && f.name ? ` <span class="ty">· ${esc(f.type)}</span>` : ''}</span><span class="g">${g}</span></div>`;
            }).join('') : '';

            // Diagramm
            const chartSec = chartImg ? `<img class="chart" src="${chartImg}">` : '';

            // Ereignisse
            const evs = Array.isArray(d.events) ? d.events : [];
            const evSec = evs.length ? evs.map(e => {
                const t = e.time ? new Date(e.time).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }) : '';
                const tx = (typeof formatEventDetail === 'function') ? formatEventDetail(e.details) : esc(e.details);
                return `<div class="ev"><span class="ti">${t}</span><span class="tx">${tx}</span></div>`;
            }).join('') : '';

            // Konsole
            const cons = (d.console_log && d.console_log.length)
                ? d.console_log.map(l => `${(l.time || '').slice(11, 19)}  ${esc(l.message)}`).join('\n') : '';

            return `<!DOCTYPE html><html lang="de"><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:#fff;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1f2937;font-size:12px;line-height:1.45;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
.hdr{display:flex;gap:18px;align-items:center;padding-bottom:15px;border-bottom:3px solid #2196f3;}
.hdr img,.hdr .ph{width:92px;height:92px;border-radius:14px;object-fit:cover;border:1px solid #e5e7eb;background:#f3f4f6;flex:0 0 auto;}
.hdr .t{flex:1;min-width:0;}
.hdr h1{font-size:21px;font-weight:800;letter-spacing:-.2px;word-break:break-word;color:#111827;}
.hdr .sub{margin-top:9px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:#6b7280;}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 11px;border-radius:999px;font-weight:700;font-size:11px;}
.pill.ok{background:#dcfce7;color:#15803d;}.pill.fail{background:#fee2e2;color:#b91c1c;}.pill.cancel{background:#ffedd5;color:#c2410c;}
.chip{padding:2px 9px;border-radius:8px;background:#eff3f8;color:#475569;font-weight:600;font-size:11px;border:1px solid #e2e8f0;}
.dt{font-size:12px;color:#6b7280;}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:18px;}
.kpi{border:1px solid #e5e7eb;border-radius:12px;padding:11px 12px;background:#f9fafb;}
.kpi .l{font-size:9px;text-transform:uppercase;letter-spacing:.6px;color:#9ca3af;font-weight:800;}
.kpi .v{font-size:19px;font-weight:800;margin-top:4px;color:#111827;}
.kpi .v small{font-size:11px;font-weight:600;color:#6b7280;margin-left:2px;}
.sec{margin-top:22px;}
.sec>h2{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.7px;color:#2196f3;display:flex;align-items:center;gap:9px;margin-bottom:11px;}
.sec>h2::before{content:'';width:4px;height:14px;background:#2196f3;border-radius:2px;display:inline-block;}
.grid{display:grid;gap:10px;}
.g3{grid-template-columns:repeat(3,1fr);}.g4{grid-template-columns:repeat(4,1fr);}
.cell{border:1px solid #eceff3;border-radius:10px;padding:10px 12px;background:#fff;break-inside:avoid;}
.cell .l{font-size:9px;text-transform:uppercase;letter-spacing:.5px;color:#9ca3af;font-weight:800;}
.cell .v{font-size:17px;font-weight:700;margin-top:4px;color:#111827;}
.cell .v small{font-size:11px;color:#6b7280;font-weight:600;}
.defs{display:grid;grid-template-columns:repeat(2,1fr);gap:0 30px;}
.def{display:flex;justify-content:space-between;gap:10px;padding:8px 2px;border-bottom:1px solid #f1f3f5;font-size:12.5px;break-inside:avoid;}
.def .k{color:#6b7280;}.def .v{font-weight:700;color:#111827;}
.fil{display:flex;align-items:center;gap:12px;padding:10px 13px;border:1px solid #eceff3;border-radius:10px;margin-bottom:8px;break-inside:avoid;}
.fil .dot{width:26px;height:26px;border-radius:50%;border:1px solid #d1d5db;flex:0 0 auto;}
.fil .nm{font-weight:700;flex:1;color:#111827;}.fil .ty{font-weight:500;color:#6b7280;}
.fil .g{font-weight:700;color:#111827;}
.chart{width:100%;border:1px solid #e5e7eb;border-radius:12px;background:#fff;padding:8px;break-inside:avoid;}
.ev{display:flex;gap:12px;padding:7px 2px;border-bottom:1px solid #f1f3f5;font-size:12px;break-inside:avoid;}
.ev .ti{color:#9ca3af;width:46px;flex:0 0 auto;font-variant-numeric:tabular-nums;}
.ev .tx{flex:1;color:#374151;}
.con{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10px;line-height:1.55;white-space:pre-wrap;word-break:break-all;background:#f8fafc;color:#334155;border:1px solid #e5e7eb;border-radius:10px;padding:13px;}
.muted{color:#9ca3af;font-size:12px;}
.genline{margin-top:28px;padding-top:12px;border-top:1px solid #eef1f4;text-align:center;color:#9ca3af;font-size:11px;}
@page{size:A4;margin:14mm 14mm 16mm;}
</style></head><body>
<div class="hdr">${thumb}<div class="t"><h1>${esc(print.filename)}</h1>
<div class="sub"><span class="pill ${stCls}">${stIco} ${esc(stTxt)}</span>${klip}<span class="dt">${esc(dateStr)}</span></div></div></div>
<div class="kpis">${kpis}</div>
${section((texts.detail_facts || 'Eckdaten'), eck)}
${section((texts.detail_temperatures || 'Temperaturen'), tempSec)}
${section((texts.detail_consumption_costs || 'Verbrauch & Kosten'), verb)}
${section((texts.detail_print_settings || 'Druck-Einstellungen'), setSec)}
${fils.length ? section((texts.detail_filaments || 'Filamente'), filSec) : ''}
${chartImg ? section((texts.detail_chart_tab || 'Diagramm'), chartSec) : ''}
${evs.length ? section((texts.events_header || 'Ereignisse'), evSec) : ''}
${cons ? section((texts.detail_console_tab || 'Konsole'), `<div class="con">${cons}</div>`) : ''}
<div class="genline">${esc(texts.pdf_generated_on || 'PDF erstellt am')} ${esc(genStr)}</div>
</body></html>`;
        }

        async function exportPdf() {
            if (!currentPrintData) return;
            if (!(window.electronAPI && window.electronAPI.exportPrintPdf)) {
                showWebToast(texts.pdf_only_app || 'PDF-Export nur in der App verfügbar', 'error');
                return;
            }
            showWebToast(texts.pdf_generating || 'PDF wird erstellt …', 'info');
            try {
                const chartImg = await renderChartImage();
                const html = buildPrintReportHtml(chartImg);
                const fn = `druck_${(currentPrintData.print.filename || '').replace(/\.[^.]+$/, '')}_${currentPrintData.print.id}`;
                const footer = { page: texts.pdf_page || 'Seite', of: texts.pdf_of || 'von' };
                const res = await window.electronAPI.exportPrintPdf(html, fn, footer);
                if (res && res.ok) showWebToast(texts.pdf_saved || 'PDF gespeichert', 'success');
                else if (!(res && res.canceled)) showWebToast((res && res.error) || texts.pdf_error || 'PDF-Export fehlgeschlagen', 'error');
            } catch (e) {
                console.error('PDF export error:', e);
                showWebToast(texts.pdf_error || 'PDF-Export fehlgeschlagen', 'error');
            }
        }

        // "Erneut drucken" ist hier raus (04sep26). Der Historien-Eintrag
        // haelt nur den Namen -- keinen Speicherort und, je nach dem was der
        // Drucker als subtask_name meldet, nicht einmal die Endung. Damit
        // fand der Druckbefehl den Pfad nicht und der Drucker antwortete mit
        // HMS 0500-4002. Archivierte Dateien liegen ausserdem gar nicht mehr
        // auf dem Geraet, und Uploads tragen keinen Pfad.
        //
        // Das alles waere zu heilen gewesen -- aber der Weg ueber die
        // SD-Karte kann es bereits, mit Ort, Pfad und Platte. Ein zweiter,
        // schwaecherer Weg zum selben Ziel ist die Sorte Doppelbestand, die
        // hier schon oefter Fehler getragen hat.

        function showHistoryFilamentMismatchDialog(mismatch, onPick) {
            const wanted = mismatch.wanted || {};
            const candidates = Array.isArray(mismatch.candidates) ? mismatch.candidates : [];
            const current = mismatch.current_active;

            const overlay = document.createElement('div');
            overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.65);display:flex;align-items:center;justify-content:center;z-index:10001;';

            const wantedColor = wanted.color ? (wanted.color.startsWith('#') ? wanted.color : '#' + wanted.color) : '#888';

            const options = [];
            candidates.forEach(s => options.push({s, label: 'Match'}));
            if (current && !candidates.some(c => c.id === current.id)) options.push({s: current, label: 'aktuell aktiv'});

            const rows = options.map((opt, i) => {
                const s = opt.s;
                const fil = s.filament || {};
                const vendor = (fil.vendor && fil.vendor.name) || '';
                const name = fil.name || '—';
                const material = fil.material || '';
                const col = fil.color_hex ? '#' + String(fil.color_hex).replace('#','') : '#888';
                const rem = s.remaining_weight != null ? Math.round(s.remaining_weight) + 'g' : '';
                return `<div class="mm-opt" data-id="${s.id}" style="padding:10px;border:2px solid var(--border-color);border-radius:8px;margin-bottom:6px;cursor:pointer;display:flex;align-items:center;gap:10px;">
                    <div style="width:18px;height:18px;border-radius:50%;background:${col};border:1px solid var(--border-color);"></div>
                    <div style="flex:1;"><div style="font-weight:600;">${vendor ? vendor + ' ' : ''}${name}</div>
                    <div style="font-size:11px;color:var(--text-secondary);">${material}${rem ? ' • ' + rem : ''}</div></div>
                    <span style="font-size:10px;padding:2px 8px;border-radius:10px;background:${opt.label === 'Match' ? '#1e5128' : '#444'};color:#fff;">${opt.label}</span>
                </div>`;
            }).join('');

            overlay.innerHTML = `
                <div style="background:var(--bg-primary);border-radius:10px;padding:20px;max-width:460px;width:90%;max-height:80vh;overflow:auto;">
                    <h3 style="margin:0 0 12px 0;">Spule bestaetigen</h3>
                    <p style="margin:0 0 6px 0;color:var(--text-secondary);">${getText('hist_file_needs', 'Die Datei braucht:')}</p>
                    <div style="display:flex;align-items:center;gap:8px;padding:8px;background:var(--bg-secondary);border-radius:6px;margin-bottom:14px;">
                        <div style="width:20px;height:20px;border-radius:50%;background:${wantedColor};border:1px solid var(--border-color);"></div>
                        <div><strong>${wanted.name || '—'}</strong>${wanted.material ? ' <span style="color:var(--text-secondary)">(' + wanted.material + ')</span>' : ''}</div>
                    </div>
                    ${options.length === 0 ? '<p style="color:#ffb0b0;">Keine passende Spule gefunden.</p>' : rows}
                    <div style="display:flex;gap:8px;margin-top:14px;">
                        <button id="mm-cancel" style="flex:1;padding:10px;background:var(--bg-secondary);border:none;border-radius:6px;cursor:pointer;">Abbrechen</button>
                        <button id="mm-ok" style="flex:1;padding:10px;background:var(--accent-green);color:white;border:none;border-radius:6px;cursor:pointer;font-weight:600;" disabled>Drucken</button>
                    </div>
                </div>`;
            document.body.appendChild(overlay);

            let picked = null;
            const okBtn = overlay.querySelector('#mm-ok');
            const optEls = overlay.querySelectorAll('.mm-opt');
            optEls.forEach(el => el.addEventListener('click', () => {
                picked = parseInt(el.dataset.id);
                optEls.forEach(e => { e.style.borderColor = 'var(--border-color)'; e.style.background = 'transparent'; });
                el.style.borderColor = 'var(--accent-green)';
                el.style.background = 'var(--bg-secondary)';
                okBtn.disabled = false;
                okBtn.style.opacity = '1';
            }));
            if (optEls.length === 1) optEls[0].click();

            overlay.querySelector('#mm-cancel').onclick = () => { overlay.remove(); onPick(null); };
            okBtn.onclick = () => { overlay.remove(); onPick(picked); };
        }

        // Close modals when clicking outside
        window.onclick = function(event) {
            if (event.target.classList.contains('modal-overlay')) {
                event.target.style.display = 'none';
                if (printProgressChart) {
                    printProgressChart.destroy();
                    printProgressChart = null;
                }
            }
        }
    </script>
    <script src="/static/js/modules/hms-severity.js"></script>
    <script src="/static/js/modules/hms-banner.js"></script>
    <script src="/static/js/modules/hms-overlay.js"></script>
    <script src="/static/js/modules/notification-stack.js"></script>
