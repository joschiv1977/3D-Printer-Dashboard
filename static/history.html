<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Druck-Historie - 3D Printer Dashboard</title>

    <!-- Shared Styles -->
    <link rel="stylesheet" href="/static/css/shared-styles.css?v=2">
    <link rel="stylesheet" href="/static/font-awesome.min.css">
    <link rel="stylesheet" href="/static/css/design-tokens.css?v=2">
    <link rel="stylesheet" href="/static/css/base.css?v=2">
    <link rel="stylesheet" href="/static/css/tab-bar.css?v=2">
    <link rel="stylesheet" href="/static/css/modals.css?v=2">
    <link rel="stylesheet" href="/static/css/sd-card.css?v=4">
    <link rel="stylesheet" href="/static/css/components.css?v=2">
    <link rel="stylesheet" href="/static/css/history.css?v=4">
    <link rel="stylesheet" href="/static/css/thumb-preview.css?v=1">
    <link rel="stylesheet" href="/static/css/meldungen.css">

    <!-- Chart.js (local) -->
    <script src="/static/chart.umd.js"></script>

    <!--Plotly (offline bundle, gl3d) - for the bed mesh tab in the print detail view-->
    <script src="/static/vendor/plotly-gl3d.min.js"></script>

    <!--Load language files-->
    <script src="/static/lang/de.js"></script>
    <script src="/static/lang/en.js"></script>
    <script src="/static/lang/fr.js"></script>
    <script src="/static/lang/es.js"></script>
    <script src="/static/lang/it.js"></script>

    <style>
        body {
            padding: 0;
            margin: 0;
        }
    </style>
</head>
<body>
    <!-- Apply dark mode immediately -->
    <script>
        (function() {
            const theme = localStorage.getItem('theme') || 'auto';
            if (theme === 'dark') {
                document.body.classList.add('dark-mode');
            } else if (theme === 'auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                document.body.classList.add('dark-mode');
            }
        })();
    </script>

    <!-- Shared Module Scripts -->
    <script src="/static/js/modules/icons.js"></script>
    <script src="/static/js/modules/image-utils.js"></script>
    <script src="/static/js/modules/thumb-preview.js"></script>
    <script src="/static/js/modules/theme-manager.js"></script>
    <script src="/static/js/modules/i18n-manager.js"></script>
    <script src="/static/js/modules/tab-bar-manager.js"></script>
    <script src="/static/js/modules/confirm-dialog.js"></script>
    <script src="/static/js/modules/analytics.js"></script>
    <script src="/static/js/modules/ams-humidity.js?v=1"></script>
    <script src="/static/js/modules/analytics-dashboard.js?v=2"></script>

    <div class="hist-container">
        <!-- Header -->
        <div class="hist-header">
            <h1 class="hist-header-title">
                <svg class="hd-ic hd-ic--lg" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-7"/></svg>
                <span data-i18n="history_modal_title">Druck-Historie</span>
            </h1>
            <div class="hist-header-actions">
                <button class="hist-btn" onclick="window.location.reload()">
                    <svg class="hd-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
                    <span data-i18n="refresh">Aktualisieren</span>
                </button>
                <!--As a menu on the button, the page stays put -- an expandable card
                     above the list would push everything down when opened.-->
                <span class="hv-menue-huelle">
                    <button class="hist-btn" onclick="toggleHistorySettings(event)">
                        <svg class="hd-ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>
                        <span data-i18n="settings">Einstellungen</span>
                        <svg class="hd-ic hd-ic--xs" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
                    </button>
                    <div class="hv-menue" id="history-settings-panel" onclick="event.stopPropagation()">
                        <div class="hv-menue-kopf" data-i18n="history_settings_costs">Kosten</div>
                        <label class="hv-menue-feld">
                            <span for="hist_filament_cost" data-i18n="hist_filament_cost_label">Filament-Kosten (€/kg)</span>
                            <input type="number" id="hist_filament_cost" placeholder="21,00" step="0.01">
                        </label>
                        <label class="hv-menue-feld">
                            <span for="hist_power_cost" data-i18n="hist_power_cost_label">Stromkosten (€/kWh)</span>
                            <input type="number" id="hist_power_cost" placeholder="0,30" step="0.01">
                        </label>
                        <hr>
                        <div class="hv-menue-kopf" data-i18n="history_settings_view">Anzeige</div>
                        <label class="hv-menue-feld">
                            <span for="hist_max_current" data-i18n="hist_max_current_label">Max. Aktuelle Drucke</span>
                            <select id="hist_max_current">
                                <option value="5">5</option>
                                <option value="10" selected>10</option>
                                <option value="15">15</option>
                                <option value="20">20</option>
                            </select>
                        </label>
                        <div class="hv-menue-fuss">
                            <button onclick="saveHistorySettings()" class="hist-btn hist-btn--primary">
                                <svg class="hd-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
                                <span data-i18n="save">Speichern</span>
                            </button>
                        </div>
                    </div>
                </span>
            </div>
        </div>

        <!--List on the left, detail on the right. No overlay: paging through
             multiple prints keeps the list in place, only the right side changes.-->
        <div class="hv-rahmen" id="hv-rahmen">

            <!--The tabs sit above both columns, not inside the list:
                 otherwise they would disappear with the list column, once the
                 statistics take the full width -- and there would be no way
                 back out of the statistics.-->
            <div class="hist-tabs hv-reiter">
                <button id="tab-current" class="hist-tab-btn active" onclick="switchHistoryTab('current')">
                    <span id="history-tab-current-text" data-i18n="history_tab_current">Aktuelle</span>
                </button>
                <button id="tab-archive" class="hist-tab-btn" onclick="switchHistoryTab('archive')">
                    <span id="history-tab-archive-text" data-i18n="history_tab_archive">Archiv</span>
                </button>
                <button id="tab-statistics" class="hist-tab-btn" onclick="switchHistoryTab('statistics')">
                    <span id="history-tab-statistics-text" data-i18n="history_tab_statistics">Statistiken</span>
                </button>
            </div>

            <div class="hv-spalte">
                <div class="hv-listenkopf">
                    <div class="hist-controls">
                        <div class="hist-search-box">
                            <svg class="hd-ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
                            <input type="text" id="hist-search" data-i18n-placeholder="history_search_placeholder"
                                   placeholder="Drucke durchsuchen..." oninput="applyHistoryFilters()">
                        </div>
                        <div class="hist-filter-row">
                            <select id="history-filter" class="hist-dropdown" onchange="applyHistoryFilters()">
                                <option value="" data-i18n="history_filter_all">Alle anzeigen</option>
                                <option value="success" data-i18n="history_filter_success">Erfolgreich</option>
                                <option value="failed" data-i18n="history_filter_failed">Fehlgeschlagen</option>
                                <option value="cancelled" data-i18n="history_filter_cancelled">Abgebrochen</option>
                                <option value="running" data-i18n="history_filter_running">Laufend</option>
                                <!--System runs are not a status: a calibration can
                                     succeed or fail just the same. The entry therefore
                                     filters on the flag, not on p.status.-->
                                <option value="system" data-i18n="history_filter_system">System</option>
                            </select>
                            <select id="hist-material" class="hist-dropdown" onchange="applyHistoryFilters()">
                                <option value="" data-i18n="history_filter_material_all">Alle Materialien</option>
                            </select>
                            <select id="hist-printer" class="hist-dropdown" onchange="applyHistoryFilters()" style="display:none;">
                                <option value="" data-i18n="history_filter_printer_all">Alle Drucker</option>
                            </select>
                            <select id="hist-sort" class="hist-dropdown" onchange="applyHistoryFilters()">
                                <option value="newest" data-i18n="history_sort_newest">Neueste zuerst</option>
                                <option value="oldest" data-i18n="history_sort_oldest">Älteste zuerst</option>
                                <option value="longest" data-i18n="history_sort_longest">Längste Dauer</option>
                                <option value="shortest" data-i18n="history_sort_shortest">Kürzeste Dauer</option>
                            </select>
                            <button id="hist-dedup" class="hist-toggle-btn" onclick="toggleHistDedup()"
                                    data-i18n-title="history_hide_duplicates" title="Duplikate ausblenden">
                                <svg class="hd-ic hd-ic--xs" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                                <span data-i18n="history_hide_duplicates">Duplikate ausblenden</span>
                            </button>
                        </div>
                        <div class="hist-color-row" id="hist-color-row" style="display:none;">
                            <span class="hist-color-label" data-i18n="history_colors_label">Farben:</span>
                            <div id="hist-colors" class="hist-colors"></div>
                        </div>
                    </div>
                </div>

                <div class="hv-liste" id="hv-liste">
                    <div class="hist-empty">
                        <div class="loading"></div>
                        <p data-i18n="history_loading_current">Lade aktuelle Drucke...</p>
                    </div>
                </div>
            </div>

            <div class="hv-detail" id="hv-detail">
                <!--As long as nothing is selected-->
                <div class="hv-nichts" id="hv-nichts">
                    <svg class="hd-ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 14h8"/></svg>
                    <div data-i18n="history_pick_print">Links einen Druck wählen</div>
                </div>

                <div id="hv-inhalt" style="display:none;">
                    <div class="hv-d-kopf">
                        <button class="hv-zurueck hist-btn hist-btn--icon" onclick="closePrintDetails()"
                                data-i18n-title="history_back_to_list" title="Zurück zur Liste">
                            <svg class="hd-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
                        </button>
                        <div class="hv-d-bild">
                            <img id="detail-thumbnail" src="" alt="" style="display:none;">
                        </div>
                        <div class="hv-d-titel">
                            <div id="detail-title" class="hv-d-name"></div>
                            <div id="detail-info" class="hv-d-unter"></div>
                        </div>
                        <span class="hv-marke" id="hv-marke"></span>
                        <!--Paging without detouring through the list; arrow keys do the same.-->
                        <div class="hv-blaettern">
                            <button id="hv-vor" onclick="waehleNachbar(-1)" data-i18n-title="history_prev_print" title="Vorheriger Druck">
                                <svg class="hd-ic hd-ic--xs" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
                            </button>
                            <span id="hv-zaehler"></span>
                            <button id="hv-zurueck-btn" onclick="waehleNachbar(1)" data-i18n-title="history_next_print" title="Nächster Druck">
                                <svg class="hd-ic hd-ic--xs" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>
                            </button>
                        </div>
                    </div>

                    <div class="hv-d-reiter">
                        <button class="hist-detail-tab active" onclick="switchDetailTab('overview')" data-tab="overview">
                            <svg class="hd-ic hd-ic--xs" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h16M7 16V8M12 16V4M17 16v-6"/></svg>
                            <span id="detail-overview-tab-text" data-i18n="detail_overview_tab">Übersicht</span>
                        </button>
                        <button id="mesh-tab-btn" class="hist-detail-tab" onclick="switchDetailTab('mesh')" data-tab="mesh" style="display:none;">
                            <svg class="hd-ic hd-ic--xs" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg>
                            <span id="detail-mesh-tab-text" data-i18n="detail_mesh_tab">Bed Mesh</span>
                        </button>
                        <button class="hist-detail-tab" onclick="switchDetailTab('chart')" data-tab="chart">
                            <svg class="hd-ic hd-ic--xs" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-7"/></svg>
                            <span id="chart-tab-text" data-i18n="detail_chart_tab">Diagramm</span>
                        </button>
                        <button class="hist-detail-tab" onclick="switchDetailTab('events')" data-tab="events">
                            <svg class="hd-ic hd-ic--xs" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
                            <span id="detail-events-tab-text" data-i18n="detail_events_tab">Ereignisse</span>
                        </button>
                        <button id="timelapse-tab-btn" class="hist-detail-tab" onclick="switchDetailTab('timelapse')" data-tab="timelapse" style="display:none;">
                            <svg class="hd-ic hd-ic--xs" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 10l6-3v10l-6-3z"/><rect x="3" y="6" width="12" height="12" rx="2"/></svg>
                            <span id="detail-timelapse-tab-text" data-i18n="detail_timelapse_tab">Timelapse</span>
                        </button>
                        <button id="console-tab-btn" class="hist-detail-tab" onclick="switchDetailTab('console')" data-tab="console" style="display:none;">
                            <svg class="hd-ic hd-ic--xs" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9l3 3-3 3M13 15h4"/></svg>
                            <span id="detail-console-tab-text" data-i18n="detail_console_tab">Konsole</span>
                        </button>
                        <span class="hv-reiter-luft"></span>
                        <span class="hv-d-aktionen">
                            <button onclick="reloadPrintDetails()" class="hv-akt-btn"
                                    data-i18n-title="detail_refresh" title="Aktualisieren">
                                <svg class="hd-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
                            </button>
                            <button onclick="exportPdf()" class="hv-akt-btn"
                                    data-i18n-title="detail_export_pdf" title="PDF">
                                <svg class="hd-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
                            </button>
                        </span>
                    </div>

                    <div class="hv-d-koerper">
                        <!-- Overview Tab -->
                        <div id="overview-tab" class="detail-tab-content">
                            <div id="detail-stats"></div>
                        </div>

                        <!--Bed Mesh Tab - snapshot of this print's Cartographer scan-->
                        <div id="mesh-tab" class="detail-tab-content" style="display:none;">
                            <div id="detail-mesh-empty" class="bm-empty" style="display:none; text-align:center; padding:40px 16px; color:var(--text-secondary);"></div>
                            <div id="detail-mesh-wrap" style="display:none;">
                                <div class="bm-plot-card" style="background:#15151a; border-radius:14px; overflow:hidden; margin-bottom:16px;">
                                    <div id="detail-mesh-plot" style="width:100%; height:400px;"></div>
                                </div>
                                <div class="card">
                                    <div class="bm-info-row"><span class="bm-label" data-i18n="detail_mesh_profile">Profil</span><span class="bm-value" id="detail-mesh-name">—</span></div>
                                    <div class="bm-info-row"><span class="bm-label" data-i18n="bedmesh_size">Größe</span><span class="bm-value" id="detail-mesh-size">—</span></div>
                                    <div class="bm-info-row"><span class="bm-label" id="detail-mesh-max-label">Max</span><span class="bm-value" id="detail-mesh-max">—</span></div>
                                    <div class="bm-info-row"><span class="bm-label" id="detail-mesh-min-label">Min</span><span class="bm-value" id="detail-mesh-min">—</span></div>
                                    <div class="bm-info-row"><span class="bm-label" data-i18n="bedmesh_range">Spannweite</span><span class="bm-value" id="detail-mesh-range">—</span></div>
                                </div>
                            </div>
                        </div>

                        <!-- Chart Tab -->
                        <div id="chart-tab" class="detail-tab-content" style="display:none;">
                            <div class="hist-chart-wrap"></div>
                        </div>

                        <!-- Events Tab -->
                        <div id="events-tab" class="detail-tab-content" style="display:none;">
                            <div id="detail-events" class="hist-events-wrap"></div>
                        </div>

                        <!-- Timelapse Tab -->
                        <div id="timelapse-tab" class="detail-tab-content" style="display:none;">
                            <div id="detail-timelapse"></div>
                        </div>

                        <!-- Console Tab (Klipper) -->
                        <div id="console-tab" class="detail-tab-content" style="display:none;">
                            <div id="detail-console" class="hist-console-wrap"
                                 style="font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
                                        font-size: 12px; line-height: 1.4;
                                        background: var(--bg-card-variant);
                                        border-radius: 8px; padding: 12px;
                                        max-height: 600px; overflow-y: auto;
                                        white-space: pre-wrap; word-break: break-all;">
                            </div>
                        </div>
                    </div>

                </div>
            </div>

            <!--Statistics take the full width; list and detail step aside.-->
            <div class="hv-stat" id="history-list-statistics">
                <div class="hist-empty">
                    <div class="loading"></div>
                    <p data-i18n="history_calculating_stats">Berechne Statistiken...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Day Statistics Modal -->
    <div id="dayStatisticsModal" class="modal-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:2000; justify-content:center; align-items:center; padding:20px;">
        <div class="modal-panel sd-modal-panel" style="max-width:900px; max-height:90vh; overflow-y:auto;">
            <div class="sd-modal-header">
                <h2 id="day-statistics-title" class="sd-modal-title"></h2>
                <div class="sd-header-actions">
                    <button class="sd-close-btn" onclick="closeDayStatistics()">&times;</button>
                </div>
            </div>
            <div id="day-statistics-content" style="padding: 20px 25px;"></div>
        </div>
    </div>

    <script src="/static/auth-handler.js"></script>
    <script>

        let costSettings = {
            filament_per_kg: 25,
            power_per_kwh: 0.30
        };
        let currentTab = 'current';
        let currentPrintData = null;
        let printProgressChart = null;

        // Get translations
        function getText(key, fallback = key) {
            return window.i18nManager ? window.i18nManager.getText(key, fallback) : fallback;
        }

        let texts = {

        // Initialize page
        // Version marker: shows in the console which build is actually running.
        console.log('history.html Stand 20aug26 — Kosten-Aufschluesselung Filament/Strom');
        document.addEventListener('DOMContentLoaded', function() {
            if (window.tabBarManager) {
                window.tabBarManager.render();
            }

            // Direct link to an entry: /static/history.html?print=<id>
            // The homepage preview links here to the running print.
            // Slightly delayed so the list is already in place.
            const gewuenscht = new URLSearchParams(location.search).get('print');
            if (gewuenscht) {
                setTimeout(function() {
                    if (typeof showPrintDetails === 'function') {
                        showPrintDetails(parseInt(gewuenscht, 10), true);

            }

            loadHistorySettings().then(() => {
                loadHistory();
            });

        // Settings functions
        async function loadHistorySettings() {
            try {
                const response = await apiCall('/api/config');
                const config = await response.json();

                costSettings.filament_per_kg = config.costs?.filament_per_kg || 25;
                costSettings.power_per_kwh = config.costs?.power_per_kwh || 0.30;

                if (document.getElementById('hist_filament_cost')) {
                    document.getElementById('hist_filament_cost').value = costSettings.filament_per_kg;
                    document.getElementById('hist_power_cost').value = costSettings.power_per_kwh;
                }

                const maxCurrent = localStorage.getItem('history_max_current') || '10';
                if (document.getElementById('hist_max_current')) {
                    document.getElementById('hist_max_current').value = maxCurrent;
                }
            } catch (error) {
                console.error(texts.console_error_loading_settings + ':', error);
                costSettings.filament_per_kg = 25;
                costSettings.power_per_kwh = 0.30;
            }
        }

        async function saveHistorySettings() {
            const maxCurrent = document.getElementById('hist_max_current').value;
            localStorage.setItem('history_max_current', maxCurrent);

            const settings = {
                costs: {
                    filament_per_kg: parseFloat(document.getElementById('hist_filament_cost').value) || 25,
                    power_per_kwh: parseFloat(document.getElementById('hist_power_cost').value) || 0.30
                }
            };

            try {
                const response = await apiCall('/api/config', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(settings)
                });

                if (response.ok) {
                    costSettings.filament_per_kg = settings.costs.filament_per_kg;
                    costSettings.power_per_kwh = settings.costs.power_per_kwh;
                    showWebToast(texts.settings_saved_msg, 'success');
                    document.getElementById('history-settings-panel').classList.remove('hv-menue--auf');
                    loadHistory();
                } else {
                    showWebToast(texts.toast_error_saving, 'error');
                }
            } catch (error) {
                console.error(texts.console_error_saving + ':', error);
                showWebToast(texts.toast_error_saving, 'error');
            }
        }

        function toggleHistorySettings(e) {
            if (e) e.stopPropagation();
            document.getElementById('history-settings-panel').classList.toggle('hv-menue--auf');
        }
        document.addEventListener('click', () => {
            const m = document.getElementById('history-settings-panel');
            if (m) m.classList.remove('hv-menue--auf');

        // Tab switching
        function switchHistoryTab(tab) {
            document.querySelectorAll('.hist-tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('tab-' + tab).classList.add('active');

            const rahmen = document.getElementById('hv-rahmen');
            const istStat = (tab === 'statistics');
            rahmen.classList.toggle('hv-statistik', istStat);
            // Collapse the open detail view when switching to statistics,
            // otherwise switching back would leave it showing a print that
            // isn't even in the other tab's list.
            if (istStat) rahmen.classList.remove('hv-offen');

            // The search/filter bar belongs to the print list. Statistics
            // brings its own filters (time range, material, status) — having
            // both stacked is confusing, and the top one has no effect there.
            const controls = document.querySelector('.hist-controls');
            if (controls) controls.style.display = istStat ? 'none' : '';

            currentTab = tab;
            if (istStat) renderStatsTab(false);
            else renderListe();
        }

        // Load history data
        async function loadHistory(fresh) {
            // Always load ALL prints — status/material/search/sort run
            // client-side in applyHistoryFilters() (no re-fetch per filter).
            let url = '/api/history';
            // Cache-first: without fresh, the cache renders instantly; then
            // it reloads once live with fresh=1 and re-renders.
            if (fresh) url += (url.includes('?') ? '&' : '?') + 'fresh=1';

            try {
                const response = await apiCall(url);
                const data = await response.json();

                if (data.prints && data.prints.length > 0) {
                    _allPrints = data.prints;
                    // Statistics always run over ALL prints (unfiltered).
                    statsPrints = data.prints;
                    buildHistoryFilterOptions(_allPrints);
                    applyHistoryFilters();   // filters + splits + renders + updates counters
                    // Statistics dashboard is lazy: only render (including
                    // deep-detail loading) once the tab is open — otherwise
                    // it would fetch hundreds of detail JSONs on every history call.
                    if (currentTab === 'statistics') renderStatsTab(true);
                } else {
                    _listeAktuell = [];
                    _listeArchiv = [];
                    renderListe();
                    document.getElementById('history-tab-current-text').textContent =
                        texts.history_tab_current_count.replace('{count}', 0);
                    document.getElementById('history-tab-archive-text').textContent =
                        texts.history_tab_archive_count.replace('{count}', 0);
                }
            } catch (error) {
                console.error(texts.console_history_error + ':', error);
                document.getElementById('hv-liste').innerHTML =
                    `<div class="hist-empty"><span style="color: var(--color-red);">${texts.console_history_error}</span></div>`;
            }
            // Cache-first "then refresh": reload once live after the instant render.
            if (!fresh) loadHistory(true);
        }

        // One row of the print list. Deliberately narrow: the list sits
        // permanently next to the detail view, everything detailed goes on
        // the right. The status dot only appears when the print did NOT
        // succeed — eight green checkmarks in a row carry no information.
        function renderHistoryZeile(print) {
            const esc = s => String(s == null ? '' : s)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

            const dauer = (print.duration_minutes !== null && print.duration_minutes !== undefined)
                ? (print.duration_minutes < 60
                   ? `${Math.max(1, Math.round(print.duration_minutes))} min`
                   : `${Math.floor(print.duration_minutes / 60)}:${String(print.duration_minutes % 60).padStart(2, '0')} h`)
                // The running print already shows the "Printing" badge on the
                // right, so here we show the elapsed time instead — otherwise
                // the same word would appear twice in one line. A percentage
                // isn't possible: /api/history doesn't return last_progress.
                : (print.status === 'running'
                    ? _laufzeit(print.start_time)
                    : texts.unknown);

            const d = new Date(print.start_time);
            const datum = isNaN(d) ? '' : d.toLocaleDateString(undefined, { day: '2-digit', month: '2-digit' })
                + ' ' + d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });

            // A color dot up front — it belongs to the print, not at the end of the row.
            const farben = _zeilenFarben(print);
            const punkte = farben.slice(0, 3).map(c =>
                `<span class="hv-punkt" style="background:${esc(c)};" title="${esc(texts.detail_filament)}"></span>`).join('');

            // Success is the normal case and gets no badge. Eight green
            // checkmarks in a row carry no information; what should stand
            // out is what did NOT run normally — as a word, not a bare dot.
            const markeText = {
                running: texts.status_running, failed: texts.status_failed,
                cancelled: texts.status_cancelled
            }[print.status];
            const marke = markeText
                ? `<span class="hv-e-marke hv-e-marke--${esc(print.status)}">${esc(markeText)}</span>` : '';

            // Calibrations appear in the list too, but shouldn't look like a
            // print: their own badge, and the name is shown readably instead
            // of as calibrate_motion_precision.gcode.
            const system = !!print.is_system_run;
            const systemMarke = system
                ? `<span class="hv-e-marke hv-e-marke--system">${esc(texts.history_system_run || 'System')}</span>` : '';
            const anzeigeName = system
                ? String(print.filename || '').split('/').pop()
                    .replace(/\.(gcode\.3mf|gcode|3mf)$/, '').replace(/_/g, ' ')
                : print.filename;

            // Without a thumbnail, show an icon instead of an empty gray box.
            const bild = print.has_thumbnail
                ? `<img src="/api/history/${print.id}/thumbnail" alt=""
                        onerror="this.remove(); this.parentNode.classList.add('kein-bild');">` : '';
            const bildKlasse = print.has_thumbnail ? '' : ' kein-bild';


            return `
                <div class="hv-eintrag hv-eintrag--${esc(print.status)}${system ? ' hv-eintrag--system' : ''}" data-id="${print.id}"
                     onclick="showPrintDetails(${print.id})">
                    <div class="hv-e-bild${bildKlasse}"
                         ${print.has_thumbnail ? '' : `title="${esc(texts.no_thumbnail_reason || '')}"`}>${bild}</div>
                    <div class="hv-e-text">
                        <div class="hv-e-name" title="${esc(print.filename)}">${systemMarke}${esc(anzeigeName)}</div>
                        <div class="hv-e-meta">
                            ${punkte}
                            <span>${esc(datum)}</span>
                            <span>${esc(dauer)}</span>
                            ${print.total_layers ? `<span>${print.total_layers} ${esc(texts.detail_layers)}</span>` : ''}
                        </div>
                    </div>
                    ${marke}
                    <button class="hv-e-loeschen" title="${esc(texts.delete || 'Löschen')}"
                            onclick="event.stopPropagation(); deletePrintHistory(${print.id}, event)">
                        <svg class="hd-ic hd-ic--xs" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>
                    </button>
                </div>`;
        }

        // How long the running print has been going.
        function _laufzeit(start) {
            const t = new Date(String(start).replace(' ', 'T'));
            if (isNaN(t)) return texts.status_running;
            const min = Math.max(0, Math.round((Date.now() - t.getTime()) / 60000));
            return min < 60 ? `${min} min`
                : `${Math.floor(min / 60)}:${String(min % 60).padStart(2, '0')} h`;
        }

        // Colors of a print for the list row (max. 3 dots).
        function _zeilenFarben(print) {
            if (Array.isArray(print.filaments) && print.filaments.length) {
                return print.filaments.map(f => _normColor(f.color) || '#9ca3af');
            }
            if (print.filament_color) return [_normColor(print.filament_color) || '#9ca3af'];
            return [];
        }

        // The list always shows exactly one data set — the active tab's —
        // as a single container, so paging never walks through entries
        // hidden by CSS in an unused second container.
        function renderListe() {
            const el = document.getElementById('hv-liste');
            if (!el) return;
            _sichtbar = (currentTab === 'archive') ? _listeArchiv : _listeAktuell;

            if (!_sichtbar.length) {
                el.innerHTML = `<div class="hist-empty"><p>${
                    currentTab === 'archive'
                        ? (texts.history_archive_empty || 'Noch keine archivierten Drucke')
                        : (texts.stats_no_prints_history || '')
                }</p></div>`;
                return;
            }
            el.innerHTML = _sichtbar.map(renderHistoryZeile).join('');
            markiereAuswahl();
            aktualisiereBlaettern();
        }

        function markiereAuswahl() {
            document.querySelectorAll('#hv-liste .hv-eintrag').forEach(z => {
                z.classList.toggle('an', String(z.dataset.id) === String(_gewaehlt));
            });
        }

        // Sync the counter and arrow buttons in the detail header to the visible list.
        function aktualisiereBlaettern() {
            const i = _sichtbar.findIndex(p => String(p.id) === String(_gewaehlt));
            const zaehler = document.getElementById('hv-zaehler');
            const vor = document.getElementById('hv-vor');
            const zur = document.getElementById('hv-zurueck-btn');
            if (!zaehler || !vor || !zur) return;
            if (i < 0) { zaehler.textContent = ''; vor.disabled = true; zur.disabled = true; return; }
            zaehler.textContent = (texts.history_counter || '{n} von {total}')
                .replace('{n}', i + 1).replace('{total}', _sichtbar.length);
            vor.disabled = (i <= 0);
            zur.disabled = (i >= _sichtbar.length - 1);
        }

        function waehleNachbar(richtung) {
            const i = _sichtbar.findIndex(p => String(p.id) === String(_gewaehlt));
            if (i < 0) return;
            const ziel = _sichtbar[i + richtung];
            if (!ziel) return;
            showPrintDetails(ziel.id);
            // Scroll the selected row into view, otherwise paging continues
            // on the right while the highlight scrolls out of view on the left.
            const zeile = document.querySelector(`#hv-liste .hv-eintrag[data-id="${ziel.id}"]`);
            if (zeile) zeile.scrollIntoView({ block: 'nearest' });
        }

        // Arrow keys page through, Escape closes (back to the list on mobile).
        document.addEventListener('keydown', (e) => {
            const t = e.target;
            if (t && (/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName) || t.isContentEditable)) return;
            if (currentTab === 'statistics' || _gewaehlt == null) return;
            if (e.key === 'ArrowDown') { e.preventDefault(); waehleNachbar(1); }
            else if (e.key === 'ArrowUp') { e.preventDefault(); waehleNachbar(-1); }
            else if (e.key === 'Escape') closePrintDetails();
        });

        // ---- Filter bar (client-side, over the loaded prints) ----
        let _allPrints = [];
        let _histColor = '';   // selected filament color (filter)
        let _listeAktuell = [];  // prints in the "Current" tab
        let _listeArchiv = [];   // prints in the "Archive" tab
        let _sichtbar = [];      // what's currently in the list (basis for paging)
        let _gewaehlt = null;    // id of the print shown on the right

        // Pull materials from filament_type (single = plain string, multi =
        // JSON array string → parse it, otherwise split on , / ; and clean up).
        // Pull the real base material from filament_type/-name/filaments. The
        // DB often stores whole names + combos ("Bambu PETG Basic + 5 more")
        // in filament_type instead of the material → normalize here to known
        // materials (a Set, since combos exist).
        const _KNOWN_MATERIALS = ['PETG', 'TPU', 'ABS', 'ASA', 'PVA', 'HIPS', 'PLA'];
        function _historyMaterials(p) {
            // filament_material is the already-normalized base material and
            // thus the reliable source; the name fields are only the fallback
            // for older records without this column.
            const direkt = [];
            if (p.filament_material) String(p.filament_material).toUpperCase()
                .split(/[,;+/]/).map(x => x.trim()).forEach(x => { if (x) direkt.push(x); });
            if (Array.isArray(p.filaments)) p.filaments.forEach(f => {
                if (f.material) direkt.push(String(f.material).toUpperCase().trim());
            });
            if (direkt.length) return [...new Set(direkt)];

            const parts = [];
            if (p.filament_type) parts.push(String(p.filament_type));
            if (p.filament_name) parts.push(String(p.filament_name));
            if (Array.isArray(p.filaments)) p.filaments.forEach(f => {
                if (f.type) parts.push(String(f.type));
                if (f.name) parts.push(String(f.name));
            });
            const text = parts.join(' ').toUpperCase();
            const found = [];
            _KNOWN_MATERIALS.forEach(m => { if (text.includes(m)) found.push(m); });
            return found;
        }

        // Normalize the color value: add #, uppercase, strip alpha,
        // #RGB→#RRGGBB, discard invalid. Otherwise the same color gets
        // collected multiple times (#fff/#FFFFFF/ffffff).
        function _normColor(c) {
            if (!c) return '';
            let s = String(c).trim();
            if (!s) return '';
            if (s[0] !== '#') s = '#' + s;
            s = s.toUpperCase();
            if (/^#[0-9A-F]{8}$/.test(s)) s = s.slice(0, 7);           // strip alpha
            if (/^#[0-9A-F]{3}$/.test(s)) s = '#' + s[1] + s[1] + s[2] + s[2] + s[3] + s[3];
            return /^#[0-9A-F]{6}$/.test(s) ? s : '';
        }
        function _printColors(p) {
            const set = new Set();
            const c = _normColor(p.filament_color); if (c) set.add(c);
            if (Array.isArray(p.filaments)) p.filaments.forEach(f => { const fc = _normColor(f.color); if (fc) set.add(fc); });
            return set;
        }

        // Merge near-identical colors — DISTANCE-BASED (no grid): colors
        // within RGB distance D land in the same cluster, with the
        // representative being the most frequent actual color. This way
        // #000000 and #16161A end up together, for example (a grid would
        // split them at the boundary). _colorClusterMap gets filled in
        // buildHistoryFilterOptions.
        let _colorClusterMap = {};   // actual color (#RRGGBB) → cluster representative
        function _rgb(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
        function _buildColorClusters(colorCounts) {
            const D2 = 45 * 45;   // RGB distance threshold
            const items = [...colorCounts.entries()].sort((a, b) => b[1] - a[1]);  // most frequent first
            const clusters = [];
            _colorClusterMap = {};
            for (const [hex] of items) {
                const c = _rgb(hex);
                let hit = null;
                for (const cl of clusters) {
                    const r = _rgb(cl.rep);
                    if ((c[0] - r[0]) ** 2 + (c[1] - r[1]) ** 2 + (c[2] - r[2]) ** 2 <= D2) { hit = cl; break; }
                }
                if (hit) { _colorClusterMap[hex] = hit.rep; }
                else { clusters.push({ rep: hex }); _colorClusterMap[hex] = hex; }
            }
            return clusters;
        }
        function _printColorBuckets(p) {
            const s = new Set();
            _printColors(p).forEach(c => s.add(_colorClusterMap[c] || c));
            return s;
        }

        function buildHistoryFilterOptions(prints) {
            // The i18nManager doesn't handle placeholder/title → set them here.
            const searchEl = document.getElementById('hist-search');
            if (searchEl) searchEl.placeholder = texts.history_search_placeholder || 'Drucke durchsuchen...';
            const dedupEl = document.getElementById('hist-dedup');
            if (dedupEl) dedupEl.title = texts.history_hide_duplicates || 'Duplikate ausblenden';

            const mats = new Set(), printers = new Set();
            const colorCounts = new Map();   // actual color → frequency
            prints.forEach(p => {
                if (p.printer_type) printers.add(p.printer_type);
                _printColors(p).forEach(c => colorCounts.set(c, (colorCounts.get(c) || 0) + 1));
                _historyMaterials(p).forEach(m => mats.add(m));
            });
            const colorClusters = _buildColorClusters(colorCounts);
            const matSel = document.getElementById('hist-material');
            const curMat = matSel.value;
            matSel.innerHTML = `<option value="">${texts.history_filter_material_all || 'Alle Materialien'}</option>` +
                [...mats].sort().map(m => `<option value="${m}">${m}</option>`).join('');
            matSel.value = curMat;

            const prSel = document.getElementById('hist-printer');
            if (printers.size > 1) {
                const curPr = prSel.value;
                prSel.innerHTML = `<option value="">${texts.history_filter_printer_all || 'Alle Drucker'}</option>` +
                    [...printers].sort().map(t => `<option value="${t}">${t.charAt(0).toUpperCase() + t.slice(1)}</option>`).join('');
                prSel.value = curPr;
                prSel.style.display = '';
            } else {
                prSel.style.display = 'none';
            }

            const colorRow = document.getElementById('hist-color-row');
            const colorBox = document.getElementById('hist-colors');
            if (colorClusters.length > 0) {
                colorBox.innerHTML = colorClusters.map(cl =>
                    `<span class="hist-color-dot ${_histColor === cl.rep ? 'active' : ''}" style="background:${cl.rep};" title="${cl.rep}" data-bucket="${cl.rep}" onclick="toggleHistColor('${cl.rep}')"></span>`).join('');
                colorRow.style.display = '';
            } else {
                colorRow.style.display = 'none';
            }
        }

        function toggleHistColor(k) {
            _histColor = (_histColor === k) ? '' : k;   // k = Farb-Bucket
            document.querySelectorAll('#hist-colors .hist-color-dot').forEach(el =>
                el.classList.toggle('active', el.dataset.bucket === _histColor));
            applyHistoryFilters();
        }

        function toggleHistDedup() {
            document.getElementById('hist-dedup').classList.toggle('active');
            applyHistoryFilters();
        }

        function applyHistoryFilters() {
            const q = (document.getElementById('hist-search').value || '').toLowerCase().trim();
            const status = document.getElementById('history-filter').value;
            const mat = document.getElementById('hist-material').value;
            const prSel = document.getElementById('hist-printer');
            const printer = (prSel && prSel.style.display !== 'none') ? prSel.value : '';
            const sort = document.getElementById('hist-sort').value;
            const dedup = document.getElementById('hist-dedup').classList.contains('active');

            let list = _allPrints.slice();
            if (q) list = list.filter(p => (p.filename || '').toLowerCase().includes(q));
            if (status === 'system') list = list.filter(p => p.is_system_run);
            else if (status) list = list.filter(p => p.status === status && !p.is_system_run);
            if (mat) list = list.filter(p => _historyMaterials(p).includes(mat));
            if (printer) list = list.filter(p => (p.printer_type || '') === printer);
            if (_histColor) list = list.filter(p => _printColorBuckets(p).has(_histColor));

            const tms = p => new Date(p.start_time || 0).getTime();
            const dur = p => (p.duration_minutes || 0);
            if (sort === 'oldest') list.sort((a, b) => tms(a) - tms(b));
            else if (sort === 'longest') list.sort((a, b) => dur(b) - dur(a));
            else if (sort === 'shortest') list.sort((a, b) => dur(a) - dur(b));
            else list.sort((a, b) => tms(b) - tms(a)); // newest

            if (dedup) {
                const seen = new Set();
                list = list.filter(p => { if (seen.has(p.filename)) return false; seen.add(p.filename); return true; });
            }

            const maxCurrent = parseInt(localStorage.getItem('history_max_current') || '10');
            _listeAktuell = list.slice(0, maxCurrent);
            _listeArchiv = list.slice(maxCurrent);
            document.getElementById('history-tab-current-text').textContent =
                texts.history_tab_current_count.replace('{count}', _listeAktuell.length);
            document.getElementById('history-tab-archive-text').textContent =
                texts.history_tab_archive_count.replace('{count}', _listeArchiv.length);
            renderListe();
        }

        // Calculate and render statistics
        // Statistics dashboard (ported from Android's AnalyticsDashboard, analytics-dashboard.js).
        function calculateStatistics(prints) {
            const container = document.getElementById('history-list-statistics');
            if (!container || !window.AnalyticsDashboard || !window.HistoryAnalytics) return;
            window.AnalyticsDashboard.render(container, prints || [], {
                filamentDefaultPerKg: (costSettings && costSettings.filament_per_kg) || 21,
                powerPerKwh: (costSettings && costSettings.power_per_kwh) || 0.30,
                fetchDetail: async (id) => { const r = await apiCall('/api/history/' + id); return r && r.ok ? await r.json() : null; },
                // Error profile: ONE query over all events instead of per
                // print — the profile shouldn't stop at the most recent
                // prints the way the detail fetches do (DEEP_CAP).
                fetchHmsProfile: async (tage) => {
                    const r = await apiCall('/api/history/hms-profile'
                        + (tage ? '?days=' + tage : ''));
                    return r && r.ok ? await r.json() : null;
                },
                // Humidity memory: history per AMS unit and a verdict per
                // slot. Doesn't come from the print data but from its own
                // measurement series — hence a separate fetch.
                fetchFeuchte: async (tage) => {
                    const r = await apiCall('/api/filament/feuchte?tage=' + (tage || 30));
                    return r && r.ok ? await r.json() : null;
                },
                // Opening a print from within statistics: first switch back
                // to the matching tab. In statistics mode the list and detail
                // are hidden — calling showPrintDetails alone would fill an
                // invisible panel and appear to do nothing.
                onOpenPrint: (id) => {
                    if (id == null || typeof showPrintDetails !== 'function') return;
                    const imArchiv = _listeArchiv.some(p => String(p.id) === String(id));
                    switchHistoryTab(imArchiv ? 'archive' : 'current');
                    showPrintDetails(id);
                    const zeile = document.querySelector(`#hv-liste .hv-eintrag[data-id="${id}"]`);
                    if (zeile) zeile.scrollIntoView({ block: 'nearest' });
                }
            });
        }

        // Lazy render of the statistics dashboard: only once, on first
        // opening the tab (the deep cache stays alive in the render
        // closure). force=true on a data refresh.
        let statsBuilt = false;
        let statsPrints = [];
        function renderStatsTab(force) {
            if (statsBuilt && !force) return;
            calculateStatistics(statsPrints || []);
            statsBuilt = true;
        }

        // Get filament color based on name
        function getFilamentColor(type) {
            const typeLower = type.toLowerCase();
            if (typeLower.includes('black') || typeLower.includes('schwarz')) return '#2c2c2c';
            if (typeLower.includes('white') || typeLower.includes('weiß')) return '#e0e0e0';
            if (typeLower.includes('red') || typeLower.includes('rot')) return '#dc3545';
            if (typeLower.includes('green') || typeLower.includes('grün')) return '#28a745';
            if (typeLower.includes('blue') || typeLower.includes('blau')) return '#007bff';
            if (typeLower.includes('yellow') || typeLower.includes('gelb')) return '#ffc107';
            if (typeLower.includes('orange')) return '#fd7e14';
            if (typeLower.includes('purple') || typeLower.includes('violet') || typeLower.includes('lila')) return '#6f42c1';
            if (typeLower.includes('pink') || typeLower.includes('rosa')) return '#e83e8c';
            if (typeLower.includes('beige') || typeLower.includes('sand')) return '#c8b88b';
            if (typeLower.includes('brown') || typeLower.includes('braun')) return '#795548';
            if (typeLower.includes('grey') || typeLower.includes('gray') || typeLower.includes('grau')) return '#6c757d';
            if (typeLower.includes('silver') || typeLower.includes('silber')) return '#b8b8b8';
            if (typeLower.includes('gold')) return '#ffb700';
            if (typeLower.includes('military')) return '#4b5320';
            if (typeLower.includes('brick') || typeLower.includes('ziegel')) return '#8b4513';
            if (typeLower.includes('pastel') && typeLower.includes('pink')) return '#ffb3d9';
            return '#666';
        }

        // Custom confirm dialog (same style as index.html)
        function showConfirmDialog(message, title, options = {}) {
            title = title || texts.confirm_title || 'Bestätigung';
            const okText = options.okText || texts.confirm_ok || 'Löschen';
            const okClass = options.okClass || 'hist-btn--danger';
            const icon = options.icon || `<svg class="hd-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 9v5M12 17.5v.5"/><path d="M10.3 4.3 2.6 18a2 2 0 0 0 1.7 3h15.4a2 2 0 0 0 1.7-3L13.7 4.3a2 2 0 0 0-3.4 0z"/></svg>`;
            return new Promise((resolve) => {
                const existing = document.getElementById('customConfirmDialog');
                if (existing) existing.remove();

                const modal = document.createElement('div');
                modal.id = 'customConfirmDialog';
                modal.className = 'modal-overlay';
                modal.style.cssText = 'display:flex; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:9999; justify-content:center; align-items:center;';

                modal.innerHTML = `
                    <div class="modal-panel sd-modal-panel" style="max-width:420px;">
                        <div class="sd-modal-header">
                            <h2 class="sd-modal-title">${icon} ${title}</h2>
                        </div>
                        <div class="sd-modal-body">
                            <div style="color:var(--text-primary); font-size:14px; line-height:1.6;">${message}</div>
                            <div style="display:flex; gap:10px; justify-content:flex-end; margin-top:20px;">
                                <button class="hist-btn" id="confirm-cancel-btn">${texts.cancel || 'Abbrechen'}</button>
                                <button class="hist-btn ${okClass}" id="confirm-ok-btn">${okText}</button>
                            </div>
                        </div>
                    </div>
                `;

                document.body.appendChild(modal);

                const close = (result) => {
                    modal.remove();
                    resolve(result);
                };

                document.getElementById('confirm-ok-btn').addEventListener('click', () => close(true));
                document.getElementById('confirm-cancel-btn').addEventListener('click', () => close(false));
                modal.addEventListener('click', (e) => { if (e.target === modal) close(false); });
            });
        }

        // Custom toast (named showWebToast to avoid a conflict with
        // Electron's toast.js).
        function showWebToast(message, type = 'success') {
            if (typeof window.skToast === 'function') window.skToast(message, type);
            else console.log(message);
        }

        async function deletePrintHistory(printId, event) {
            if (event) event.stopPropagation();
            const confirmed = await showConfirmDialog(texts.confirm_delete_from_history, texts.confirm_title || 'Bestätigung');
            if (!confirmed) return;

            try {
                const response = await apiCall(`/api/history/${printId}`, { method: 'DELETE' });
                if (response.ok) {
                    showWebToast(texts.toast_print_deleted, 'success');
                    // Otherwise the print one had just deleted stayed on
                    // the right, "print again" button included.
                    if (String(_gewaehlt) === String(printId)) closePrintDetails();
                    loadHistory();
                } else {
                    showWebToast(texts.toast_error_deleting, 'error');
                }
            } catch (error) {
                console.error(texts.console_delete_error + ':', error);
                showToast(texts.toast_error_deleting, 'error');
            }
        }

        // Show print details
        async function showPrintDetails(printId, fresh = false) {
            _gewaehlt = printId;
            markiereAuswahl();
            aktualisiereBlaettern();
            document.getElementById('hv-nichts').style.display = 'none';
            document.getElementById('hv-inhalt').style.display = '';
            // On narrow screens the detail slides over the list.
            document.getElementById('hv-rahmen').classList.add('hv-offen');

            // A chart from the previously chosen print otherwise holds its data
            // and draws the wrong trace on a tab change.
            if (printProgressChart) { printProgressChart.destroy(); printProgressChart = null; }

            try {
                const response = await apiCall(`/api/history/${printId}${fresh ? '?fresh=1' : ''}`);
                const data = await response.json();
                currentPrintData = data;
                _histMeshRendered = false;

                const timelapseBtn = document.getElementById('timelapse-tab-btn');
                if (timelapseBtn && data.print.status !== 'running' && data.print.timelapse_enabled) {
                    apiCall(`/api/history/${printId}/timelapse_status`)
                        .then(res => res.json())
                        .then(status => {
                            if (status.available) timelapseBtn.style.display = 'block';
                        })
                        .catch(err => console.error('Timelapse check failed:', err));
                }

                // Show the console tab only when there are lines (Klipper).
                const consoleBtn = document.getElementById('console-tab-btn');
                if (consoleBtn) {
                    consoleBtn.style.display = (data.console_log && data.console_log.length > 0)
                        ? 'block' : 'none';
                }

                // The bed mesh tab only when this print has a snapshot (the
                // companion stores it on the bed_mesh_end macro event).
                const meshBtn = document.getElementById('mesh-tab-btn');
                if (meshBtn) {
                    meshBtn.style.display = (data.print && data.print.bed_mesh) ? 'block' : 'none';
                }

                const escHtml = s => String(s == null ? '' : s)
                    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                // The file name gets the full header and is clipped by CSS --
                // no more cutting at 50 characters, which clipped even with
                // plenty of room.
                document.getElementById('detail-title').textContent = data.print.filename;

                // Subline: when it was printed and with what. The state stands
                // on the right as a chip -- in running text it was lost.
                const p = data.print;
                const dt = new Date(p.start_time);
                const teile = [];
                if (!isNaN(dt)) teile.push(escHtml(dt.toLocaleString(undefined,
                    { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' })));
                if (p.filament_type) teile.push(escHtml(p.filament_type));
                else if (p.filament_material) teile.push(escHtml(p.filament_material));
                if (p.printer_type === 'klipper') {
                    const pid = (p.printer_id && !['klipper', 'klipper_local'].includes(p.printer_id))
                        ? ' · ' + escHtml(p.printer_id) : '';
                    teile.push(`<span class="hist-printer-tag" title="Klipper / Moonraker"><i class="fas fa-microchip"></i> Klipper${pid}</span>`);
                }
                document.getElementById('detail-info').innerHTML = teile.join(' · ');

                const stTxt = { success: texts.status_success, failed: texts.status_failed,
                                cancelled: texts.status_cancelled, running: texts.status_running }[p.status] || p.status;
                const stIco = p.status === 'success'
                    ? '<svg class="hd-ic hd-ic--xs" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 13 4 4L19 7"/></svg>'
                    : (p.status === 'running'
                        ? '<svg class="hd-ic hd-ic--xs" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>'
                        : '<svg class="hd-ic hd-ic--xs" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16v.5"/></svg>');
                const chip = document.getElementById('hv-marke');
                chip.className = 'hv-marke hv-marke--' + p.status;
                chip.innerHTML = stIco + ' ' + escHtml(stTxt);

                const thumbImg = document.getElementById('detail-thumbnail');
                const thumbBox = thumbImg.parentNode;
                if (data.print.thumbnail_base64) {
                    thumbImg.src = `/api/history/${printId}/thumbnail`;
                    thumbImg.style.display = 'block';
                    thumbBox.classList.remove('kein-bild');
                    thumbBox.removeAttribute('title');
                } else {
                    thumbImg.style.display = 'none';
                    thumbBox.classList.add('kein-bild');
                    thumbBox.title = texts.no_thumbnail_reason || '';
                }

                showOverviewTab(data);
                switchDetailTab('overview');
            } catch (error) {
                console.error(texts.console_detail_error + ':', error);
                showWebToast(texts.alert_error_loading_details, 'error');
            }
        }

        // Line icons of the detail sections. Emoji looked different on every
        // system and did not match the icons in the rest of the interface.
        const HIST_ICO = {
            eckdaten:    '<svg class="hd-ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>',
            temperatur:  '<svg class="hd-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 14.8V5a2 2 0 1 0-4 0v9.8a4.5 4.5 0 1 0 4 0z"/></svg>',
            kosten:      '<svg class="hd-ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M15 9H10.5a1.5 1.5 0 0 0 0 3h3a1.5 1.5 0 0 1 0 3H9M12 6v2M12 16v2"/></svg>',
            fortschritt: '<svg class="hd-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h16M7 16V8M12 16V4M17 16v-6"/></svg>',
            filament:    '<svg class="hd-ic" viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v12c0 1.7 3.1 3 7 3s7-1.3 7-3V6"/></svg>',
            einstellung: '<svg class="hd-ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>',
            kalender:    '<svg class="hd-ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
            drucker:     '<svg class="hd-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9V3h12v6"/><path d="M6 18H4a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-2"/><path d="M6 14h12v7H6z"/></svg>'
        };

        // Show overview tab
        function showOverviewTab(data) {
            const d = data || currentPrintData;
            if (!d) return;

            const stats = d.statistics || {};
            const print = d.print || {};
            const set = d.settings || {};
            const T = texts;

            const esc = v => String(v == null ? '' : v)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            const zahl = (v, einheit) => `<span class="hv-wert-zahl">${esc(v)}${einheit ? ` <small>${esc(einheit)}</small>` : ''}</span>`;
            // Missing values are named as such. A tilde used to stand there
            // beside "0.00 €" -- which read like a measured value.
            const fehlt = (was) => `<span class="hv-wert-zahl hv-wert-zahl--leer">— <small>${esc(was || T.detail_not_recorded)}</small></span>`;
            const wert = (name, inhalt) =>
                `<div class="hv-wert"><span class="hv-wert-name">${esc(name)}</span>${inhalt}</div>`;
            const stunden = (min) => {
                if (min == null) return null;
                if (min < 60) return `${Math.round(min)} min`;
                return `${Math.floor(min / 60)}:${String(Math.round(min % 60)).padStart(2, '0')} h`;
            };

            // ---- Card 1: planned against measured --------------------------
            // Both used to stand mixed in different boxes -- the nozzle with
            // 275 °C under "temperatures" and with 280 °C under "print
            // settings", with no hint which value was which.
            const planMin = set.print_time_estimate ? set.print_time_estimate / 60 : null;
            const geplant = [
                wert(T.detail_duration, planMin != null ? zahl(stunden(planMin)) : fehlt()),
                wert(T.detail_filament, print.planned_filament_grams
                    ? zahl(Number(print.planned_filament_grams).toFixed(1), 'g') : fehlt()),
                wert(T.detail_nozzle, set.nozzle_temp ? zahl(set.nozzle_temp, '°C') : fehlt()),
                wert(T.detail_bed, set.bed_temp ? zahl(set.bed_temp, '°C') : fehlt())
            ].join('');

            // Successful = every layer printed; the companion's last sample
            // often lies one or two layers below that.
            const pr = d.progress || [];
            const letzteSchicht = pr.length ? pr[pr.length - 1].layer : null;
            const schichten = (print.status === 'success' && print.total_layers)
                ? print.total_layers : letzteSchicht;
            const endstand = print.status === 'success' ? 100
                : (pr.length ? Math.round(pr[pr.length - 1].progress) : null);

            const gemessen = [
                wert(T.detail_duration, print.duration_minutes != null
                    ? zahl(stunden(print.duration_minutes)) : fehlt()),
                wert(T.detail_layers, schichten != null
                    ? zahl(schichten, print.total_layers ? '/ ' + print.total_layers : '') : fehlt()),
                wert(T.detail_nozzle_max, stats.max_nozzle_temp != null
                    ? zahl(Math.round(stats.max_nozzle_temp), '°C') : fehlt()),
                wert(T.detail_bed_max, stats.max_bed_temp != null
                    ? zahl(Math.round(stats.max_bed_temp), '°C') : fehlt()),
                // The final state only when it says something -- on a
                // successful print 100 % is no information.
                print.status !== 'success' && endstand != null
                    ? wert(T.detail_final_progress, zahl(endstand, '%')) : '',
                stats.avg_chamber_temp != null
                    ? wert(T.detail_chamber, zahl(Math.round(stats.avg_chamber_temp), '°C')) : '',
                stats.avg_chamber_humidity != null
                    ? wert(T.detail_humidity, zahl(Math.round(stats.avg_chamber_humidity), '%')) : ''
            ].join('');

            let html = `
                <div class="hv-karte">
                    <div class="hv-karte-kopf">${HIST_ICO.fortschritt} ${esc(T.detail_print_card)}</div>
                    <div class="hv-paar">
                        <div>
                            <div class="hv-paar-kopf">${esc(T.detail_planned)}</div>
                            <div class="hv-werte hv-werte--2">${geplant}</div>
                        </div>
                        <div>
                            <div class="hv-paar-kopf">${esc(T.detail_measured)}</div>
                            <div class="hv-werte hv-werte--2">${gemessen}</div>
                        </div>
                    </div>
                </div>`;

            // ---- Karte 2: Kosten ---------------------------------------------
            const hatFil = stats.filament_used_grams > 0 || stats.filament_cost_eur > 0;
            html += `
                <div class="hv-karte">
                    <div class="hv-karte-kopf">${HIST_ICO.kosten} ${esc(T.detail_costs)}</div>
                    <div class="hv-werte">
                        ${wert(T.detail_filament, hatFil
                            ? zahl(Number(stats.filament_used_grams).toFixed(1), 'g') : fehlt())}
                        ${wert(T.detail_power, stats.total_power_kwh != null
                            ? zahl(Number(stats.total_power_kwh).toFixed(3), 'kWh') : fehlt())}
                        ${wert(T.detail_filament_cost, hatFil
                            ? zahl(Number(stats.filament_cost_eur).toFixed(2), '€') : fehlt())}
                        ${wert(T.detail_power_cost, stats.power_cost_eur != null
                            ? zahl(Number(stats.power_cost_eur).toFixed(2), '€') : fehlt())}
                        ${(hatFil || stats.power_cost_eur > 0)
                            ? wert(T.detail_total, zahl(calculateCost(stats, print), '€'))
                            : wert(T.detail_total, fehlt())}
                    </div>
                </div>`;

            // ---- Karte 3: Filamente ------------------------------------------
            // The print_filaments table is only filled for multi-colour
            // prints. With a single filament the card therefore stayed away
            // entirely, although name, type and colour are in the print record
            // -- they then stood only small in the header.
            let fils = Array.isArray(d.filaments) ? d.filaments : [];
            if (!fils.length && (print.filament_type || print.filament_material)) {
                fils = [{
                    name: print.filament_type || print.filament_material,
                    type: print.filament_material || '',
                    color: print.filament_color,
                    used_grams: (stats.filament_used_grams > 0) ? stats.filament_used_grams : null
                }];
            }
            if (fils.length) {
                html += `
                <div class="hv-karte">
                    <div class="hv-karte-kopf">${HIST_ICO.filament} ${esc(fils.length > 1
                        ? (T.detail_filaments || 'Filamente') : T.detail_filament)}</div>
                    <div class="hv-fil-liste">
                        ${fils.map((f, i) => `
                            <div class="hv-fil">
                                <span class="hv-fil-punkt" style="background:${esc(_normColor(f.color)
                                    || getFilamentColor(f.name || f.type || ''))};"></span>
                                <span class="hv-fil-name">${esc(f.name || f.type || '—')}</span>
                                ${(f.type && f.type !== f.name) ? `<span class="hv-fil-typ">${esc(f.type)}</span>` : ''}
                                ${f.used_grams ? `<span class="hv-fil-g">${Number(f.used_grams).toFixed(1)} g</span>` : ''}
                                ${fils.length > 1 ? `<span class="hv-fil-nr">#${i + 1}</span>` : ''}
                            </div>`).join('')}
                    </div>
                </div>`;
            }

            // ---- Karte 4: Slicer-Einstellungen -------------------------------
            // Only show it when something is actually in there. For prints
            // without a reachable 3MF (straight from Bambu Studio) the
            // database holds a record of nothing but NULL -- except two zeros
            // for the switches, which then appeared as "supports: off",
            // although we do not know at all.
            const echteWerte = ['layer_height', 'infill_density', 'wall_loops', 'print_speed',
                                'nozzle_temp', 'bed_temp', 'nozzle_diameter',
                                'top_layers', 'bottom_layers', 'print_time_estimate'];
            const hatEinstellungen = set && echteWerte.some(k => set[k] != null);
            if (hatEinstellungen) {
                const anAus = v => `<span class="hv-wert-zahl${v ? '' : ' hv-wert-zahl--leer'}">${esc(v ? T.detail_on : T.detail_off)}</span>`;
                const teile = [
                    set.layer_height ? wert(T.detail_layer_height, zahl(set.layer_height, 'mm')) : '',
                    set.infill_density != null ? wert(T.detail_infill, zahl(set.infill_density, '%')) : '',
                    set.wall_loops ? wert(T.detail_wall_loops, zahl(set.wall_loops)) : '',
                    set.print_speed ? wert(T.detail_speed, zahl(set.print_speed, 'mm/s')) : '',
                    set.nozzle_diameter ? wert(T.detail_nozzle_diameter, zahl(set.nozzle_diameter, 'mm')) : '',
                    (set.top_layers || set.bottom_layers)
                        ? wert(T.detail_top_bottom, zahl(`${set.top_layers || '—'} / ${set.bottom_layers || '—'}`)) : '',
                    set.support_enabled != null ? wert(T.detail_support, anAus(set.support_enabled)) : '',
                    set.ironing_enabled != null ? wert(T.detail_ironing, anAus(set.ironing_enabled)) : '',
                    // The file size used to stand twice on the same sheet with
                    // different values (1.5 MB above, 1.4 MB below) -- because
                    // one divided by 1e6 and the other by 1048576.
                    print.file_size ? wert(T.detail_file_size,
                        zahl((print.file_size / 1048576).toFixed(1), 'MB')) : ''
                ].join('');
                html += `
                <div class="hv-karte">
                    <div class="hv-karte-kopf">${HIST_ICO.einstellung} ${esc(T.detail_slicer_settings)}</div>
                    <div class="hv-werte">${teile}</div>
                </div>`;
            }

            // Without a preview, explain once why -- otherwise it looks like a
            // fault on our side.
            if (!print.thumbnail_base64) {
                html += `
                <div class="hv-karte hv-karte--hinweis">
                    <div class="hv-kein-bild-zeile">
                        <span class="kein-bild hv-kein-bild-ic"></span>
                        <span>
                            <b>${esc(T.no_thumbnail || 'Kein Vorschaubild')}</b>
                            <span>${esc(T.no_thumbnail_reason || '')}</span>
                        </span>
                    </div>
                </div>`;
            }

            document.getElementById('detail-stats').innerHTML = html;
        }

        // Switch detail tab
        function switchDetailTab(tab) {
            document.querySelectorAll('.hist-detail-tab').forEach(btn => {
                btn.classList.remove('active');
            });
            document.querySelector(`[data-tab="${tab}"]`).classList.add('active');

            document.querySelectorAll('.detail-tab-content').forEach(content => {
                content.style.display = 'none';
            });
            document.getElementById(tab + '-tab').style.display = 'block';

            if (tab === 'mesh' && currentPrintData) showBedMeshTab();
            else if (tab === 'chart' && currentPrintData) showProgressChart();
            else if (tab === 'events' && currentPrintData) showEventsTimeline();
            else if (tab === 'timelapse' && currentPrintData) showTimelapse();
            else if (tab === 'console' && currentPrintData) showConsoleLog();
        }

        // Bed-Mesh-Tab: Snapshot-JSON {matrix, mesh_min, mesh_max, profile_name}
        // from the history (companion) -- the same Plotly renderer as
        // bedmesh.html (the live view), only with static instead of polled data.
        var PORTLAND_MESH = [
            [0.0, '#313695'], [0.1, '#4575b4'], [0.2, '#74add1'], [0.3, '#abd9e9'],
            [0.4, '#e0f3f8'], [0.5, '#ffffbf'], [0.6, '#fee090'], [0.7, '#fdae61'],
            [0.8, '#f46d43'], [0.9, '#d73027'], [1.0, '#a50026']
        ];
        function renderHistoryMesh(d) {
            var z = d.matrix;
            if (!z || !z.length || !z[0] || !z[0].length) return;
            var rows = z.length, cols = z[0].length;
            var minx = d.mesh_min[0], miny = d.mesh_min[1];
            var maxx = d.mesh_max[0], maxy = d.mesh_max[1];
            var x = [], y = [];
            for (var c = 0; c < cols; c++) x.push(minx + (maxx - minx) * c / (cols - 1));
            for (var r = 0; r < rows; r++) y.push(miny + (maxy - miny) * r / (rows - 1));

            var zmin = Infinity, zmax = -Infinity;
            for (var r2 = 0; r2 < rows; r2++) for (var c2 = 0; c2 < z[r2].length; c2++) {
                var v = z[r2][c2]; if (v < zmin) zmin = v; if (v > zmax) zmax = v;
            }

            var data = [{
                type: 'surface', x: x, y: y, z: z,
                colorscale: PORTLAND_MESH, cmin: zmin, cmax: zmax, showscale: true,
                colorbar: { thickness: 14, len: 0.85, x: 0.0, xanchor: 'left', tickfont: { color: '#ddd', size: 11 } },
                lighting: { ambient: 0.95, diffuse: 0.25, specular: 0.05 }, hidesurface: false
            }];
            var ax = {
                gridcolor: '#3a3a44', zerolinecolor: '#555', color: '#bbb',
                backgroundcolor: 'rgba(0,0,0,0)', showbackground: true, titlefont: { color: '#ccc' }
            };
            var absX = Math.abs(maxx - minx), absY = Math.abs(maxy - miny);
            var minXY = Math.max(1, Math.min(absX, absY));
            var layout = {
                paper_bgcolor: 'rgba(0,0,0,0)', plot_bgcolor: 'rgba(0,0,0,0)',
                margin: { l: 0, r: 0, t: 0, b: 0 }, font: { color: '#ccc' },
                scene: {
                    xaxis: Object.assign({ title: 'X', range: [minx, maxx] }, ax),
                    yaxis: Object.assign({ title: 'Y', range: [miny, maxy] }, ax),
                    zaxis: Object.assign({ title: 'Z', range: [-1, 1] }, ax),
                    aspectmode: 'manual', aspectratio: { x: absX / minXY, y: absY / minXY, z: 1 },
                    camera: { eye: { x: 1.3, y: -1.5, z: 0.9 } }
                }
            };
