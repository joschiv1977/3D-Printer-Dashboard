<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title id="page-title">Bed Mesh - 3D Printer Dashboard</title>

    <!-- PWA Support -->
    <link rel="manifest" href="/manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">

    <!-- Shared Styles -->
    <link rel="stylesheet" href="/static/css/shared-styles.css?v=2">
    <link rel="stylesheet" href="/static/font-awesome.min.css">
    <link rel="stylesheet" href="/static/css/design-tokens.css?v=2">
    <link rel="stylesheet" href="/static/css/base.css?v=2">
    <link rel="stylesheet" href="/static/css/tab-bar.css?v=2">
    <link rel="stylesheet" href="/static/css/meldungen.css">

    <!--Language files-->
    <script src="/static/lang/de.js"></script>
    <script src="/static/lang/en.js"></script>
    <script src="/static/lang/fr.js"></script>
    <script src="/static/lang/es.js"></script>
    <script src="/static/lang/it.js"></script>

    <!--Plotly (offline bundle, gl3d) -- same as in the Android WebView-->
    <script src="/static/vendor/plotly-gl3d.min.js"></script>

    <style>
        body { padding-bottom: 90px; }
        .bm-container { max-width: 1000px; margin: 0 auto; padding: 20px; }
        @media (max-width: 768px) { .bm-container { padding: 8px; } }

        /* A header as on history, maintenance, slicer and user: a line icon,
           a 17px title, no box. */
        .bm-header {
            display: flex; align-items: center;
            gap: 9px; flex-wrap: wrap; margin-bottom: 12px;
        }
        .bm-header h1 {
            margin: 0; font-size: 17px; font-weight: 650;
            display: flex; align-items: center; gap: 8px;
        }
        .bm-kopf-luft { flex: 1; }
        .bm-actions { display: flex; gap: 7px; }
        .bm-ic {
            width: 17px; height: 17px; stroke: currentColor; fill: none;
            stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
            flex: 0 0 auto;
        }
        .bm-ic--lg { width: 18px; height: 18px; }

        /* Button dimensions from design-tokens.css -- the same as everywhere. */
        .btn {
            background: rgba(33, 150, 243, 0.15);
            border: 1px solid rgba(33, 150, 243, 0.3);
            color: var(--accent-blue, #2196f3);
            padding: var(--knopf-polster); min-height: var(--knopf-hoehe);
            border-radius: var(--knopf-radius); cursor: pointer;
            font-size: var(--knopf-schrift); font-weight: 600; transition: all 0.2s;
            display: inline-flex; align-items: center; justify-content: center; gap: 6px;
        }
        body:not(.dark-mode) .btn { color: #1565c0; }
        .btn:hover:not(:disabled) { background: rgba(33, 150, 243, 0.25); transform: translateY(-1px); }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-danger { background: rgba(244, 67, 54, 0.15); border: 1px solid rgba(244, 67, 54, 0.3); color: var(--accent-red, #f44336); }
        body:not(.dark-mode) .btn-danger { color: #c62828; }
        .btn-danger:hover:not(:disabled) { background: rgba(244, 67, 54, 0.25); }

        /* A solid dark background: WebGL/gl3d sometimes does not render at
           all on a transparent one. A fixed height -- height:100% resolves to 0. */
        .bm-plot-card {
            background: #15151a; border-radius: 14px; overflow: hidden;
            margin-bottom: 16px;
        }
        #plot { width: 100%; height: 440px; }
        @media (max-width: 768px) { #plot { height: 340px; } }

        .bm-empty {
            color: var(--text-secondary); text-align: center;
            padding: 40px 16px; font-size: 15px;
        }
        .bm-info-row {
            display: flex; justify-content: space-between; gap: 12px;
            padding: 6px 0; font-size: 14px;
        }
        .bm-info-row .bm-label { color: var(--text-secondary); }
        .bm-info-row .bm-value { font-family: monospace; }
        .bm-profiles { margin-top: 10px; }
        .bm-profile { font-family: monospace; font-size: 13px; padding: 2px 0; }
    </style>
</head>
<body>
    <!--Apply dark mode immediately (no white flash)-->
    <script>
        (function () {
            const theme = localStorage.getItem('theme') || 'auto';
            if (theme === 'dark') document.body.classList.add('dark-mode');
            else if (theme === 'auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
                document.body.classList.add('dark-mode');
        })();
    </script>

    <!-- Shared Module Scripts -->
    <script src="/static/js/modules/icons.js"></script>
    <script src="/static/js/modules/theme-manager.js"></script>
    <script src="/static/js/modules/i18n-manager.js"></script>
    <script src="/static/js/modules/tab-bar-manager.js"></script>
    <script src="/static/js/modules/confirm-dialog.js"></script>

    <div class="bm-container">
        <div class="bm-header">
            <h1>
                <svg class="bm-ic bm-ic--lg" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7l6-3 6 3 6-3v13l-6 3-6-3-6 3z"/><path d="M9 4v13M15 7v13"/></svg>
                <span data-i18n="bedmesh_title">Heightmap</span>
            </h1>
            <span class="bm-kopf-luft"></span>
            <div class="bm-actions">
                <button class="btn btn-danger" id="bm-clear-btn">
                    <svg class="bm-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>
                    <span data-i18n="bedmesh_clear">Löschen</span>
                </button>
                <button class="btn" id="bm-calibrate-btn">
                    <svg class="bm-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/><circle cx="12" cy="12" r="4"/></svg>
                    <span data-i18n="bedmesh_calibrate">Kalibrieren</span>
                </button>
            </div>
        </div>

        <div class="bm-plot-card"><div id="plot"></div></div>

        <div id="bm-empty" class="bm-empty" data-i18n="bedmesh_none" style="display:none;">Kein Bed-Mesh geladen</div>

        <div class="card" id="bm-info" style="display:none;">
            <div class="section-title" data-i18n="bedmesh_current" style="margin-bottom:10px;">Aktuelles Mesh</div>
            <div class="bm-info-row"><span class="bm-label">Name</span><span class="bm-value" id="bm-name">—</span></div>
            <div class="bm-info-row"><span class="bm-label" data-i18n="bedmesh_size">Größe</span><span class="bm-value" id="bm-size">—</span></div>
            <div class="bm-info-row"><span class="bm-label" id="bm-max-label">Max</span><span class="bm-value" id="bm-max">—</span></div>
            <div class="bm-info-row"><span class="bm-label" id="bm-min-label">Min</span><span class="bm-value" id="bm-min">—</span></div>
            <div class="bm-info-row"><span class="bm-label" data-i18n="bedmesh_range">Spannweite</span><span class="bm-value" id="bm-range">—</span></div>
            <div class="bm-profiles" id="bm-profiles-wrap" style="display:none;">
                <div class="section-title" data-i18n="bedmesh_profiles" style="font-size:14px; margin:8px 0 4px;">Profile</div>
                <div id="bm-profiles"></div>
            </div>
        </div>
    </div>


    <script>
        // Mainsail's default colour scale "Portland" (blue -> light -> red, NO green).
        var PORTLAND = [
            [0.0, '#313695'], [0.1, '#4575b4'], [0.2, '#74add1'], [0.3, '#abd9e9'],
            [0.4, '#e0f3f8'], [0.5, '#ffffbf'], [0.6, '#fee090'], [0.7, '#fdae61'],
            [0.8, '#f46d43'], [0.9, '#d73027'], [1.0, '#a50026']
        ];

        // Render the 3D surface -- a port of assets/bedmesh.html renderMesh().
        function renderMesh(d) {
            var z = d.matrix;
            if (!z || !z.length || !z[0] || !z[0].length) return;
            var rows = z.length, cols = z[0].length;
            var minx = d.mesh_min[0], miny = d.mesh_min[1];
            var maxx = d.mesh_max[0], maxy = d.mesh_max[1];
            var x = [], y = [];
            for (var c = 0; c < cols; c++) x.push(minx + (maxx - minx) * c / (cols - 1));
            for (var r = 0; r < rows; r++) y.push(miny + (maxy - miny) * r / (rows - 1));

            var zmin = Infinity, zmax = -Infinity;
            for (var r2 = 0; r2 < rows; r2++) for (var c2 = 0; c2 < z[r2].length; c2++) {
                var v = z[r2][c2]; if (v < zmin) zmin = v; if (v > zmax) zmax = v;
            }

            var data = [{
                type: 'surface', x: x, y: y, z: z,
                colorscale: PORTLAND, cmin: zmin, cmax: zmax, showscale: true,
                colorbar: { thickness: 14, len: 0.85, x: 0.0, xanchor: 'left', tickfont: { color: '#ddd', size: 11 } },
                lighting: { ambient: 0.95, diffuse: 0.25, specular: 0.05 }, hidesurface: false
            }];
            var ax = {
                gridcolor: '#3a3a44', zerolinecolor: '#555', color: '#bbb',
                backgroundcolor: 'rgba(0,0,0,0)', showbackground: true, titlefont: { color: '#ccc' }
            };
            var bmin = d.bed_min, bmax = d.bed_max;
            var rxMin = (bmin ? bmin[0] : minx), rxMax = (bmax ? bmax[0] : maxx);
            var ryMin = (bmin ? bmin[1] : miny), ryMax = (bmax ? bmax[1] : maxy);
            var absX = Math.abs(rxMax - rxMin), absY = Math.abs(ryMax - ryMin);
            var minXY = Math.max(1, Math.min(absX, absY));
            var SCALE_ZMAX = 1.0;
            var layout = {
                paper_bgcolor: 'rgba(0,0,0,0)', plot_bgcolor: 'rgba(0,0,0,0)',
                margin: { l: 0, r: 0, t: 0, b: 0 }, font: { color: '#ccc' },
                scene: {
                    xaxis: Object.assign({ title: 'X', range: [rxMin, rxMax] }, ax),
                    yaxis: Object.assign({ title: 'Y', range: [ryMin, ryMax] }, ax),
                    zaxis: Object.assign({ title: 'Z', range: [-SCALE_ZMAX, SCALE_ZMAX] }, ax),
                    aspectmode: 'manual', aspectratio: { x: absX / minXY, y: absY / minXY, z: 1 },
                    // The view from the FRONT right (low Y towards the viewer) --
                    // Mainsails Default 'rightFront' (alpha 25 / beta 40). Vorher y:+1.5
                    // = a view from behind, front and back swapped against Mainsail.
                    camera: { eye: { x: 1.3, y: -1.5, z: 0.9 } }
                }
            };
            Plotly.react('plot', data, layout, { displayModeBar: false, responsive: true, scrollZoom: true });
            setTimeout(function () { try { Plotly.Plots.resize('plot'); } catch (e) {} }, 250);
        }
        window.addEventListener('resize', function () { try { Plotly.Plots.resize('plot'); } catch (e) {} });

        // Info panel (a port of BedMeshScreen.BedMeshInfo).
        function fmt(n, dp) { return (Math.round(n * Math.pow(10, dp)) / Math.pow(10, dp)).toFixed(dp); }
        function updateInfo(d) {
            var z = d.matrix || [];
            var rows = z.length, cols = (z[0] && z[0].length) || 0;
            var vMax = -Infinity, vMin = Infinity, maxR = 0, maxC = 0, minR = 0, minC = 0;
            for (var r = 0; r < rows; r++) for (var c = 0; c < (z[r] || []).length; c++) {
                var v = z[r][c]; if (v == null || isNaN(v)) continue;
                if (v > vMax) { vMax = v; maxR = r; maxC = c; }
                if (v < vMin) { vMin = v; minR = r; minC = c; }
            }
            function coordAt(rr, cc) {
                var mnx = (d.mesh_min && d.mesh_min[0]) || 0, mny = (d.mesh_min && d.mesh_min[1]) || 0;
                var mxx = (d.mesh_max && d.mesh_max[0]) || 0, mxy = (d.mesh_max && d.mesh_max[1]) || 0;
                return [cols > 1 ? mnx + (mxx - mnx) * cc / (cols - 1) : mnx,
                        rows > 1 ? mny + (mxy - mny) * rr / (rows - 1) : mny];
            }
            var mx = coordAt(maxR, maxC), mn = coordAt(minR, minC);
            var spread = (isFinite(vMax) && isFinite(vMin)) ? (vMax - vMin) : 0;
            document.getElementById('bm-name').textContent = d.profile_name || '—';
            document.getElementById('bm-size').textContent = cols + 'x' + rows;
            var maxLbl = document.getElementById('bm-max-label'), minLbl = document.getElementById('bm-min-label');
            if (isFinite(vMax)) { maxLbl.textContent = 'Max [' + fmt(mx[0], 1) + ', ' + fmt(mx[1], 1) + ']'; document.getElementById('bm-max').textContent = fmt(vMax, 3) + ' mm'; }
            if (isFinite(vMin)) { minLbl.textContent = 'Min [' + fmt(mn[0], 1) + ', ' + fmt(mn[1], 1) + ']'; document.getElementById('bm-min').textContent = fmt(vMin, 3) + ' mm'; }
            document.getElementById('bm-range').textContent = fmt(spread, 3) + ' mm';

            var wrap = document.getElementById('bm-profiles-wrap'), list = document.getElementById('bm-profiles');
            var profiles = d.profiles || [];
            if (profiles.length) {
                wrap.style.display = '';
                list.innerHTML = '';
                profiles.forEach(function (p) {
                    var el = document.createElement('div'); el.className = 'bm-profile'; el.textContent = '• ' + p;
                    list.appendChild(el);
                });
            } else { wrap.style.display = 'none'; }
        }

        // Only redraw when the mesh changed -- otherwise every 8 s poll
        // rebuilds the WebGL surface (GPU "non-existent mailbox" spam).
        // Matches Android: LaunchedEffect(meshJson) renders only on a change.
        var _bmSig = null;
        // The calibration state comes from the server (the adapter), so it
        // survives a reload or a tab change. The button is made from it on
        // every poll instead of from screen-local state.
        var bmBtn = null, bmSpan = null, bmClearBtn = null;
        var _bmTakt = null;
        function bmText(k, fb) { return (window.getText && window.getText(k, fb)) || fb; }
        function applyCalibrating(running) {
            if (!bmBtn) return;
            bmBtn.disabled = !!running;
            if (bmClearBtn) bmClearBtn.disabled = !!running;
            if (bmSpan) bmSpan.textContent = running
                ? bmText('bedmesh_calibrating', 'Kalibriere…')
                : bmText('bedmesh_calibrate', 'Kalibrieren');
        }
        // The route exists only on the direct adapter. When the page runs
        // against the server (Bambu mode) it answers 404 -- stop asking then,
        // or the 8-second beat fills the server log with REQ_FAIL.
        function meshAbfrageEinstellen() {
            if (_bmTakt) { clearInterval(_bmTakt); _bmTakt = null; }
            // Kalibrieren/Loeschen liefen in dieselbe Leere — abschalten.
            if (bmBtn) bmBtn.disabled = true;
            if (bmClearBtn) bmClearBtn.disabled = true;
            document.getElementById('bm-info').style.display = 'none';
            document.querySelector('.bm-plot-card').style.display = 'none';
            document.getElementById('bm-empty').style.display = '';
        }

        function loadMesh() {
            return fetch('/api/bedmesh', { credentials: 'same-origin' })
                .then(function (r) {
                    if (!r.ok) { meshAbfrageEinstellen(); return null; }
                    return r.json();
                })
                .then(function (d) {
                    if (!d) return;
                    applyCalibrating(d && d.calibrating);
                    var hasMesh = d && d.available && d.matrix && d.matrix.length;
                    document.getElementById('bm-info').style.display = hasMesh ? '' : 'none';
                    document.getElementById('bm-empty').style.display = hasMesh ? 'none' : '';
                    document.querySelector('.bm-plot-card').style.display = hasMesh ? '' : 'none';
                    if (!hasMesh) { _bmSig = null; return; }
                    var sig = (d.profile_name || '') + '|' + JSON.stringify(d.matrix);
                    if (sig !== _bmSig) { _bmSig = sig; renderMesh(d); }
                    updateInfo(d);
                })
                .catch(function () {});
        }

        // Messages sit top right, as on every other page.
        // A box of its own used to hang bottom centre in the picture.
        function toast(msg) {
            if (window.skToast) { window.skToast(msg); return; }
            console.log(msg);
        }

        document.addEventListener('DOMContentLoaded', function () {
            if (window.tabBarManager) window.tabBarManager.render();
            bmBtn = document.getElementById('bm-calibrate-btn');
            bmSpan = bmBtn.querySelector('[data-i18n]');
            bmClearBtn = document.getElementById('bm-clear-btn');
            bmBtn.addEventListener('click', function () {
                if (bmBtn.disabled) return;
                // Immediate feedback; the real state comes from the server flag
                // and is held by loadMesh (applyCalibrating) -- it survives a reload.
                applyCalibrating(true);
                fetch('/api/bedmesh/calibrate', { method: 'POST', credentials: 'same-origin' })
                    .then(function () {
                        // Reload briskly until the server reports "done" (4 s instead of 8 s).
                        var iv = setInterval(function () {
                            loadMesh().then(function () { if (!bmBtn.disabled) clearInterval(iv); });
                        }, 4000);
                        setTimeout(function () { clearInterval(iv); }, 21 * 60 * 1000);
                    })
                    .catch(function () { toast((window.texts || {}).set_error || 'Fehler'); applyCalibrating(false); });
            });
            document.getElementById('bm-clear-btn').addEventListener('click', function () {
                fetch('/api/bedmesh/clear', { method: 'POST', credentials: 'same-origin' })
                    .then(function () { setTimeout(loadMesh, 600); })
                    .catch(function () { toast((window.texts || {}).set_error || 'Fehler'); });
            });
            loadMesh();
            // While one is on the page, keep the mesh current (after a calibration).
            _bmTakt = setInterval(loadMesh, 8000);
        });
    </script>
    <script src="/static/js/modules/hms-severity.js"></script>
    <script src="/static/js/modules/hms-banner.js"></script>
    <script src="/static/js/modules/hms-overlay.js"></script>
    <script src="/static/js/modules/notification-stack.js"></script>
</body>
</html>
