<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Benachrichtigungen - 3D Printer Dashboard</title>

    <link rel="stylesheet" href="/static/css/shared-styles.css?v=2">
    <link rel="stylesheet" href="/static/font-awesome.min.css">
    <link rel="stylesheet" href="/static/css/design-tokens.css?v=2">
    <link rel="stylesheet" href="/static/css/base.css?v=2">
    <link rel="stylesheet" href="/static/css/tab-bar.css?v=2">
    <link rel="stylesheet" href="/static/css/benachrichtigungen.css?v=2">
    <link rel="stylesheet" href="/static/css/meldungen.css">

    <script src="/static/lang/de.js"></script>
    <script src="/static/lang/en.js"></script>
    <script src="/static/lang/fr.js"></script>
    <script src="/static/lang/es.js"></script>
    <script src="/static/lang/it.js"></script>

</head>
<body>
    <script>
        (function() {
            const theme = localStorage.getItem('theme') || 'auto';
            if (theme === 'dark' || (theme === 'auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.body.classList.add('dark-mode');
            }
        })();
    </script>

    <script src="/static/js/modules/icons.js"></script>
    <script src="/static/js/modules/theme-manager.js"></script>
    <script src="/static/js/modules/i18n-manager.js"></script>
    <script src="/static/auth-handler.js"></script>
    <script src="/static/js/modules/tab-bar-manager.js"></script>
    <script src="/static/js/modules/device-names.js"></script>
    <script src="/static/js/modules/notification-list.js"></script>
    <script src="/static/socket.io.js"></script>
    <script src="/static/js/modules/filament-state.js"></script>
    <script src="/static/js/modules/frage-karte.js"></script>

    <div class="nb-huelle">
        <div class="nb-kopf">
            <h1 class="nb-kopf-titel">
                <svg class="nb-ic nb-ic--lg" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
                <span data-i18n="nb_title">Meldungen</span>
            </h1>
            <span class="nb-kopf-luft"></span>
            <button class="nb-btn" onclick="alleGelesen()">
                <svg class="nb-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12l5 5L20 6"/></svg>
                <span data-i18n="inbox_read_all">Alle gelesen</span>
            </button>
            <button class="nb-btn" onclick="loadNotifications()">
                <svg class="nb-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
                <span data-i18n="refresh">Aktualisieren</span>
            </button>
        </div>

        <section id="fragen-huelle" class="nb-abschnitt" hidden>
            <h2 class="nb-abschnitt-titel" data-i18n="inbox_waiting">Wartet auf dich</h2>
            <div id="fragen-liste" class="fk-liste" hidden></div>
        </section>

        <h2 class="nb-abschnitt-titel" data-i18n="inbox_history">Verlauf</h2>
        <div class="nb-filter">
            <button id="filter-all" onclick="setFilter('all')">
                <span data-i18n="nb_filter_all">Alle</span> <b id="zahl-alle"></b>
            </button>
            <button id="filter-unread" class="an" onclick="setFilter('unread')">
                <span data-i18n="nb_filter_unread">Ungelesen</span> <b id="zahl-neu"></b>
            </button>
        </div>

        <div id="notif-list" class="nb-liste"></div>
    </div>

    <script>
        let allNotifications = [];
        // Unread first, as in the settings section: the full list is long.
        let currentFilter = 'unread';

        function t(key, rueckfall) {
            return window.getText(key, rueckfall);
        }

        async function loadNotifications() {
            try {
                // apiCall, not a bare fetch: only it carries the device id,
                // and "read here" is per device. With the plain fetch the
                // list was answered for a different device than the counter
                // on the tab -- the bell said 1, the list said 42 (18sep26).
                const ruf = window.apiCall
                    || ((url, opt) => fetch(url, Object.assign({ credentials: 'include' }, opt)));
                const resp = await ruf('/api/notifications/recent?limit=100');
                if (!resp.ok) {
                    document.getElementById('notif-list').innerHTML =
                        '<div class="nb-leer">' + escapeHtml(t('nb_error', 'Fehler beim Laden')) + '</div>';
                    return;
                }
                const data = await resp.json();
                allNotifications = data.notifications || [];
                render();
            } catch (e) {
                document.getElementById('notif-list').innerHTML =
                    '<div class="nb-leer">' + escapeHtml(t('nb_error', 'Fehler beim Laden')) + '</div>';
            }
        }

        function setFilter(f) {
            currentFilter = f;
            document.getElementById('filter-all').classList.toggle('an', f === 'all');
            document.getElementById('filter-unread').classList.toggle('an', f === 'unread');
            render();
        }

        function render() {
            const list = document.getElementById('notif-list');
            const ungelesen = allNotifications.filter(n => !window.notificationList.erledigt(n)).length;
            document.getElementById('zahl-alle').textContent = allNotifications.length || '';
            document.getElementById('zahl-neu').textContent = ungelesen || '';
            window.notificationList.zeichne(list, allNotifications, {
                filter: currentFilter,
                aufWeg: dismissOne,
            });
        }

        /**
         * Everything at once -- only on the button, never by itself.
         *
         * Opening the screen used to do this, and it was wrong: a message
         * that was merely displayed then read "gelesen auf MacBook Pro"
         * although nobody had dealt with it (User 17sep26). Looking at a
         * list is not answering it; the entry stays open until someone says
         * so, here or with "Weg" on the entry.
         */
        function alleGelesen() {
            const call = window.apiCall || ((url, opts) => fetch(url, {...opts, credentials: 'include'}));
            call('/api/notifications/read_all', { method: 'POST' })
                .then(() => loadNotifications())
                .then(() => n_zahl())
                .catch(() => {});
        }

        function n_zahl() {
            if (window.tabBarManager) window.tabBarManager.zaehleMeldungen();
        }

        async function dismissOne(id) {
            try {
                // apiCall sets the X-CSRF token and the cookie refresh on its own
                const call = window.apiCall || ((url, opts) => fetch(url, {...opts, credentials: 'include'}));
                await call(`/api/notifications/${encodeURIComponent(id)}/dismiss`, {
                    method: 'POST'
                });
                const n = allNotifications.find(x => x.id === id);
                if (n) {
                    n.is_handled = true;
                    n.dismissed_by = n.dismissed_by || {};
                    n.dismissed_by['_self'] = Date.now() / 1000;
                }
                render();
                n_zahl();
            } catch (e) {
                console.error('Dismiss failed', e);
            }
        }

        function escapeHtml(s) {
            if (s === undefined || s === null) return '';
            return String(s)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }
        function escapeJs(s) {
            return String(s).replace(/'/g, "\\'");
        }

        // The questions at the top: the same list, the same buttons as the
        // card in the dashboard (frage-karte.js). The status once at load,
        // after that the server pushes.
        window.FrageKarte.liste(document.getElementById('fragen-liste'), 'fragen-huelle');
        (window.apiCall ? window.apiCall('/api/status') : fetch('/api/status', { credentials: 'include' }))
            .then(r => r.json())
            .then(d => {
                if (d && d.filament_state && window.filamentState) window.filamentState.update(d.filament_state);
                window.FrageKarte.status(d);
            })
            .catch(() => {});

        // WebSocket echo: another client dismissed something
        try {
            const socket = io({ transports: ['websocket', 'polling'] });
            socket.on('filament_state', d => {
                if (window.filamentState) window.filamentState.update(d);
                window.FrageKarte.zustand(d);
                n_zahl();
            });
            socket.on('prompts_later', d => window.FrageKarte.spaeterListe(d && d.ids));
            socket.on('print_mismatch', d => window.FrageKarte.mismatch(d && d.mismatch));
            // A new message: fetch the list instead of polling for it.
            socket.on('notification', () => { loadNotifications(); n_zahl(); });
            socket.on('notification_dismissed', data => {
                n_zahl();
                if (!data || !data.id) return;
                const n = allNotifications.find(x => x.id === data.id);
                if (n) {
                    n.dismissed_by = n.dismissed_by || {};
                    n.dismissed_by[data.device_id || '_other'] = Date.now() / 1000;
                    render();
                }
            });
            socket.on('notification_read', data => {
                n_zahl();
                // Another device read everything at once: no single id to patch.
                if (data && data.all) { loadNotifications(); return; }
                if (!data || !data.id) return;
                const n = allNotifications.find(x => x.id === data.id);
                if (n) {
                    n.read_by = n.read_by || {};
                    n.read_by[data.device_id || '_other'] = Date.now() / 1000;
                    render();
                }
            });
        } catch (_) {}

        if (window.tabBarManager) window.tabBarManager.render();
        loadNotifications();
    </script>
    <script src="/static/js/modules/hms-severity.js"></script>
    <script src="/static/js/modules/hms-banner.js"></script>
    <script src="/static/js/modules/hms-overlay.js"></script>
    <script src="/static/js/modules/notification-stack.js"></script>
</body>
</html>
