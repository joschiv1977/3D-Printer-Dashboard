    <!-- Drucker-Meldungen  (Umbau 21aug26)
         ------------------------------------------------------------------
         Vorher sechs verschiedene Balken, die sich oben quer ueber die Seite
         legten und den Inhalt nach unten schoben - beim Oeffnen wie beim
         Schliessen, mitten im Lesen. Jetzt ein Stapel oben rechts in der
         Form der uebrigen Meldungen (skToast).

         Zwei Sorten, und der Unterschied ist wichtig:
           .mld            Meldung  - bleibt stehen, bis sie weggeklickt wird.
                                      Kein Ablaufen, kein Balken.
           .mld--zustand   Zustand  - beschreibt, was der Drucker gerade TUT
                                      (Trocknung laeuft, Auto-Aus zaehlt).
                                      Kein Kreuz: wegklicken waere falsch,
                                      der Zustand liefe ja weiter. Statt-
                                      dessen ein mitlaufender Punkt; die
                                      Meldung geht von selbst, wenn der
                                      Zustand endet.

         Die IDs sind unveraendert - jedes Modul schaltet weiter ueber
         classList.add('active'), die Stapel-Logik haengt in
         meldungs-stapel.js und fasst nur diesen Container an. -->
    <div id="meldungs-stapel" class="mld-stapel">

        <!-- Filament-Trocknung: Zustand -->
        <div id="filament-drying-banner" class="mld mld--laeuft mld--zustand">
            <span class="mld-ic">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 14.8V5a2 2 0 1 0-4 0v9.8a4.5 4.5 0 1 0 4 0z"/></svg>
            </span>
            <div class="mld-t">
                <div class="mld-titel" id="filament-drying-title" data-i18n="filament_drying_banner_title">Filament-Trocknung aktiv</div>
                <div class="mld-detail" id="filament-drying-details" data-i18n="filament_drying_banner_fallback">Heatbed bei --°C • Drucker-Steuerung blockiert</div>
            </div>
            <span class="mld-puls" aria-hidden="true"></span>
        </div>

        <!-- Die HMS-Meldung baut hms-banner.js selbst ein — sie wird auf
             JEDER Seite gebraucht, nicht nur hier, und darf deshalb nicht an
             dieser Vorlage haengen. Sie landet in diesem Stapel, sobald sie
             etwas zu sagen hat; meldungs-stapel.js sortiert sie nach vorn. -->

        <!-- Auto-Aus-Timer: Zustand, zaehlt runter -->
        <div id="power-off-banner" class="mld mld--warnung mld--zustand">
            <span class="mld-ic">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
            </span>
            <div class="mld-t">
                <div class="mld-titel" id="power-off-banner-title">Auto Power-Off in <span id="power-off-banner-countdown">--:--</span></div>
                <div class="mld-detail" id="power-off-banner-reason">--</div>
                <div class="mld-akt">
                    <button onclick="cancelPowerOffTimerFromBanner()" class="power-off-cancel-btn"
                            data-i18n="cancel">Abbrechen</button>
                </div>
            </div>
            <span class="mld-puls" aria-hidden="true"></span>
        </div>

        <!-- Thermische Vorkonditionierung (Bambu, Stufe 58). Der Drucker
             heizt die Kammer durch, bevor die erste Schicht liegt — bei ASA
             gemessene zehn Minuten (Druck 1319, 27aug26: stg_cd startete bei
             599 s und zaehlte sauber auf 0 herunter, exakt bis zum
             Stufenwechsel). Ohne Anzeige sieht man nur "0 %" und wartet.
             Zustandsbanner wie der Auto-Aus-Countdown, nicht wie eine
             fluechtige Meldung: zehn Minuten sind zu lang zum Wegblenden.
             Wegklicken gilt fuer DIESEN Druck. -->
        <!-- Bewusst OHNE mld--zustand: die Klasse blendet das Kreuz aus
             (.mld--zustand .mld-zu { display:none }), und dieses Banner
             SOLL wegklickbar sein. -->
        <div id="precondition-banner" class="mld mld--info">
            <span class="mld-ic">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
            </span>
            <div class="mld-t">
                <div class="mld-titel" id="precondition-banner-title" data-i18n="precondition_title">Thermische Vorkonditionierung</div>
                <div class="mld-detail"><span data-i18n="precondition_detail">Optimiert die erste Schicht</span> · <span id="precondition-banner-countdown">--:--</span></div>
            </div>
            <button class="mld-zu" onclick="window.vorkonditionierung && window.vorkonditionierung.wegklicken()" aria-label="Ausblenden">&times;</button>
        </div>

        <!-- Power-Loss-Recovery — nur Klipper-Direct: der Companion hat den
             byte-genauen Wiederaufnahme-Punkt mitgeschrieben. Erscheint erst,
             wenn Klipper wieder steht und nichts druckt. Kein Kreuz: eine der
             beiden Antworten muss kommen. -->
        <div id="recovery-banner" class="mld mld--warnung mld--entscheidung" data-klipper-only>
            <span class="mld-ic">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2L4 14h6l-1 8 9-12h-6z"/></svg>
            </span>
            <div class="mld-t">
                <div class="mld-titel" id="recovery-banner-title" data-i18n="recovery_banner_title">Druck wurde unterbrochen</div>
                <div class="mld-detail" id="recovery-banner-message">--</div>
                <div class="mld-akt">
                    <button class="mld-haupt recovery-resume-btn" onclick="resumeInterruptedPrint()"
                            data-i18n="recovery_banner_resume">Fortsetzen</button>
                    <button class="recovery-dismiss-btn" onclick="dismissRecoveryBanner()"
                            data-i18n="recovery_banner_discard">Verwerfen</button>
                </div>
            </div>
        </div>

        <!-- Filament-Menge — nur Klipper-Direct. Rein informativ: der Companion
             vergleicht das im Gcode hinterlegte Gewicht mit der Restmenge der
             aktiven Spoolman-Rolle. Greift vor allem bei Drucken direkt aus dem
             Slicer — dort gibt es keinen Vorab-Check, die Datei ist erst
             sichtbar wenn sie schon laeuft. Kein Eingriff, kein Abbruch. -->
        <div id="filament-amount-banner" class="mld mld--warnung" data-klipper-only>
            <span class="mld-ic">
                <svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v12c0 1.7 3.1 3 7 3s7-1.3 7-3V6"/></svg>
            </span>
            <div class="mld-t">
                <div class="mld-titel" id="filament-amount-title" data-i18n="filament_amount_short_title">Filament reicht vermutlich nicht</div>
                <div class="mld-detail" id="filament-amount-message">--</div>
            </div>
            <button class="mld-zu filament-amount-dismiss-btn" onclick="dismissFilamentAmountBanner()"
                    data-i18n-title="filament_amount_dismiss" title="Schließen">&times;</button>
        </div>

        <!-- Wartung faellig -->
        <div id="maintenance-banner" class="mld mld--warnung">
            <span class="mld-ic">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.7 6.3a4.5 4.5 0 0 0 6 6l-8.4 8.4a2.1 2.1 0 0 1-3 0l-3-3a2.1 2.1 0 0 1 0-3z"/><path d="M14.7 6.3 18 3"/></svg>
            </span>
            <div class="mld-t">
                <div class="mld-titel" id="maintenance-banner-title" data-i18n="maintenance_banner_due_today">Wartung heute fällig</div>
                <div class="mld-detail" id="maintenance-banner-message">--</div>
                <div class="mld-akt">
                    <a href="/static/maintenance.html" class="mld-haupt maintenance-view-btn"
                       data-i18n="maintenance_banner_view">Anzeigen</a>
                </div>
            </div>
            <button class="mld-zu maintenance-dismiss-btn" onclick="dismissMaintenanceBanner()"
                    data-i18n-title="maintenance_banner_dismiss" title="Schließen">&times;</button>
        </div>
    </div>
