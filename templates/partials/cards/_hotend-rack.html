          <!-- Hotend-Magazin (H2C). Bleibt versteckt, bis der Drucker
               wirklich Magazinplaetze meldet — nie am Modellnamen
               festgemacht (services/printer_capabilities.py:
               has_hotend_rack kommt vom Geraet, hotend_rack_slots aus dem
               Datenblatt).

               Bewusst OHNE "links fest / rechts Magazin": Bambu Studio sagt
               nur, dass Extruder 2 die Wechsel-Hotends nimmt
               (extruder_max_nozzle_count ['1','6']). Welcher Duesen-Index
               des MQTT-Blocks das ist (0 = rechts, 1 = links), steht in
               keiner Quelle, die wir haben — die Seite wuerde also geraten.
               Was belegt ist: welcher Platz aufgesetzt ist (tar_id). -->
          <div class="grid-stack-item" gs-w="4" gs-h="21" gs-x="8" gs-y="40" gs-min-w="3" gs-min-h="15" gs-max-w="8" gs-max-h="24" id="hotend-rack-card-grid" style="display: none;">
              <div class="grid-stack-item-content">
                  <div class="card" id="hotend-rack-card">
                      <div class="card-header">
                          <h3 class="card-title">
                              <svg class="hd-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
                              <span id="hr-title"></span>
                          </h3>
                          <span class="hr-zaehler" id="hr-belegt"></span>
                      </div>

                      <div class="hr-koerper">
                          <!-- Was gerade auf dem Druckkopf sitzt. -->
                          <div class="hr-duese" id="hr-aufgesetzt">
                              <span class="hr-wo" id="hr-auf-wo"></span>
                              <span class="hr-was" id="hr-auf-was">–</span>
                              <span class="hr-zu" id="hr-auf-zu"></span>
                          </div>

                          <!-- Laufender Wechsel. Ohne Fortschrittsbalken: der
                               Drucker meldet Zustand und Ziel, keinen
                               Prozentwert. -->
                          <div class="hr-wechsel" id="hr-wechsel" style="display:none;">
                              <svg class="hd-ic hd-ic--xs" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h13m-4-5 5 5-5 5"/></svg>
                              <span class="hr-wechsel-txt">
                                  <b id="hr-wechsel-titel"></b>
                                  <small id="hr-wechsel-detail"></small>
                              </span>
                          </div>

                          <!-- Die sechs Plaetze. Leere bleiben stehen, damit
                               das Raster lesbar bleibt. -->
                          <div class="hr-plaetze" id="hr-plaetze"></div>
                      </div>
                  </div>
              </div>
          </div>
