          <div class="grid-stack-item bambu-only" gs-w="5" gs-h="6" gs-x="7" gs-y="10" gs-min-w="3" gs-min-h="4" gs-max-w="8" gs-max-h="20" id="material-zone-card-grid">

                  <div class="card">
                      <div class="card-header">
                          <h3 class="card-title"><svg class="hd-ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/></svg> <span id="mz-mat-title">Material</span></h3>

                      <div id="mz-ams-list"><!--AMS units (JS)--></div>
                      <div class="mz-sec" id="mz-spools-title" style="display:none;">Externe Spulen</div>
                      <div class="mz-spool-row" id="mz-spools"><!--external spools (JS)--></div>

                      <!--Spoolman now lives here: the logic (spoolman-manager)
                          is unchanged.-->
                      <div class="mz-sec" style="margin-top:12px;">
                          <a href="#" onclick="openSpoolmanWeb(); return false;" id="spoolman-title" style="color:inherit; text-decoration:none; cursor:pointer;">Spoolman</a>
                          <span class="spoolman-status" id="spoolman-connection" style="width:8px;height:8px;border-radius:50%;display:inline-block;">●</span>
                      </div>
                      <div id="spoolman-content" style="display:none;">
                          <!--Selection now happens in its own window: there each
                              spool shows color and remaining amount as a wheel,
                              and the ones matching the file are listed first. The
                              list stays hidden in the DOM -- several
                              places still read it (schedule, SD card).-->
                          <button type="button" class="mz-spulknopf" onclick="window.openSpoolPicker()">
                              <span id="mz-spulknopf-punkt" class="mz-spulknopf__punkt"></span>
                              <span id="mz-spulknopf-text" data-i18n="spool_choose">Spule wählen</span>

                          </button>
                          <select id="spool-selector" onchange="activateSpool(this.value)" style="display:none;">
                              <option value="" id="spool-select-option"></option>
                          </select>
                          <div id="active-spool-info" style="margin-top:9px; padding:9px 10px;
                                                             background:var(--bg-secondary);
                                                             border-radius:8px; display:none;">
                              <div style="display:flex; align-items:center; gap:10px;">
                                  <div id="spool-color-dot" style="width:18px; height:18px; border-radius:50%; flex-shrink:0;"></div>
                                  <div style="flex:1; min-width:0;">
                                      <div id="spool-name" style="font-weight:600; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;"></div>
                                      <div id="spool-details" style="font-size:11px; color:var(--text-secondary);"></div>
                                  </div>
                                  <div style="text-align:right;">
                                      <div id="spool-weight" style="font-size:13.5px; font-weight:600; color:var(--accent-green);"></div>
                                      <div id="spool-percent" style="font-size:11px; color:var(--text-secondary);"></div>
                                  </div>
                              </div>
                          </div>
                      </div>
                      <div class="mz-active" id="mz-active-spool" style="display:none;"></div>
                  </div>
