          <!-- Camera Card -->
          <div class="grid-stack-item" gs-w="5" gs-h="14" gs-x="0" gs-y="0" gs-min-w="3" gs-min-h="4" gs-max-w="12" gs-max-h="30" id="camera-card-grid">
              <div class="grid-stack-item-content">
                  <div class="card" id="camera-card">
                      <div class="card-header">
                          <h3 class="card-title">
                              <svg class="hd-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m22 8-6 4 6 4V8Z"/><rect x="2" y="6" width="14" height="12" rx="2"/></svg>
                              <span id="live-camera-title"></span>
                          </h3>
                          <span class="card-action" id="camera-source-toggle-btn" onclick="toggleCameraSource()" style="display: none;">
                              <span id="camera-source-text"></span>
                              <span>›</span>
                          </span>
                      </div>
                      <div class="camera-container">
                          <div id="camera-placeholder" style="display: flex; align-items: center; justify-content: center; color: #666;">
                              <svg class="hd-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m23 7-7 5 7 5z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg> <span id="camera-loading-text"></span>
                          </div>
                          <img id="camera-stream"
                               class="camera-stream"
                               data-src="/api/camera"
                               alt="Kamera Stream"
                               loading="eager"
                               fetchpriority="high"
                               onerror="handleCameraError()"
                               style="transition: transform 0.3s ease; transform-origin: center; display: none;"
                               onload="document.getElementById('camera-placeholder').style.display='none'; this.style.display='block';">
                          <div id="camera-loading-overlay" style="display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); align-items: center; justify-content: center; z-index: 5;">
                              <div class="loading" style="width: 40px; height: 40px; border-width: 4px;"></div>
                          </div>
                          <!--Light deliberately on the LEFT and separate from the group
                               on the right: that group controls the stream (pause,
                               PiP, fullscreen, quality), while the light controls
                               real hardware on the printer.-->
                          <div class="camera-light">
                              <button class="control-btn" id="light-btn" onclick="toggleLight()" style="visibility: hidden;">
                                  <svg class="hd-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7V18h8v-3.3A7 7 0 0 0 12 2z"/></svg>
                                  <span id="light-text-desktop"></span>
                              </button>
                          </div>
                          <div class="camera-overlay">
                              <button class="overlay-btn" id="camera-playpause-btn" onclick="toggleCameraPlayPause()">
                                  <span id="camera-playpause-icon"><svg class="hd-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5v14M15 5v14"/></svg></span>
                                  <span id="camera-playpause-text" data-i18n="camera_pause">Pause</span>
                              </button>
                              <button class="overlay-btn" onclick="togglePiP()">
                                  <svg class="hd-ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"/><rect x="12" y="12" width="8" height="6" rx="1"/></svg>
                                  <span>PiP</span>
                              </button>
                              <button class="overlay-btn" onclick="toggleFullscreen()">
                                  <svg class="hd-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
                                  <span id="fullscreen-text"></span>
                              </button>
                              <button class="overlay-btn hide-in-direct" id="hq-button" onclick="toggleHQMode()">
                                  <svg class="hd-ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
                                  <span id="hq-text">SD</span>
                              </button>
                          </div>
                          <div id="desktop-zoom-controls" style="position:absolute; bottom:10px; left:10px; display:flex; gap:8px;">
                              <button onclick="desktopZoomOut()" class="overlay-btn" style="width:40px; padding:8px;">−</button>
                              <button onclick="desktopZoomReset()" class="overlay-btn" style="padding:8px 12px;" id="zoom-reset-text"></button>
                              <button onclick="desktopZoomIn()" class="overlay-btn" style="width:40px; padding:8px;">+</button>
                          </div>
                      </div>
                  </div>
              </div>
          </div>
