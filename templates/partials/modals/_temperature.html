    <!-- Temperature Control Modal -->
    <div id="tempModal" class="modal-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:1002;">
        <div class="modal-panel sd-modal-panel" style="max-width:{{ '760px' if active_printer_type == 'bambu' else '440px' }};">
            <div class="sd-modal-header">
                <h2 class="sd-modal-title"><svg class="hd-ic hd-ic--lg" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 14.76V5a2 2 0 1 0-4 0v9.76a4.5 4.5 0 1 0 4 0z"/></svg> <span id="temp-modal-title">Temperaturen</span></h2>
                <div class="sd-header-actions">
{% if active_printer_type == 'bambu' %}
                    <!--Shortcut to load and unload. It sits in the header and
                         not next to a nozzle: there it would only be visible
                         after clicking left or right, and anyone wanting to
                         load does not want to expand a side first. Just a
                         link -- the buttons themselves stay in the
                         control's filament tab, one place with one set
                         of rules.-->
                    <button class="sd-kopf-knopf" id="temp-filament-btn"
                            onclick="closeTempModal(); openPrinterControl('filament');">
                        <svg class="hd-ic hd-ic--xs" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12"/><path d="M8 11l4 4 4-4"/><path d="M4 21h16"/></svg>
                        <span id="temp-filament-label">Laden/Entladen</span>
                    </button>
{% endif %}
                    <button class="sd-close-btn" onclick="closeTempModal()">&times;</button>
                </div>
            </div>
            <div class="sd-modal-body">
{% if active_printer_type == 'bambu' %}
                <!--============ Display style (Bambu), same as the fan window:
                     machine centered, temperature zones around the outside with
                     leader lines. Clicking a zone expands the stepper + presets,
                     values go out IMMEDIATELY -- no apply button. JS builds the
                     content (temperature-modal.js). ============-->
                <div id="dt-stage"></div>
{% else %}
                <!-- Nozzle Temperature -->
                <div class="temp-zone" id="temp-zone-nozzle">
                    <div class="temp-zone-header">
                        <span class="temp-zone-title"><svg class="hd-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3h8l-1 6 3 4v3H6v-3l3-4z"/><path d="M12 16v5"/></svg> <span id="temp-nozzle-label">Düse</span></span>
                        <span class="temp-zone-current"><span id="temp-nozzle-current-label">Aktuell</span>: <span id="temp-nozzle-current">--</span>°C</span>
                    </div>
                    <div class="temp-slider-row">
                        <input type="range" id="temp-nozzle-slider" class="temp-slider" min="0" max="300" value="0" step="5"
                               oninput="updateTempDisplay('nozzle', this.value)">
                        <div class="temp-input-wrap">
                            <input type="number" id="temp-nozzle-input" class="temp-input" min="0" max="300" value="0"
                                   oninput="document.getElementById('temp-nozzle-slider').value = this.value">
                            <span class="temp-unit">°C</span>
                        </div>
                    </div>
                    <div class="temp-presets">
                        <button class="temp-preset-btn" onclick="setTempPreset('nozzle', 0)" id="temp-off-btn-nozzle">Aus</button>
                        <button class="temp-preset-btn" onclick="setTempPreset('nozzle', 200)">PLA</button>
                        <button class="temp-preset-btn" onclick="setTempPreset('nozzle', 230)">PETG</button>
                        <button class="temp-preset-btn" onclick="setTempPreset('nozzle', 250)">ASA</button>
                        <button class="temp-preset-btn" onclick="setTempPreset('nozzle', 260)">ABS</button>
                    </div>
                </div>

                <!--Second nozzle (dual nozzle only). Shows both sides;
                     the ACTIVE one is set above -- M104 does not support side selection.-->
                <div class="temp-zone" id="temp-zone-nozzles" style="display:none;">
                    <div class="temp-zone-header">
                        <span class="temp-zone-title"><svg class="hd-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 3h6l-1 5 2 3v3H3v-3l2-3z"/><path d="M14 3h6l-1 5 2 3v3h-8v-3l2-3z"/><path d="M7 17v4M17 17v4"/></svg> <span id="temp-nozzles-label">Düsen</span></span>
                    </div>
                    <div class="temp-zone-header">
                        <span class="temp-zone-current"><span id="temp-nozzle-left-label">Links</span>:
                            <span id="temp-nozzle-left">--</span> / <span id="temp-nozzle-left-target">--</span>°C</span>
                        <span class="temp-zone-current"><span id="temp-nozzle-right-label">Rechts</span>:
                            <span id="temp-nozzle-right">--</span> / <span id="temp-nozzle-right-target">--</span>°C</span>
                    </div>
                    <div class="temp-zone-header">
                        <span class="temp-zone-current" id="temp-nozzle-active-hint"></span>
                    </div>
                </div>

                <!-- Bed Temperature -->
                <div class="temp-zone" id="temp-zone-bed">
                    <div class="temp-zone-header">
                        <span class="temp-zone-title"><svg class="hd-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 17h20M4 17V9a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v8M4 17v3M20 17v3"/></svg> <span id="temp-bed-label">Bett</span></span>
                        <span class="temp-zone-current"><span id="temp-bed-current-label">Aktuell</span>: <span id="temp-bed-current">--</span>°C</span>
                    </div>
                    <div class="temp-slider-row">
                        <input type="range" id="temp-bed-slider" class="temp-slider" min="0" max="120" value="0" step="5"
                               oninput="updateTempDisplay('bed', this.value)">
                        <div class="temp-input-wrap">
                            <input type="number" id="temp-bed-input" class="temp-input" min="0" max="120" value="0"
                                   oninput="document.getElementById('temp-bed-slider').value = this.value">
                            <span class="temp-unit">°C</span>
                        </div>
                    </div>
                    <div class="temp-presets">
                        <button class="temp-preset-btn" onclick="setTempPreset('bed', 0)" id="temp-off-btn-bed">Aus</button>
                        <button class="temp-preset-btn" onclick="setTempPreset('bed', 60)">PLA</button>
                        <button class="temp-preset-btn" onclick="setTempPreset('bed', 80)">PETG</button>
                        <button class="temp-preset-btn" onclick="setTempPreset('bed', 100)">ASA</button>
                        <button class="temp-preset-btn" onclick="setTempPreset('bed', 100)">ABS</button>
                    </div>
                </div>

                <!--Chamber (only with a heated chamber)-->
                <div class="temp-zone" id="temp-zone-chamber" style="display:none;">
                    <div class="temp-zone-header">
                        <span class="temp-zone-title"><svg class="hd-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9.5"/></svg> <span id="temp-chamber-label">Kammer</span></span>
                        <span class="temp-zone-current"><span id="temp-chamber-current-label">Aktuell</span>: <span id="temp-chamber-current">--</span>°C</span>
                    </div>
                    <div class="temp-slider-row">
                        <input type="range" id="temp-chamber-slider" class="temp-slider" min="0" max="60" value="0" step="5"
                               oninput="updateTempDisplay('chamber', this.value)">
                        <div class="temp-input-wrap">
                            <input type="number" id="temp-chamber-input" class="temp-input" min="0" max="60" value="0"
                                   oninput="document.getElementById('temp-chamber-slider').value = this.value">
                            <span class="temp-unit">°C</span>
                        </div>
                    </div>
                    <div class="temp-presets">
                        <button class="temp-preset-btn" onclick="setTempPreset('chamber', 0)" id="temp-off-btn-chamber">Aus</button>
                        <button class="temp-preset-btn" onclick="setTempPreset('chamber', 40)">ASA</button>
                        <button class="temp-preset-btn" onclick="setTempPreset('chamber', 50)">ABS</button>
                        <button class="temp-preset-btn" onclick="setTempPreset('chamber', 60)">PC</button>
                    </div>
                </div>

                <!--Action Buttons (Klipper: apply model)-->
                <div class="temp-actions">
                    <button class="temp-btn temp-btn--cancel" onclick="closeTempModal()">
                        <span id="temp-cancel-btn">Abbrechen</span>
                    </button>
                    <button class="temp-btn temp-btn--apply" onclick="applyTemperatures()">
                        <span id="temp-apply-btn">Anwenden</span>
                    </button>
                </div>
{% endif %}
            </div>
        </div>
    </div>
