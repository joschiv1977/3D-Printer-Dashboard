    <!--Chart Modal (stacked mini charts)-->
    <div id="chartModal" class="modal-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:1000;">
        <div class="modal-panel" style="position:absolute; width:92%; max-width:1000px; max-height:85vh; top:50%; left:50%; transform:translate(-50%, -50%); border-radius:12px; padding:20px; overflow-y:auto;">
            <button class="modal-close-btn" onclick="closeChartModal()">×</button>
            <h3 style="margin-bottom:12px; color:var(--text-primary);"><svg class="hd-ic hd-ic--lg" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-7"/></svg> <span id="chartTitle"></span></h3>
            <div id="chartStats" style="display:flex; gap:20px; margin-bottom:15px; font-size:14px; color:var(--text-secondary);">
                <span id="statMin">Min: --</span>
                <span id="statMax">Max: --</span>
                <span id="statAvg">Ø: --</span>
            </div>
            <!--Single sensor chart (for individual click)-->
            <canvas id="sensorChart" style="display:none;"></canvas>
            <!--Stacked mini-charts container.
                One card per group in the style of the home page; the legend
                sits as a row of chips above it and carries the current value.
                Clicking a chip hides that curve.-->
            <div id="stackedChartsContainer" style="display:none;">
                <div class="vl-zeitwahl" id="vl-zeitwahl">
                    <button data-minuten="10" data-i18n="chart_10min">10 min</button>
                    <button data-minuten="30" data-i18n="chart_30min">30 min</button>
                    <button data-minuten="60" class="an" data-i18n="chart_1h">1 Std</button>
                </div>

                <div class="vl-karte" id="chart-section-temp">
                    <div class="vl-karte-kopf"><h4 data-i18n="chart_temperatures">Temperaturen</h4></div>
                    <div class="vl-chips" id="vl-chips-temp"></div>
                    <div class="vl-leinwand"><canvas id="chartTemp"></canvas></div>
                </div>

                <div class="vl-karte" id="chart-section-fans">
                    <div class="vl-karte-kopf"><h4 data-i18n="chart_fans">Lüfter</h4></div>
                    <div class="vl-chips" id="vl-chips-fans"></div>
                    <div class="vl-leinwand vl-leinwand--klein"><canvas id="chartFans"></canvas></div>
                </div>

                <div class="vl-karte" id="chart-section-power">
                    <div class="vl-karte-kopf"><h4 data-i18n="chart_power">Leistung</h4></div>
                    <div class="vl-chips" id="vl-chips-power"></div>
                    <div class="vl-leinwand vl-leinwand--klein"><canvas id="chartPower"></canvas></div>
                    <!--The curve shows minutes, this shows the baseline: what the
                        printer draws outside of printing, averaged over weeks.
                        Stays empty until something has been recorded.-->
                    <div class="vl-ruhe" id="vl-ruhe" style="display:none;"></div>
                </div>
            </div>
        </div>
    </div>
