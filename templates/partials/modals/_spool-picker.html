    <!-- Spulenauswahl: eigenes Fenster statt der Auswahlliste in der
         Material-Karte. Jede Spule zeigt Farbe und Restmenge als Rad; die
         zur gewaehlten Datei passenden stehen oben und tragen ein Abzeichen. -->
    <div id="spoolPickerModal" class="modal-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:1006;">
        <div class="modal-panel spw-panel">

            <div class="spw-kopf">
                <h2 class="spw-titel">
                    <svg class="hd-ic hd-ic--lg" viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v12c0 1.7 3.1 3 7 3s7-1.3 7-3V6"/></svg>
                    <span id="spw-titel-text" data-i18n="spool_picker_title">Spule wählen</span>
                </h2>
                <button class="sd-close-btn" onclick="window.spoolPicker.schliesse()">&times;</button>
            </div>

            <div class="spw-werkzeuge">
                <label class="spw-suche">
                    <svg class="hd-ic hd-ic--xs" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
                    <input type="search" id="spw-suche" data-i18n-placeholder="spool_search" placeholder="Spule suchen">
                </label>
                <div id="spw-chips" class="spw-chips"></div>
                <select id="spw-sortierung" class="spw-sortierung">
                    <option value="zuletzt" data-i18n="spool_sort_last">Zuletzt benutzt</option>
                    <option value="rest" data-i18n="spool_sort_rest">Restmenge</option>
                    <option value="name" data-i18n="sort_by_name">Name</option>
                    <option value="material" data-i18n="spool_sort_material">Material</option>
                </select>
            </div>

            <div id="spw-band"></div>

            <div id="spw-raster" class="spw-raster"></div>

            <div class="spw-fussleiste">
                <button class="modal-btn" onclick="window.spoolPicker.schliesse()" data-i18n="cancel">Abbrechen</button>
                <button class="modal-btn modal-btn--gruen" id="spw-uebernehmen"
                        onclick="window.spoolPicker.uebernehmen()" data-i18n="apply">Übernehmen</button>
            </div>

        </div>
    </div>
