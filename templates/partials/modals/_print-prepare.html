    <!--Print preparation -- one sheet before starting, like on the printer's display.
        Preview, plate, filament per nozzle and all options in ONE place.

        Built the same way as the schedule dialog: the same card shape
        (ui-karte), so not every dialog carries its own construction.-->
    <div id="printPrepareModal" class="modal-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:1004;">
        <div class="modal-panel" style="position:absolute; width:92%; max-width:620px; top:50%; left:50%; transform:translate(-50%, -50%); border-radius:12px; max-height:88vh; overflow-y:auto; padding:0;">

            <div class="sd-modal-header">
                <h2 class="sd-modal-title">
                    <svg class="hd-ic hd-ic--lg" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9V3h12v6"/><path d="M6 18H4a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-2"/><path d="M6 14h12v7H6z"/></svg>
                    <span id="prep-title"></span>
                </h2>
            </div>

            <div id="prep-loading" style="text-align:center; padding:40px;">
                <div class="loading"></div>
            </div>

            <div id="prep-body" class="ui-koerper" style="display:none; padding:16px 20px 20px;">

                <!--File: preview, name, key data-->
                <div class="ui-karte">
                    <div class="prep-datei">
                        <img loading="lazy" decoding="async" id="prep-thumb" alt="" class="prep-datei__bild">
                        <div class="prep-datei__text">
                            <div id="prep-filename" class="prep-datei__name"></div>
                            <div id="prep-facts" class="prep-facts"></div>
                        </div>
                    </div>
                </div>

                <!--Plate (only when there are several)-->
                <div class="ui-karte" id="prep-plates-block" style="display:none;">
                    <div class="ui-karte-kopf">
                        <svg class="hd-ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="18" height="11" rx="2"/><path d="M3 12h18"/></svg>
                        <span id="prep-plates-title"></span>
                    </div>
                    <div id="prep-plates" class="prep-plates"></div>
                </div>

                <!--Filament per nozzle-->
                <div class="ui-karte" id="prep-filament-block" style="display:none;">
                    <div class="ui-karte-kopf">
                        <svg class="hd-ic" viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v12c0 1.7 3.1 3 7 3s7-1.3 7-3V6"/></svg>
                        <span id="prep-filament-title"></span>
                    </div>
                    <div id="prep-filaments"></div>
                </div>

                <!--Options-->
                <div class="ui-karte prep-wide">
                    <div class="ui-karte-kopf">
                        <svg class="hd-ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>
                        <span id="prep-options-title"></span>
                    </div>
                    <div id="prep-options"></div>
                </div>
            </div>

            <div class="ui-fuss" id="prep-fuss" style="display:none;">
                <button class="modal-btn modal-btn-cancel" onclick="closePrintPrepare()" id="prep-cancel"></button>
                <button class="modal-btn modal-btn-success" onclick="confirmPrintPrepare()" id="prep-start"></button>
            </div>
        </div>
    </div>
