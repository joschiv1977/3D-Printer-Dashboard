    <!--Schedule Print Modal
        Four identically built cards (file, schedule, material, print
        options). The file's key data lives only in the file card.
        The list of scheduled prints has moved out -- it has its own screen.-->
    <div id="schedulePrintModal" class="modal-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:1005;">
        <div class="modal-panel sd-modal-panel" style="max-width:660px;">
            <div class="sd-modal-header">
                <h2 class="sd-modal-title"><svg class="hd-ic hd-ic--lg" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg> <span id="schedule-print-title"></span></h2>
                <div class="sd-header-actions">
                    <button class="sd-close-btn" onclick="closeScheduleModal()">&times;</button>
                </div>
            </div>

            <div class="sd-modal-body ui-koerper">

                <!--1. File: preview, name, key data. Only here.-->
                <div class="ui-karte" id="schedule-datei-karte">
                    <!--Fallback for Klipper-Direct: print preparation does not run
                         there, so without this row there would be neither
                         preview nor filename.-->
                    <div id="schedule-filename" class="prep-datei__name"></div>
                    <div id="schedule-datei"></div>
                </div>

                <!--2. Schedule: start time, power-on, pre-drying.
                     All three answer the same question -- when does what happen.-->
                <div class="ui-karte">
                    <div class="ui-karte-kopf">
                        <svg class="hd-ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
                        <span id="schedule-start-time"></span>
                    </div>

                    <div class="ui-zeile">
                        <span class="ui-zeile-name" id="schedule-startet-label"></span>
                        <input type="date" id="schedule-date" class="sched-form-input">
                        <input type="time" id="schedule-time" class="sched-form-input">
                    </div>

                    <label class="ui-zeile ui-zeile--klick">
                        <span class="ui-zeile-name">
                            <svg class="hd-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M18.4 5.6a9 9 0 1 1-12.8 0M12 3v9"/></svg>
                            <span id="schedule-auto-power-label"></span>
                        </span>
                        <span class="ui-schalter">
                            <input type="checkbox" id="schedule-auto-power" checked><span></span>
                        </span>
                    </label>

                    <!--Dry filament before printing. Only visible when a
                         drying-capable AMS is reported (AMS 2 Pro /
                         AMS HT); print-scheduler.js shows it.-->
                    <label class="ui-zeile ui-zeile--klick" id="schedule-dry-check" style="display:none;">
                        <span class="ui-zeile-name">
                            <svg class="hd-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 14.8V5a2 2 0 1 0-4 0v9.8a4.5 4.5 0 1 0 4 0z"/></svg>
                            <span id="schedule-dry-label"></span>
                        </span>
                        <span class="ui-schalter">
                            <input type="checkbox" id="schedule-dry-enabled"><span></span>
                        </span>
                    </label>

                    <div id="schedule-dry-felder" style="display:none;">
                        <div class="sp-dry-zeile">
                            <select id="schedule-dry-filament" class="sd-spool-select"></select>
                            <span class="sched-dry-feld">
                                <input type="number" id="schedule-dry-temp" min="35" max="85">
                                <span class="sched-dry-einheit">°C</span>
                            </span>
                            <span class="sched-dry-feld">
                                <input type="number" id="schedule-dry-std" min="1" max="48" step="0.5">
                                <span class="sched-dry-einheit">h</span>
                            </span>
                        </div>
                        <!--Timeline instead of a note: you can see that three
                             things happen in sequence, and when the printer
                             switches on for it.-->
                        <div class="sp-strahl" id="schedule-dry-strahl"></div>
                        <div class="sched-dry-hinweis" id="schedule-dry-hinweis"></div>
                    </div>
                </div>

                <!--3. Material: spool, and -- with multiple plates/nozzles -- the
                     filament per nozzle.-->
                <div class="ui-karte" id="schedule-material-karte" style="display:none;">
                    <div class="ui-karte-kopf">
                        <svg class="hd-ic" viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v12c0 1.7 3.1 3 7 3s7-1.3 7-3V6"/></svg>
                        <span id="schedule-select-filament"></span>
                    </div>
                    <div class="ui-zeile" id="schedule-spool-container" style="display:none;">
                        <span class="ui-zeile-name" id="schedule-spool-label"></span>
                        <!--Same picker as in the material card: the
                             window shows color and remaining amount, and the
                             spools matching the file are listed first. The list
                             stays hidden -- the send path reads it.-->
                        <button type="button" class="mz-spulknopf ui-breit" id="schedule-spool-knopf"
                                onclick="window.printScheduler.oeffneSpulenwahl()">
                            <span id="schedule-spool-punkt" class="mz-spulknopf__punkt"></span>
                            <span id="schedule-spool-text" data-i18n="spool_choose">Spule wählen</span>
                            <svg class="hd-ic hd-ic--xs" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M19 12l-7 7-7-7"/></svg>
                        </button>
                        <select id="schedule-spool" class="sd-spool-select ui-breit" style="display:none;">
                            <option value="" id="schedule-no-spool"></option>
                        </select>
                    </div>
                    <!--What the file requires vs. what is selected.-->
                    <div id="schedule-spool-hinweis" class="sched-spulhinweis" style="display:none;"></div>
                    <div id="schedule-filament"></div>
                </div>

                <!--Plate selection only when the file has several.-->
                <div class="ui-karte" data-leer-ausblenden style="display:none;">
                    <div class="ui-karte-kopf">
                        <svg class="hd-ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="18" height="11" rx="2"/><path d="M3 12h18"/></svg>
                        <span id="schedule-plate-label"></span>
                    </div>
                    <div id="schedule-platte"></div>
                </div>

                <!--4. Print options: a grid, same layout per type.-->
                <div class="ui-karte prep-wide" data-leer-ausblenden>
                    <div class="ui-karte-kopf">
                        <svg class="hd-ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>
                        <span id="schedule-print-options"></span>
                    </div>
                    <div id="schedule-optionen"></div>
                    <input type="hidden" id="schedule-plate" value="1">
                </div>

                <!--Loading indicator for print preparation-->
                <div id="schedule-prepare"></div>

            </div>

            <div id="schedule-error" class="sched-form-error" style="display:none;">
                <svg class="hd-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 9v5M12 17.5v.5"/><path d="M10.3 4.3 2.6 18a2 2 0 0 0 1.7 3h15.4a2 2 0 0 0 1.7-3L13.7 4.3a2 2 0 0 0-3.4 0z"/></svg>
                <span id="schedule-error-text"></span>
            </div>

            <div class="ui-fuss">
                <button class="modal-btn modal-btn-cancel" onclick="closeScheduleModal()">
                    <span id="schedule-cancel-btn"></span>
                </button>
                <button class="modal-btn modal-btn-success" id="schedule-confirm-button" onclick="confirmSchedulePrint()">
                    <svg class="hd-ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
                    <span id="schedule-confirm-btn"></span>
                </button>
            </div>
        </div>
    </div>
