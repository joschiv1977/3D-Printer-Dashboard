<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="color-scheme" content="dark light">
    <!--DNS-PREFETCH for faster .local resolution-->

    <!--Also for other possible hostnames-->
    <link rel="dns-prefetch" href="//printer.local">
    <link rel="dns-prefetch" href="//pi.local">

    <title>3D Drucker Dashboard</title>
    <!-- Favicons & App Icons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico">

    <!--Shared Styles and Modules-->
    <!--One CSS bundle instead of 15 separate files: each one blocked
         the first paint and waited behind the TLS handshake of the
         next free connection. Order = cascade,
         maintained in services/asset_bundle.py (CSS_ORDER).-->
    <link rel="stylesheet" href="/static/css/app-bundle.css">

    <!--The printer message deliberately sits OUTSIDE the bundle: it belongs
         on every page, and the console, history and the rest do not have a
         bundle. One file for all nine.-->
    <link rel="stylesheet" href="/static/css/meldungen.css">

    <!--Load language files.
        Deliberately as plain tags: a document.write approach (only the
        needed language) measured LOWER performance -- it stops the
        preload scanner, adding 270ms to the head, while parsing all
        five files together costs only 3ms. -->
    <script src="/static/lang/de.js?v={{ LANG_VERSION }}"></script>
    <script src="/static/lang/en.js?v={{ LANG_VERSION }}"></script>
    <script src="/static/lang/fr.js?v={{ LANG_VERSION }}"></script>
    <script src="/static/lang/es.js?v={{ LANG_VERSION }}"></script>
    <script src="/static/lang/it.js?v={{ LANG_VERSION }}"></script>
    <!--Load auth handler-->
    <script src="/static/auth-handler.js"></script>

    <!--Firebase FCM is injected by preload.js (electron-app/firebase-init.js)-->
    <!--electron-push-receiver is injected by preload.js (electron-app/push-receiver-init.js)-->

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json">

    <!-- PWA Icons -->
    <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/static/icon-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/static/icon-512x512.png">

    <link rel="stylesheet" href="/static/font-awesome.min.css">

    <!--Modular CSS files (iOS Design System)-->

    <!-- Camera stream loaded dynamically based on mode (mp4/mjpeg) -->
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#0F1419" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#F3F3F7" media="(prefers-color-scheme: light)">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="3D Drucker">
    <meta name="application-name" content="3D Drucker">
    <script src="/static/socket.io.js"></script>
    <script src="/static/chart.umd.js"></script>
    <!--GridStack.js for drag & drop dashboard (local)-->
    <link rel="stylesheet" href="/static/gridstack.min.css">
    <script src="/static/gridstack-all.js"></script>
</head>
